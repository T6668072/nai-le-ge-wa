<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>奶了个蛙</title>
    <style>
        /* ========== 全局设置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #7ec86f, #4a9d5f); /* 草地绿背景 */
            display: flex; align-items: center; justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 8px;
            overflow: hidden;              /* 缩放适配后不出滚动条 */
        }
        /* 游戏主体：由 fitScreen() 按屏幕整体缩放，任何屏幕都"刚好占满" */
        #stage {
            display: flex; flex-direction: column; align-items: center;
        }
        h1 {
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .25);
            margin-bottom: 8px;
            font-size: 28px;
        }
        #levelInfo { color: rgba(255,255,255,.95); font-size: 16px; margin-bottom: 6px; }
        #stats { color: rgba(255,255,255,.95); font-size: 14px; margin-bottom: 14px; }

        /* ========== 牌堆区 ========== */
        #board {
            position: relative;          /* 关键点1：牌堆区是"定位参照物" */
            width: var(--bw, 552px); height: var(--bh, 512px);
            background: rgba(255, 255, 255, .18);
            border-radius: 16px;
        }
        .tile {
            position: absolute;          /* 关键点2：每张牌用 left/top 摆位置 */
            width: var(--ts, 72px); height: var(--ts, 72px);   /* 尺寸由关卡决定 */
            background: #fffdf5;
            border-radius: 10px;
            border: 2px solid #e8d9b0;
            box-shadow: 0 3px 0 #d9c48e, 0 5px 8px rgba(0, 0, 0, .2); /* 厚度感 */
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform .1s;
        }
        .tile:hover { transform: translateY(-2px); }   /* 鼠标悬停微微浮起 */
        .tile .face { font-size: calc(var(--ts, 72px) * .55); }  /* emoji 占位图案 */
        .tile img {                                    /* 真图片盖在 emoji 上 */
            position: absolute; left: 6px; top: 6px;
            width: calc(var(--ts, 72px) - 12px); height: calc(var(--ts, 72px) - 12px);
            object-fit: contain;                       /* 等比例缩放，完整装进方块不变形 */
            border-radius: 6px;
            pointer-events: none;
        }
        /* 关键点3：被压住的牌变暗、不准点 */
        .tile.covered { filter: brightness(.55); cursor: default; }
        .tile.covered:hover { transform: none; }

        /* 飞行中的牌：脱离牌堆、飘向卡槽 */
        .fly {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            transition: left .25s ease-in, top .25s ease-in, width .25s ease-in, height .25s ease-in;
        }

        /* ========== 底部 7 格槽位 ========== */
        #slotBar {
            margin-top: 24px;
            display: inline-flex; gap: 6px; padding: 6px;
            background: rgba(0, 0, 0, .25);
            border-radius: 14px;
        }
        .slot {
            width: var(--ts, 72px); height: var(--ts, 72px);
            background: rgba(255, 255, 255, .9);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .slot .face { font-size: calc(var(--ts, 72px) * .55); }
        .slot img {
            position: absolute; left: 6px; top: 6px;
            width: calc(var(--ts, 72px) - 12px); height: calc(var(--ts, 72px) - 12px);
            object-fit: contain;
            border-radius: 6px;
            pointer-events: none;
        }

        #tip { margin-top: 12px; color: rgba(255,255,255,.85); font-size: 14px; }
        .linkbtn {
            margin-top: 10px;
            background: none; border: none;
            color: rgba(255,255,255,.9); font-size: 14px;
            cursor: pointer; text-decoration: underline;
        }

        /* ========== 胜利/失败 弹窗 ========== */
        #overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .55);
            display: none;                 /* 默认隐藏，加 .show 才出现 */
            align-items: center; justify-content: center;
            z-index: 99;
        }
        #overlay.show { display: flex; }
        #overlay .card {
            background: #fffdf5;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
        }
        #overlayMsg { font-size: 32px; font-weight: bold; color: #5a4a2f; }
        #overlay .sub { font-size: 14px; margin-top: 12px; color: #999; }
        .btn {
            margin-top: 20px;
            padding: 10px 32px;
            font-size: 18px;
            border: none; border-radius: 12px;
            background: #6dbf5e; color: #fff;
            cursor: pointer;
        }
        .btn:hover { background: #5cae4e; }
        .btn.revive { background: #e8836f; margin-left: 12px; }
        .btn.revive:hover { background: #d9705c; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        /* ========== 工具栏 ========== */
        #toolbar { margin-top: 14px; display: flex; gap: 12px; }
        .tool {
            min-width: 92px; padding: 8px 10px;
            border: none; border-radius: 12px;
            background: rgba(255, 255, 255, .92); color: #5a4a2f;
            font-size: 15px; line-height: 1.4;
            cursor: pointer;
        }
        .tool small { font-size: 12px; color: #b8860b; }
        .tool:disabled { opacity: .45; cursor: not-allowed; }

    </style>
</head>
<body>
    <div id="stage">
    <h1>🐸 奶了个蛙</h1>
    <div id="levelInfo"></div>
    <div id="stats">⏱ <span id="timeText">00:00</span>　·　🖱 步数 <span id="movesText">0</span>　·　🪙 金币 <span id="coinsText">0</span>　·　🏆 胜 <span id="winsText">0</span> / 负 <span id="losesText">0</span></div>

    <!-- 牌堆区：牌由 JS 动态生成，这里只放空容器 -->
    <div id="board"></div>

    <!-- 底部槽位：7 个格子 -->
    <div id="slotBar">
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div>
    </div>

    <div id="toolbar">
        <button id="shuffleBtn" class="tool">🔀 打乱<br><small>10 金币</small></button>
        <button id="removeBtn" class="tool">📤 移出<br><small>10 金币</small></button>
    </div>

    <p id="tip">规则：点没被压住的牌入槽 → 凑齐 3 只自动消除 → 槽满 7 格失败 / 全部消完进下一关</p>
    <button id="restartBtn" class="linkbtn">↻ 重开本关</button>
    </div>

    <!-- 胜负弹窗 -->
    <div id="overlay">
        <div class="card">
            <div id="overlayMsg"></div>
            <div class="sub" id="overlaySub"></div>
            <button id="overlayBtn" class="btn"></button>
            <button id="reviveBtn" class="btn revive" style="display:none">💘 复活（10 金币）</button>
        </div>
    </div>

        /* ========= 关卡表：10 关，牌数逐级递增 =========
           注意：三消规则要求总数是 3 的倍数，
           所以 50→51、100→102 等，都往上凑齐 */
        const LEVEL_COUNTS = [27, 51, 102, 150, 201, 252, 300, 351, 402, 450];

        const SLOT_MAX = 7;      // 槽位上限
        let WX = 86;             // 两侧翼列区宽度
        let BOARD_W = 552;       // 牌堆区宽高（按关卡计算，与 CSS 变量同步）
        let BOARD_H = 512;
        let TILE_SIZE = 72;      // 当前关卡的牌边长（随关卡变化）

        /* ========= 游戏状态（整个游戏的"记忆"） ========= */
        let level = 1;          // 当前第几关（1~10）
        let tiles = [];         // 牌堆里所有牌
        let slot = [];          // 底部槽位里的牌（按入槽顺序）
        let gameOver = false;   // 结束后锁死点击
        let moves = 0;          // 本关步数
        let seconds = 0;        // 本关已用秒数
        let timerId = null;     // 计时器句柄

        /* ========= 计时器：开局启动，结束停表 ========= */
        function startTimer() {
            stopTimer();
            seconds = 0;
            updateTime();
            timerId = setInterval(() => { seconds++; updateTime(); }, 1000);
        }
        function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
        function resumeTimer() { if (!timerId) timerId = setInterval(() => { seconds++; updateTime(); }, 1000); }
        function updateTime() {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timeText').textContent = m + ':' + s;
        }

        /* ========= 胜负记录：存浏览器 localStorage，关掉网页也不丢 ========= */
        function loadStats() {
            try { return JSON.parse(localStorage.getItem('yygy-stats')) || { wins: 0, loses: 0 }; }
            catch (e) { return { wins: 0, loses: 0 }; }
        }
        function renderStats() {
            const st = loadStats();
            document.getElementById('winsText').textContent = st.wins;
            document.getElementById('losesText').textContent = st.loses;
        }
        function addStat(key) {
            const st = loadStats();
            st[key]++;
            try { localStorage.setItem('yygy-stats', JSON.stringify(st)); } catch (e) {}
            renderStats();
        }

        /* ========= 金币与工具：通关 +2 币，工具每个 10 币 ========= */
        const TOOL_COST = 10;
        let coins = loadCoins();
        function loadCoins() {
            try { return parseInt(localStorage.getItem('yygy-coins')) || 0; } catch (e) { return 0; }
        }
        function saveCoins() {
            try { localStorage.setItem('yygy-coins', String(coins)); } catch (e) {}
        }
        function renderCoins() {
            document.getElementById('coinsText').textContent = coins;
            updateToolButtons();
        }
        function updateToolButtons() {
            const poor = coins < TOOL_COST;
            document.getElementById('shuffleBtn').disabled = poor || gameOver;
            document.getElementById('removeBtn').disabled = poor || gameOver || slot.length === 0;
            document.getElementById('reviveBtn').disabled = poor;
        }

        /* 打乱：把牌堆里剩余牌的图案重新洗牌（位置不动、脸型重排） */
        function useShuffle() {
            if (gameOver || coins < TOOL_COST) return;
            coins -= TOOL_COST; saveCoins(); renderCoins();
            const alive = tiles.filter(t => !t.removed);
            const faces = shuffle(alive.map(t => t.p));
            alive.forEach((t, i) => { t.p = faces[i]; });
            renderBoard();
        }

        /* 移出：把槽里最后至多 3 张牌退回牌堆，腾出槽位救急 */
        function useRemove() {
            if (gameOver || coins < TOOL_COST || slot.length === 0) return;
            coins -= TOOL_COST; saveCoins(); renderCoins();
            slot.splice(-3).forEach(t => { t.removed = false; });
            renderAll();
        }

        /* 复活：失败时把槽里所有牌退回牌堆、继续本局（计时继续） */
        function useRevive() {
            if (coins < TOOL_COST) return;
            coins -= TOOL_COST; saveCoins(); renderCoins();
            slot.forEach(t => { t.removed = false; });
            slot = [];
            gameOver = false;
            document.getElementById('overlay').classList.remove('show');
            resumeTimer();
            renderAll();
        }

        /* 洗牌算法：把数组顺序随机打乱（发牌公平全靠它） */
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /* 牌越多牌越小，否则屏幕装不下 */
        function pickTileSize(count) {
            if (count <= 51) return 72;
            if (count <= 102) return 60;
            if (count <= 201) return 48;
            return 40;
        }

        /* ========= 关卡布局生成器 =========
           思路：第 0 层按网格铺满 → 第 1 层错开半格铺 → 第 2 层再对齐铺……
           一层层往上堆，直到位置数够本关牌数为止 */
        function buildLayout(count, size) {
            const step = size + 8;   // 同层间距：比牌宽一点，保证同层互不重叠
            const positions = [];
            const wxL = (WX - size) / 2;
            const wxR = WX + 380 + (WX - size) / 2;
            let SIDE_H;              // 侧边堆叠区需要的高度

            /* --- ① 两侧堆叠区 ---
               第 1、2 关：每侧 1 摞 4 张的细边小叠摞
               第 3 关起：收纳本关 60% 的牌（多数），每侧 3 摞深堆，
               摞内每层微移露边，深度自动计算 */
            if (level >= 3) {
                const perSide = Math.floor(count * 0.6 / 2);
                const STACKS = 3;                          // 每侧 3 摞
                const depth = Math.ceil(perSide / STACKS); // 每摞深度
                const peek = Math.max(4, Math.round(size * 0.10));
                const pileH = size + (depth - 1) * peek;
                SIDE_H = STACKS * pileH + (STACKS - 1) * 10 + 20;
                for (let sIdx = 0; sIdx < STACKS; sIdx++) {
                    const y = 10 + sIdx * (pileH + 10);
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxL, y: y + k * peek });
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxR, y: y + k * peek });
                }
            } else {
                const WING = 4;
                const peek = Math.max(6, Math.round(size * 0.12));
                const wy0 = (420 - (size + (WING - 1) * peek)) / 2;
                for (let k = 0; k < WING; k++) {
                    positions.push({ layer: k, x: wxL, y: wy0 + k * peek });
                    positions.push({ layer: k, x: wxR, y: wy0 + k * peek });
                }
                SIDE_H = 420;
            }

            /* --- 牌堆区总高度 = 侧区与中央区取大者 + 底部平铺排 --- */
            const CH = Math.max(420, SIDE_H);   // 中央区高度
            BOARD_H = CH + size + 20;

            /* --- ② 底部平铺排：单层摆一排，开局全部可点（原版的"安全区"） --- */
            const BOTTOM = 6;
            const bw = BOTTOM * step - 8;
            const bx0 = (BOARD_W - bw) / 2;
            for (let i = 0; i < BOTTOM; i++)
                positions.push({ layer: 0, x: bx0 + i * step, y: BOARD_H - size - 10 });

            /* --- ③ 中央主堆：剩下的牌进这里，交替层叠成原版标志性牌堆 --- */
            function mkGrid(x0, y0) {
                const pts = [];
                for (let y = y0; y + size <= CH - 10; y += step)
                    for (let x = x0; x + size <= WX + 380 - 10; x += step)
                        pts.push({ x, y });
                return pts;
            }
            // 所有关卡统一仿照第 1 关：上层错开半格、交叠成连续牌堆（不离散）
            const off = step / 2;
            const grids = [mkGrid(WX + 20, 20), mkGrid(WX + 20 + off, 20 + off)];

            // 向心聚拢：按"离中心距离"排序、由近及远取位置——
            // 牌少时挤成紧凑一坨，牌多时自然铺满，不会东一张西一张
            const cx = WX + 190, cy = CH / 2;   // 中央区域的中心点
            const byCenter = (a, b) =>
                ((a.x - cx) ** 2 + (a.y - cy) ** 2) - ((b.x - cx) ** 2 + (b.y - cy) ** 2);

            let layer = 0;
            while (positions.length < count) {
                const need = count - positions.length;
                const pts = grids[layer % 2].slice().sort(byCenter).slice(0, need);
                for (const p of pts) positions.push({ layer, x: p.x, y: p.y });
                layer++;
            }
            return positions;
        }

        /* 开新一局：按关卡发牌 */
        function newGame() {
            const count = LEVEL_COUNTS[level - 1];
            TILE_SIZE = pickTileSize(count);
            // 牌堆区宽度 = 左右翼列 + 中央 380 宽；高度由 buildLayout 按关卡计算
            WX = TILE_SIZE + 14;
            BOARD_W = WX + 380 + WX;
            const layout = buildLayout(count, TILE_SIZE);   // 内部同时算出 BOARD_H
            const root = document.documentElement.style;
            root.setProperty('--ts', TILE_SIZE + 'px');
            root.setProperty('--bw', BOARD_W + 'px');
            root.setProperty('--bh', BOARD_H + 'px');

            // 发牌：先算出"三元组"总数，均分给 9 种图案，
            // 保证每种图案的张数都是 3 的倍数 → 数学上永远能消干净
            const triples = count / 3;
            const base = Math.floor(triples / PATTERNS.length);
            const rem = triples % PATTERNS.length;
            const bag = [];
            for (let p = 0; p < PATTERNS.length; p++) {
                const t = base + (p < rem ? 1 : 0);   // 这种图案分到的三元组数
                for (let k = 0; k < t * 3; k++) bag.push(p);
            }
            shuffle(bag);

            tiles = layout.map((pos, i) => ({
                id: i, layer: pos.layer, x: pos.x, y: pos.y,
                p: bag[i],          // 这张牌是几号图案
                removed: false,     // 是否已被消掉/入槽
            }));
            slot = [];
            gameOver = false;
            moves = 0;
            document.getElementById('movesText').textContent = '0';
            startTimer();
            renderStats();
            renderCoins();
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('levelInfo').textContent =
                '第 ' + level + ' 关 / 共 ' + LEVEL_COUNTS.length + ' 关 · 本关 ' + count + ' 张牌';
            renderAll();
            fitScreen();
        }

        /* 判断一张牌是否被压住：存在"层级更高 + 位置重叠 + 还没消失"的牌 */
        function isCovered(tile) {
            return tiles.some(o =>
                !o.removed &&
                o.layer > tile.layer &&
                Math.abs(o.x - tile.x) < TILE_SIZE &&
                Math.abs(o.y - tile.y) < TILE_SIZE
            );
        }

        /* ========= 渲染：把状态画到页面上 ========= */
        function tileHTML(p) {
            const pat = PATTERNS[p];
            return '<span class="face">' + pat.emoji + '</span>' +
                '<img src="' + pat.file + '" onerror="this.remove()">';
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            tiles.filter(t => !t.removed)
                .sort((a, b) => a.layer - b.layer)   // 下层先画，上层盖住
                .forEach(tile => {
                    const div = document.createElement('div');
                    div.className = 'tile' + (isCovered(tile) ? ' covered' : '');
                    div.style.left = tile.x + 'px';
                    div.style.top = tile.y + 'px';
                    div.style.zIndex = tile.layer;
                    div.dataset.id = tile.id;        // 把编号存在元素上，点击时取回
                    div.innerHTML = tileHTML(tile.p);
                    board.appendChild(div);
                });
        }

        function renderSlot() {
            const cells = document.querySelectorAll('#slotBar .slot');
            cells.forEach((cell, i) => {
                cell.innerHTML = '';
                if (i < slot.length) cell.innerHTML = tileHTML(slot[i].p);
            });
        }

        function renderAll() { renderBoard(); renderSlot(); updateToolButtons(); }

        /* ========= 飞入卡槽动画 =========
           造一张"分身牌"固定在屏幕原位，用 CSS 过渡飘到目标格子，
           落地后删除分身、刷新卡槽显示 */
        function flyToSlot(tile, fromRect, cellIndex) {
            const cells = document.querySelectorAll('#slotBar .slot');
            const toRect = cells[Math.min(cellIndex, SLOT_MAX - 1)].getBoundingClientRect();
            const fly = document.createElement('div');
            fly.className = 'tile fly';
            fly.innerHTML = tileHTML(tile.p);
            fly.style.left = fromRect.left + 'px';
            fly.style.top = fromRect.top + 'px';
            fly.style.width = fromRect.width + 'px';
            fly.style.height = fromRect.height + 'px';
            document.body.appendChild(fly);

            // 双 rAF：确保浏览器先记住"起点"，再改样式触发过渡动画
            requestAnimationFrame(() => requestAnimationFrame(() => {
                fly.style.left = toRect.left + 'px';
                fly.style.top = toRect.top + 'px';
                fly.style.width = toRect.width + 'px';
                fly.style.height = toRect.height + 'px';
            }));

            const land = () => { if (fly.isConnected) { fly.remove(); renderSlot(); } };
            fly.addEventListener('transitionend', land, { once: true });
            setTimeout(land, 350);   // 保险：动画万一没触发也兜底落地
        }

        /* ========= 核心逻辑：点击一张牌 ========= */
        function onTileClick(id, fromEl) {
            if (gameOver) return;
            const tile = tiles.find(t => t.id === id);
            if (!tile || tile.removed || isCovered(tile)) return;  // 被压住的牌点不动

            const fromRect = fromEl.getBoundingClientRect();  // 先记住起飞位置
            moves++;                                          // 记一步
            document.getElementById('movesText').textContent = moves;

            // 第 1 步：牌离开牌堆
            tile.removed = true;

            // 第 2 步：插入槽位——挨着同类放，方便凑三消
            let idx = slot.length;
            for (let i = slot.length - 1; i >= 0; i--) {
                if (slot[i].p === tile.p) { idx = i + 1; break; }
            }
            slot.splice(idx, 0, tile);

            // 第 3 步：凑齐 3 只同图案 → 一起消除
            const matched = slot.filter(t => t.p === tile.p).length === 3;
            if (matched) slot = slot.filter(t => t.p !== tile.p);

            renderBoard();                 // 牌堆立刻更新（暗牌可能变亮）
            flyToSlot(tile, fromRect, idx); // 卡槽等分身落地后再刷新
            checkEnd();
        }

        /* ========= 胜负判定 ========= */
        function checkEnd() {
            const boardClear = tiles.every(t => t.removed);
            if (boardClear && slot.length === 0) {
                stopTimer();
                addStat('wins');
                coins += 2; saveCoins(); renderCoins();   // 通关奖赏：2 金币（存本机浏览器）
                const reward = '🪙 金币 +2！当前 ' + coins + ' 币';
                if (level < LEVEL_COUNTS.length) {
                    showOverlay('🎉 第 ' + level + ' 关通关！', '下一关 →', () => { level++; newGame(); }, reward);
                } else {
                    showOverlay('🏆 太强了！十关全部通关！', '再玩一遍', () => { level = 1; newGame(); }, reward);
                }
            } else if (slot.length >= SLOT_MAX) {
                stopTimer();
                addStat('loses');
                showOverlay('😭 槽位满了，挑战失败！', '重试本关', () => newGame(), '🪙 当前 ' + coins + ' 金币', true);
            }
        }

        function showOverlay(msg, btnText, action, extra, showRevive) {
            gameOver = true;
            document.getElementById('overlayMsg').textContent = msg;
            document.getElementById('overlaySub').textContent =
                '当前进度：第 ' + level + ' 关 / ' + LEVEL_COUNTS.length + ' 关' +
                ' · 用时 ' + document.getElementById('timeText').textContent +
                ' · 步数 ' + moves + (extra ? ' · ' + extra : '');
            const btn = document.getElementById('overlayBtn');
            btn.textContent = btnText;
            btn.onclick = action;
            document.getElementById('reviveBtn').style.display = showRevive ? 'inline-block' : 'none';
            updateToolButtons();
            document.getElementById('overlay').classList.add('show');
        }

        /* 事件委托：整个牌堆只装一个监听器，点谁都能接到 */
        document.getElementById('board').addEventListener('click', e => {
            const el = e.target.closest('.tile');
            if (el) onTileClick(Number(el.dataset.id), el);
        });
        document.getElementById('restartBtn').addEventListener('click', () => newGame());
        document.getElementById('shuffleBtn').addEventListener('click', useShuffle);
        document.getElementById('removeBtn').addEventListener('click', useRemove);
        document.getElementById('reviveBtn').addEventListener('click', useRevive);

        /* ========= 全屏适配：按屏幕尺寸整体缩放游戏 =========
           先按 1 倍量出游戏的"自然尺寸"，再取 屏幕宽/游戏宽 与 屏幕高/游戏高
           的较小值作为缩放比——保证任何屏幕（电脑/手机）都刚好装得下、占得满 */
        function fitScreen() {
            const stage = document.getElementById('stage');
            stage.style.zoom = 1;
            const s = Math.min(innerWidth / stage.offsetWidth, innerHeight / stage.offsetHeight, 3);
            stage.style.zoom = s;
        }
        addEventListener('resize', fitScreen);   // 窗口变化/手机横竖屏切换时重新适配

        newGame();   // 页面加载完成 → 直接发牌开局
    </script>
</body>
</html>
