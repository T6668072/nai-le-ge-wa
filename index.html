<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>奶了个蛙</title>
    <style>
        /* ========== 全局设置 ========== */
        :root {
            --game-bg: none;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #7ec86f, #4a9d5f); /* 草地绿背景 */
            display: flex; align-items: center; justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 8px;
            overflow: hidden;              /* 缩放适配后不出滚动条 */
            position: relative;
            transition: background-color .45s ease;
        }
        /* 选好主题后，用淡化图片垫在游戏最底层，不抢牌面的视觉重点 */
        body::before {
            content: "";
            position: fixed;
            inset: -3%;
            background-image: var(--game-bg);
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: saturate(.72) brightness(1.08);
            transform: scale(1.04);
            transition: opacity .55s ease;
            pointer-events: none;
            z-index: 0;
        }
        body.in-game {
            background: #79b56b;
        }
        body.in-game::before {
            opacity: .64;
        }
        /* 游戏主体：由 fitScreen() 按屏幕整体缩放，任何屏幕都"刚好占满" */
        #stage {
            display: flex; flex-direction: column; align-items: center;
            position: relative;
            z-index: 2;
        }
        #stage:not(.active) {
            display: none;
        }
        #gameTitle {
            display: block;
            width: auto;
            height: clamp(68px, 8vh, 84px);
            max-width: 220px;
            object-fit: contain;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .2));
        }
        #levelInfo { color: rgba(255,255,255,.95); font-size: 16px; margin-bottom: 6px; }
        #stats { color: rgba(255,255,255,.95); font-size: 14px; margin-bottom: 14px; }

        /* ========== 牌堆区 ========== */
        #board {
            position: relative;          /* 关键点1：牌堆区是"定位参照物" */
            width: var(--bw, 552px); height: var(--bh, 512px);
            background: rgba(255, 255, 255, .18);
            border-radius: 16px;
        }
        .tile {
            position: absolute;          /* 关键点2：每张牌用 left/top 摆位置 */
            width: var(--ts, 72px); height: var(--ts, 72px);   /* 尺寸由关卡决定 */
            background: #fffdf5;
            border-radius: 10px;
            border: 2px solid #e8d9b0;
            box-shadow: 0 3px 0 #d9c48e, 0 5px 8px rgba(0, 0, 0, .2); /* 厚度感 */
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform .1s;
        }
        .tile:hover { transform: translateY(-2px); }   /* 鼠标悬停微微浮起 */
        .tile .face { font-size: calc(var(--ts, 72px) * .55); }  /* emoji 占位图案 */
        .tile img {                                    /* 真图片盖在 emoji 上 */
            position: absolute; left: 6px; top: 6px;
            width: calc(var(--ts, 72px) - 12px); height: calc(var(--ts, 72px) - 12px);
            object-fit: contain;                       /* 等比例缩放，完整装进方块不变形 */
            border-radius: 6px;
            pointer-events: none;
        }
        /* 关键点3：被压住的牌变暗、不准点 */
        .tile.covered { filter: brightness(.55); cursor: default; }
        .tile.covered:hover { transform: none; }

        /* 飞行中的牌：脱离牌堆、飘向卡槽 */
        .fly {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            transition: left .25s ease-in, top .25s ease-in, width .25s ease-in, height .25s ease-in;
        }

        /* ========== 底部 7 格槽位 ========== */
        #slotBar {
            margin-top: 24px;
            display: inline-flex; gap: 6px; padding: 6px;
            background: rgba(0, 0, 0, .25);
            border-radius: 14px;
        }
        .slot {
            width: var(--ts, 72px); height: var(--ts, 72px);
            background: rgba(255, 255, 255, .9);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .slot .face { font-size: calc(var(--ts, 72px) * .55); }
        .slot img {
            position: absolute; left: 6px; top: 6px;
            width: calc(var(--ts, 72px) - 12px); height: calc(var(--ts, 72px) - 12px);
            object-fit: contain;
            border-radius: 6px;
            pointer-events: none;
        }

        #tip { margin-top: 12px; color: rgba(255,255,255,.85); font-size: 14px; }
        .linkbtn {
            margin-top: 10px;
            background: none; border: none;
            color: rgba(255,255,255,.9); font-size: 14px;
            cursor: pointer; text-decoration: underline;
        }

        /* ========== 胜利/失败 弹窗 ========== */
        #overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .55);
            display: none;                 /* 默认隐藏，加 .show 才出现 */
            align-items: center; justify-content: center;
            z-index: 99;
        }
        #overlay.show { display: flex; }
        #overlay .card {
            background: #fffdf5;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
        }
        #overlayMsg { font-size: 32px; font-weight: bold; color: #5a4a2f; }
        #overlay .sub { font-size: 14px; margin-top: 12px; color: #999; }
        .btn {
            margin-top: 20px;
            padding: 10px 32px;
            font-size: 18px;
            border: none; border-radius: 12px;
            background: #6dbf5e; color: #fff;
            cursor: pointer;
        }
        .btn:hover { background: #5cae4e; }
        .btn.revive { background: #e8836f; margin-left: 12px; }
        .btn.revive:hover { background: #d9705c; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        /* ========== 工具栏 ========== */
        #toolbar { margin-top: 14px; display: flex; gap: 12px; }
        .tool {
            min-width: 92px; padding: 8px 10px;
            border: none; border-radius: 12px;
            background: rgba(255, 255, 255, .92); color: #5a4a2f;
            font-size: 15px; line-height: 1.4;
            cursor: pointer;
        }
        .tool small { font-size: 12px; color: #b8860b; }
        .tool:disabled { opacity: .45; cursor: not-allowed; }

        /* ===================================================================
           背景音乐：顶栏按钮 + 音量面板
           =================================================================== */
        #topbar {
            position: fixed; top: 10px; right: 10px;
            display: none; gap: 8px; align-items: center; z-index: 80;
        }
        body.in-game #topbar {
            display: flex;
        }
        .pill {
            border: none; border-radius: 999px;
            padding: 8px 14px; font-size: 14px; line-height: 1;
            background: rgba(255, 255, 255, .92); color: #4a5a3f;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
            cursor: pointer; white-space: nowrap;
        }
        .pill:active { transform: translateY(1px); }
        .pill.off { opacity: .68; }
        .pill.icon { padding: 8px 11px; font-size: 15px; }
        .pill .lbl { margin-left: 4px; }

        #musicSheet {
            position: fixed; inset: 0; z-index: 120;
            background: rgba(0, 0, 0, .5);
            display: none; align-items: center; justify-content: center;
            padding: 16px; overflow: auto;
        }
        #musicSheet.show { display: flex; }
        #musicSheet .panel {
            width: 100%; max-width: 360px;
            background: #fffdf5; border-radius: 18px; padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .3);
            color: #5a4a2f; font-size: 14px;
        }
        #musicSheet h2 { font-size: 17px; color: #4a7a3f; margin-bottom: 6px; }
        #musicSheet .hint { font-size: 12px; color: #a09580; line-height: 1.6; margin-bottom: 14px; }
        #musicSheet .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        #musicSheet input[type=range] { width: 100%; accent-color: #6dbf5e; }
        #musicSheet .btn-close {
            width: 100%; margin-top: 14px; padding: 10px;
            border: none; border-radius: 10px; font-size: 14px;
            background: #6dbf5e; color: #fff; cursor: pointer;
        }
        #musicSheet .btn-close.ghost { background: #efe9da; color: #6b6152; margin-top: 8px; }

        @media (max-width: 480px) {
            .pill { padding: 9px 11px; font-size: 13px; }
            .pill .lbl { display: none; }   /* 小屏只留图标，别挡住标题 */
        }

        /* ========== 开始界面 ========== */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding: clamp(24px, 5vh, 58px) 20px 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(21,63,37,.04) 58%, rgba(17,50,29,.2) 100%),
                url("assets/start-bg.jpg") center / cover no-repeat;
            transition: opacity .35s ease, visibility .35s ease;
        }
        #startScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #startHero {
            position: absolute;
            top: clamp(16px, 3.5vh, 34px);
            left: clamp(16px, 3vw, 38px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: min(46vw, 330px);
            margin-top: 0;
            z-index: 1;
            transition: opacity .25s ease, transform .25s ease;
        }
        #startTitle {
            width: min(38vw, 310px);
            max-height: 27vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 14px rgba(35, 72, 41, .22));
            animation: titleFloat 3.4s ease-in-out infinite;
        }
        #startTagline {
            margin-top: 8px;
            color: #3d5e3d;
            background: rgba(255, 253, 238, .65);
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 999px;
            padding: 6px 13px;
            font-size: clamp(10px, 1.15vw, 13px);
            letter-spacing: .12em;
            box-shadow: 0 5px 16px rgba(44, 81, 46, .1);
            backdrop-filter: blur(6px);
        }
        #startButtonWrap {
            margin-top: auto;
            padding-bottom: clamp(48px, 10vh, 102px);
        }
        #startBtn {
            min-width: min(62vw, 290px);
            padding: 16px 48px 17px;
            border: 3px solid rgba(255,255,255,.9);
            border-radius: 999px;
            color: #fffdf1;
            background: linear-gradient(180deg, #78cf67, #3f9f55);
            box-shadow:
                0 7px 0 #2f7e43,
                0 14px 26px rgba(28, 75, 39, .32),
                inset 0 1px 0 rgba(255,255,255,.38);
            font-family: inherit;
            font-size: clamp(20px, 2.4vw, 26px);
            font-weight: 800;
            letter-spacing: .2em;
            text-indent: .2em;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
        }
        #startBtn:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);
            box-shadow:
                0 9px 0 #2f7e43,
                0 17px 32px rgba(28, 75, 39, .34),
                inset 0 1px 0 rgba(255,255,255,.38);
        }
        #startBtn:active {
            transform: translateY(4px);
            box-shadow:
                0 3px 0 #2f7e43,
                0 8px 18px rgba(28, 75, 39, .28),
                inset 0 1px 0 rgba(255,255,255,.3);
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) rotate(-.5deg); }
            50% { transform: translateY(-7px) rotate(.5deg); }
        }

        /* ========== 八款背景主题 ========== */
        #themeScreen {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: none;
            padding: clamp(18px, 4vh, 46px) clamp(16px, 3vw, 42px);
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.18), transparent 48%),
                rgba(20, 51, 31, .9);
            backdrop-filter: blur(8px);
            overflow: auto;
        }
        #startScreen.theme-open #startHero,
        #startScreen.theme-open #startButtonWrap {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
        }
        #startScreen.theme-open #themeScreen {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-panel {
            width: min(100%, 920px);
            margin: auto;
            text-align: center;
        }
        .theme-panel h2 {
            color: #fffdf0;
            font-size: clamp(22px, 3.2vw, 34px);
            letter-spacing: .1em;
            text-shadow: 0 3px 12px rgba(0,0,0,.24);
        }
        .theme-panel .theme-hint {
            color: rgba(255,255,255,.8);
            font-size: clamp(12px, 1.5vw, 15px);
            margin: 9px 0 clamp(16px, 3vh, 26px);
        }
        #themeGrid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(10px, 1.7vw, 18px);
        }
        .theme-card {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,.82);
            border-radius: 18px;
            padding: 0;
            background: #d9e5ce;
            box-shadow: 0 8px 22px rgba(0,0,0,.26);
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .theme-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s ease, filter .35s ease;
        }
        .theme-card span {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 26px 10px 11px;
            color: #fff;
            font-size: clamp(12px, 1.5vw, 15px);
            font-weight: 700;
            letter-spacing: .08em;
            text-shadow: 0 2px 5px rgba(0,0,0,.45);
            background: linear-gradient(transparent, rgba(17,44,26,.82));
        }
        .theme-card:hover,
        .theme-card:focus-visible {
            outline: none;
            transform: translateY(-5px) scale(1.02);
            border-color: #fff5a9;
            box-shadow: 0 14px 28px rgba(0,0,0,.32), 0 0 0 4px rgba(255,244,151,.18);
        }
        .theme-card:hover img {
            transform: scale(1.04);
        }
        #themeBackBtn {
            margin-top: clamp(18px, 3vh, 28px);
            padding: 9px 24px;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 999px;
            color: #fffdf0;
            background: rgba(255,255,255,.12);
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
        }

        /* ========== 卡牌点击时的幼蛙特效 ========== */
        .baby-pop {
            position: fixed;
            z-index: 130;
            width: clamp(82px, 10vw, 128px);
            height: auto;
            pointer-events: none;
            transform: translate(-50%, -100%) rotate(var(--baby-rotate, 0deg)) scale(.35);
            transform-origin: 50% 88%;
            opacity: 0;
            filter: drop-shadow(0 8px 12px rgba(37,65,35,.26));
            animation: babyPop .72s cubic-bezier(.2,.85,.25,1) forwards;
            will-change: transform, opacity;
        }
        @keyframes babyPop {
            0% { opacity: 0; transform: translate(-50%, -82%) rotate(var(--baby-rotate, 0deg)) scale(.28); }
            34% { opacity: 1; transform: translate(-50%, -118%) rotate(var(--baby-rotate, 0deg)) scale(1.08); }
            72% { opacity: 1; transform: translate(-50%, -128%) rotate(var(--baby-rotate, 0deg)) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -158%) rotate(var(--baby-rotate, 0deg)) scale(.84); }
        }

        /* ========== 过关视频 ========== */
        #winVideoOverlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(17,38,25,.75);
            backdrop-filter: blur(8px);
        }
        #winVideoOverlay.show {
            display: flex;
        }
        .win-video-card {
            width: min(92vw, 540px);
            max-height: 94vh;
            overflow: auto;
            padding: 16px;
            border: 4px solid rgba(255,253,232,.9);
            border-radius: 26px;
            background: linear-gradient(180deg, #fffdf1, #f2ecd1);
            box-shadow: 0 24px 60px rgba(0,0,0,.38);
            text-align: center;
            animation: videoCardIn .28s ease-out;
        }
        @keyframes videoCardIn {
            from { opacity: 0; transform: translateY(12px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .win-video-frame {
            position: relative;
            overflow: hidden;
            border-radius: 17px;
            background: #243c29;
            width: auto;
            height: min(60vh, 620px);
            max-width: 100%;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
        }
        #winVideo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #000;
            pointer-events: none;
        }
        #winVideo::-webkit-media-controls,
        #winVideo::-webkit-media-controls-enclosure,
        #winVideo::-webkit-media-controls-panel {
            display: none !important;
            -webkit-appearance: none !important;
        }
        #winVideoTitle {
            margin-top: 13px;
            color: #42633d;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 800;
        }
        #winVideoSub {
            margin-top: 5px;
            color: #9a825a;
            font-size: 13px;
        }
        #nextLevelBtn {
            width: 100%;
            margin-top: 13px;
            padding: 12px 16px 13px;
            border: none;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(180deg, #70c760, #439e54);
            box-shadow: 0 5px 0 #337f43;
            font-family: inherit;
            cursor: pointer;
        }
        #nextLevelBtn strong {
            display: block;
            font-size: clamp(18px, 2.4vw, 23px);
            letter-spacing: .16em;
            text-indent: .16em;
        }
        #nextLevelBtn small {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            color: rgba(255,255,255,.9);
            letter-spacing: .04em;
        }
        #nextLevelBtn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #337f43;
        }

        @media (max-width: 700px) {
            #themeGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .theme-panel { max-width: 520px; }
            .theme-card { aspect-ratio: 1 / 1.18; }
            #startHero {
                top: 14px;
                left: 14px;
                max-width: 58vw;
            }
            #startTitle {
                width: min(58vw, 250px);
                max-height: 24vh;
            }
            .win-video-card { padding: 12px; border-radius: 21px; }
            .win-video-frame { height: min(56vh, 560px); }
        }
        @media (max-height: 620px) {
            #startHero { top: 10px; }
            #startTitle { max-height: 25vh; }
            #startTagline { margin-top: 8px; padding: 5px 14px; }
            #startButtonWrap { padding-bottom: 34px; }
            #startBtn { padding-top: 12px; padding-bottom: 13px; }
            .win-video-frame { height: min(50vh, 430px); }
        }

    </style>
</head>
<body>
    <!-- 开始界面：背景与标题均来自“奶了个蛙”素材 -->
    <section id="startScreen" aria-label="开始游戏">
        <div id="startHero">
            <img id="startTitle" src="assets/title.png" alt="奶了个蛙">
            <div id="startTagline">点开牌堆 · 找到快乐</div>
        </div>

        <div id="startButtonWrap">
            <button id="startBtn" type="button">开始游戏</button>
        </div>

        <!-- 点击开始后展示的八款背景主题 -->
        <div id="themeScreen" aria-hidden="true">
            <div class="theme-panel">
                <h2>选择你的奶蛙世界</h2>
                <p class="theme-hint">每款背景都做过淡化处理，牌面会保持清晰</p>
                <div id="themeGrid"></div>
                <button id="themeBackBtn" type="button">返回开始界面</button>
            </div>
        </div>
    </section>

    <div id="stage">
    <img id="gameTitle" src="assets/title.png" alt="奶了个蛙">
    <div id="levelInfo"></div>
    <div id="stats">⏱ <span id="timeText">00:00</span>　·　🖱 步数 <span id="movesText">0</span>　·　🪙 金币 <span id="coinsText">0</span>　·　🏆 胜 <span id="winsText">0</span> / 负 <span id="losesText">0</span></div>

    <!-- 牌堆区：牌由 JS 动态生成，这里只放空容器 -->
    <div id="board"></div>

    <!-- 底部槽位：7 个格子 -->
    <div id="slotBar">
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div>
    </div>

    <div id="toolbar">
        <button id="shuffleBtn" class="tool">🔀 打乱<br><small>2 金币</small></button>
        <button id="removeBtn" class="tool">📤 移出<br><small>2 金币</small></button>
    </div>

    <p id="tip">规则：点没被压住的牌入槽 → 凑齐 3 只自动消除 → 槽满 7 格失败 / 全部消完进下一关</p>
    <button id="restartBtn" class="linkbtn">↻ 重开本关</button>
    </div>

    <!-- 胜负弹窗 -->
    <div id="overlay">
        <div class="card">
            <div id="overlayMsg"></div>
            <div class="sub" id="overlaySub"></div>
            <button id="overlayBtn" class="btn"></button>
            <button id="reviveBtn" class="btn revive" style="display:none">💘 复活（10 金币）</button>
        </div>
    </div>

    <!-- 每次过关随机播放一段奶蛙大笑视频 -->
    <div id="winVideoOverlay" aria-hidden="true">
        <div class="win-video-card">
            <div class="win-video-frame">
                <video id="winVideo" playsinline autoplay disablepictureinpicture
                    controlslist="nodownload nofullscreen noremoteplayback" preload="auto"></video>
            </div>
            <div id="winVideoTitle">过关啦！奶蛙笑出声</div>
            <div id="winVideoSub"></div>
            <button id="nextLevelBtn" type="button">
                <strong>下一关</strong>
                <small id="nextLevelCount"></small>
            </button>
        </div>
    </div>

    <!-- 背景音乐：开关 + 音量 -->
    <div id="topbar">
        <button id="musicBtn" class="pill" title="背景音乐开关"><span class="ico">🔊</span><span class="lbl">音乐</span></button>
        <button id="musicCfg" class="pill icon" title="音量设置">⚙</button>
    </div>

    <div id="musicSheet">
        <div class="panel">
            <h2>背景音乐</h2>
            <p class="hint" id="musicHint">默认音量 35%。切到别的标签页、最小化窗口或离开页面时会自动暂停，回来接着放。</p>
            <div class="row"><span>音量</span><b id="volText">35%</b></div>
            <input id="volRange" type="range" min="0" max="100" step="1" value="35">
            <button id="musicToggle" class="btn-close">暂停音乐</button>
            <button id="closeMusic" class="btn-close ghost">关闭</button>
        </div>
    </div>

    <script>
        /* =====================================================================
           背景音乐
           ---------------------------------------------------------------------
           · 音乐文件放在 audio/ 子目录或与本文件同级的根目录都能识别，
             按 mp3 → ogg → m4a → wav 的顺序取第一个能读到的。
           · 开关与音量记在 localStorage，下次打开沿用。
           · 浏览器不允许"没交互就出声"，所以首次点击/按键时补播一次。
           · 切到别的标签页、最小化、关闭或离开页面时立即静音，
             回到页面再自动续播。
           ===================================================================== */
        const BGM_CANDIDATES = [
            'assets/audio/bgm.mp3',
            'audio/bgm.mp3', 'bgm.mp3',
            'audio/bgm.ogg', 'bgm.ogg',
            'audio/bgm.m4a', 'bgm.m4a',
            'audio/bgm.wav', 'bgm.wav'
        ];
        const MUSIC_KEY = 'nlge-music';

        let bgmEl = null;
        let bgmTry = 0;
        let bgmBroken = false;     // 所有候选路径都读不到
        let musicOn = true;
        let musicVol = 0.35;
        let bgmFadeTimer = null;
        let bgmStarted = false;    // 成功播放过没有（决定回到页面时要不要续播）

        function musicPrefRead() {
            try {
                const raw = localStorage.getItem(MUSIC_KEY);
                if (!raw) return null;
                const v = JSON.parse(raw);
                return (v && typeof v === 'object') ? v : null;
            } catch (e) { return null; }
        }
        function musicPrefSave() {
            try {
                localStorage.setItem(MUSIC_KEY, JSON.stringify({ on: musicOn, vol: musicVol }));
            } catch (e) {}
        }

        function initMusic() {
            const pref = musicPrefRead();
            if (pref) {
                musicOn = pref.on !== false;
                const v = parseFloat(pref.vol);
                if (!isNaN(v)) musicVol = Math.min(1, Math.max(0, v));
            }

            try { bgmEl = new Audio(); } catch (e) { bgmEl = null; }
            if (!bgmEl) { bgmBroken = true; syncMusicUi(); return; }

            bgmEl.loop = true;
            bgmEl.preload = 'auto';
            bgmEl.volume = 0;
            bgmEl.addEventListener('error', () => { bgmTry++; loadBgmSource(); });
            bgmEl.addEventListener('playing', () => {
                bgmStarted = true;
                fadeBgm(musicOn ? musicVol : 0);
            });
            bgmEl.addEventListener('canplay', () => { if (musicOn) safePlay(); });

            loadBgmSource();
            syncMusicUi();

            // 首次用户操作时补播（绕过自动播放限制）
            const unlock = () => {
                if (musicOn) safePlay();
                ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
                    document.removeEventListener(ev, unlock);
                });
            };
            ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
                document.addEventListener(ev, unlock, { passive: true });
            });

            // 离开游戏界面就静音：切标签页/最小化、关闭、跳转、刷新都算
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) pauseForLeave();
                else if (musicOn && bgmStarted) safePlay();
            });
            addEventListener('pagehide', pauseForLeave);
            addEventListener('beforeunload', pauseForLeave);
            addEventListener('blur', () => {
                // 窗口失焦（切到别的应用）也停，避免人不在还一直响
                if (document.hidden) pauseForLeave();
            });

            bindMusicUi();
            safePlay();
        }

        function loadBgmSource() {
            if (!bgmEl) return;
            if (bgmTry >= BGM_CANDIDATES.length) {
                bgmBroken = true;
                try {
                    console.warn('[奶了个蛙] 背景音乐一个都没找到。试过：' +
                        BGM_CANDIDATES.join('、'));
                } catch (e) {}
                syncMusicUi();
                return;
            }
            try {
                bgmEl.src = BGM_CANDIDATES[bgmTry];
                bgmEl.load();
            } catch (e) {}
        }

        function safePlay() {
            if (!bgmEl || bgmBroken || !musicOn) return;
            try {
                const p = bgmEl.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (e) {}
        }
        function safePause() {
            if (!bgmEl) return;
            try { bgmEl.pause(); } catch (e) {}
        }

        /* 离开页面：立即静音并暂停。用计时器淡出在 pagehide 时来不及执行，
           所以这里直接把音量归零再暂停，回来时再从 0 淡入。 */
        function pauseForLeave() {
            if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            if (!bgmEl) return;
            try { bgmEl.volume = 0; } catch (e) {}
            safePause();
        }

        function fadeBgm(target) {
            if (!bgmEl) return;
            if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            const from = (typeof bgmEl.volume === 'number') ? bgmEl.volume : 0;
            if (Math.abs(from - target) < 0.01) {
                try { bgmEl.volume = target; } catch (e) {}
                return;
            }
            const steps = 18;
            let i = 0;
            bgmFadeTimer = setInterval(() => {
                i++;
                const v = from + (target - from) * (i / steps);
                try { bgmEl.volume = Math.min(1, Math.max(0, v)); } catch (e) {}
                if (i >= steps) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            }, 45);
        }

        function toggleMusic() {
            if (bgmBroken) {
                openMusicSheet();
                return;
            }
            musicOn = !musicOn;
            musicPrefSave();
            if (musicOn) {
                safePlay();
                fadeBgm(musicVol);
            } else {
                fadeBgm(0);
                setTimeout(() => { if (!musicOn) safePause(); }, 900);
            }
            syncMusicUi();
        }

        function syncMusicUi() {
            const btn = document.getElementById('musicBtn');
            if (btn) {
                const ico = btn.querySelector('.ico');
                const lbl = btn.querySelector('.lbl');
                if (ico) ico.textContent = bgmBroken ? '🔇' : (musicOn ? '🔊' : '🔇');
                if (lbl) lbl.textContent = bgmBroken ? '无音乐' : (musicOn ? '音乐' : '静音');
                btn.classList.toggle('off', !musicOn || bgmBroken);
                btn.title = bgmBroken ? '没找到音乐文件' : (musicOn ? '点一下静音' : '点一下开启');
            }
            const tg = document.getElementById('musicToggle');
            if (tg) tg.textContent = bgmBroken ? '没有可播放的音乐文件' : (musicOn ? '暂停音乐' : '播放音乐');
            const hint = document.getElementById('musicHint');
            if (hint) {
                hint.textContent = bgmBroken
                    ? '没找到音乐文件。把 bgm.mp3 放进 audio/ 目录，或直接和 index.html 放在一起，刷新即可。'
                    : '默认音量 35%。切到别的标签页、最小化窗口或离开页面时会自动暂停，回来接着放。';
            }
            const vr = document.getElementById('volRange');
            if (vr) vr.value = String(Math.round(musicVol * 100));
            const vt = document.getElementById('volText');
            if (vt) vt.textContent = Math.round(musicVol * 100) + '%';
        }

        function openMusicSheet() {
            const el = document.getElementById('musicSheet');
            if (el) el.classList.add('show');
        }
        function closeMusicSheet() {
            const el = document.getElementById('musicSheet');
            if (el) el.classList.remove('show');
        }

        function bindMusicUi() {
            const on = (id, ev, fn) => {
                const el = document.getElementById(id);
                if (el) el.addEventListener(ev, fn);
            };
            on('musicBtn', 'click', toggleMusic);
            on('musicCfg', 'click', openMusicSheet);
            on('musicToggle', 'click', toggleMusic);
            on('closeMusic', 'click', closeMusicSheet);

            const sheet = document.getElementById('musicSheet');
            if (sheet) {
                sheet.addEventListener('click', (e) => {
                    if (e.target === sheet) closeMusicSheet();
                });
            }
            on('volRange', 'input', (e) => {
                musicVol = Math.min(1, Math.max(0, (parseInt(e.target.value, 10) || 0) / 100));
                musicPrefSave();
                if (musicOn) {
                    if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
                    try { bgmEl.volume = musicVol; } catch (err) {}
                }
                syncMusicUi();
            });
        }

        /* ========= 图案清单 =========
           对应 images 文件夹里的 9 张奶蛙图片；
           emoji 只是"保险丝"：万一图片加载失败才显示它 */
        const PATTERNS = [
            { file: '大笑奶蛙.png.jpg', emoji: '😆' },
            { file: '白色奶蛙.png.jpg', emoji: '⬜' },
            { file: '粉色奶蛙.png.jpg', emoji: '🌸' },
            { file: '终极奶蛙.png.jpg', emoji: '👑' },
            { file: '绿色奶蛙.png.jpg', emoji: '💚' },
            { file: '蓝色奶蛙.png.jpg', emoji: '💙' },
            { file: '虚空奶蛙.png.jpg', emoji: '🌌' },
            { file: '黄色奶蛙.png.jpg', emoji: '💛' },
            { file: '黑色奶蛙.png.jpg', emoji: '🖤' },
        ];

        /* ========= 开始页、主题与过关视频素材 ========= */
        const THEMES = Array.from({ length: 8 }, (_, i) => ({
            index: i + 1,
            image: 'assets/themes/theme-' + (i + 1) + '.jpg',
            name: '奶蛙主题 ' + (i + 1)
        }));
        const BABY_EFFECTS = Array.from(
            { length: 5 },
            (_, i) => 'assets/baby/baby-' + (i + 1) + '.png'
        );
        const WIN_VIDEOS = [
            'assets/videos/laugh-1.mp4',
            'assets/videos/laugh-2.mp4'
        ];

        /* ========= 关卡表：10 关，牌数逐级递增 =========
           注意：三消规则要求总数是 3 的倍数，
           所以 50→51、100→102 等，都往上凑齐 */
        const LEVEL_COUNTS = [27, 51, 102, 150, 201, 252, 300, 351, 402, 450];

        const SLOT_MAX = 7;      // 槽位上限
        let WX = 86;             // 两侧翼列区宽度
        let BOARD_W = 552;       // 牌堆区宽高（按关卡计算，与 CSS 变量同步）
        let BOARD_H = 512;
        let TILE_SIZE = 72;      // 当前关卡的牌边长（随关卡变化）

        /* ========= 游戏状态（整个游戏的"记忆"） ========= */
        let level = 1;          // 当前第几关（1~10）
        let tiles = [];         // 牌堆里所有牌
        let slot = [];          // 底部槽位里的牌（按入槽顺序）
        let gameOver = false;   // 结束后锁死点击
        let moves = 0;          // 本关步数
        let seconds = 0;        // 本关已用秒数
        let timerId = null;     // 计时器句柄
        let gameStarted = false;
        let selectedTheme = 1;

        /* ========= 计时器：开局启动，结束停表 ========= */
        function startTimer() {
            stopTimer();
            seconds = 0;
            updateTime();
            timerId = setInterval(() => { seconds++; updateTime(); }, 1000);
        }
        function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
        function resumeTimer() { if (!timerId) timerId = setInterval(() => { seconds++; updateTime(); }, 1000); }
        function updateTime() {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timeText').textContent = m + ':' + s;
        }

        /* ========= 胜负记录：存浏览器 localStorage，关掉网页也不丢 ========= */
        function loadStats() {
            try { return JSON.parse(localStorage.getItem('yygy-stats')) || { wins: 0, loses: 0 }; }
            catch (e) { return { wins: 0, loses: 0 }; }
        }
        function renderStats() {
            const st = loadStats();
            document.getElementById('winsText').textContent = st.wins;
            document.getElementById('losesText').textContent = st.loses;
        }
        function addStat(key) {
            const st = loadStats();
            st[key]++;
            try { localStorage.setItem('yygy-stats', JSON.stringify(st)); } catch (e) {}
            renderStats();
        }

        /* ========= 金币与工具：通关 +2 币，打乱/移出各 2 币 ========= */
        const SHUFFLE_COST = 2;
        const REMOVE_COST = 2;
        const REVIVE_COST = 10;
        let coins = loadCoins();
        function loadCoins() {
            try { return parseInt(localStorage.getItem('yygy-coins')) || 0; } catch (e) { return 0; }
        }
        function saveCoins() {
            try { localStorage.setItem('yygy-coins', String(coins)); } catch (e) {}
        }
        function renderCoins() {
            document.getElementById('coinsText').textContent = coins;
            updateToolButtons();
        }
        function updateToolButtons() {
            document.getElementById('shuffleBtn').disabled = coins < SHUFFLE_COST || gameOver;
            document.getElementById('removeBtn').disabled =
                coins < REMOVE_COST || gameOver || slot.length === 0;
            document.getElementById('reviveBtn').disabled = coins < REVIVE_COST;
        }

        /* 打乱：把牌堆里剩余牌的图案重新洗牌（位置不动、脸型重排） */
        function useShuffle() {
            if (gameOver || coins < SHUFFLE_COST) return;
            coins -= SHUFFLE_COST; saveCoins(); renderCoins();
            const alive = tiles.filter(t => !t.removed);
            const faces = shuffle(alive.map(t => t.p));
            alive.forEach((t, i) => { t.p = faces[i]; });
            renderBoard();
        }

        /* 移出：把槽里最后至多 3 张牌退回牌堆，腾出槽位救急 */
        function useRemove() {
            if (gameOver || coins < REMOVE_COST || slot.length === 0) return;
            coins -= REMOVE_COST; saveCoins(); renderCoins();
            slot.splice(-3).forEach(t => { t.removed = false; });
            renderAll();
        }

        /* 复活：失败时把槽里所有牌退回牌堆、继续本局（计时继续） */
        function useRevive() {
            if (coins < REVIVE_COST) return;
            coins -= REVIVE_COST; saveCoins(); renderCoins();
            slot.forEach(t => { t.removed = false; });
            slot = [];
            gameOver = false;
            document.getElementById('overlay').classList.remove('show');
            resumeTimer();
            renderAll();
        }

        /* 洗牌算法：把数组顺序随机打乱（发牌公平全靠它） */
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /* 牌越多牌越小，否则屏幕装不下 */
        function pickTileSize(count) {
            if (count <= 51) return 72;
            if (count <= 102) return 60;
            if (count <= 201) return 48;
            return 40;
        }

        /* ========= 关卡布局生成器 =========
           思路：第 0 层按网格铺满 → 第 1 层错开半格铺 → 第 2 层再对齐铺……
           一层层往上堆，直到位置数够本关牌数为止 */
        function buildLayout(count, size) {
            const step = size + 8;   // 同层间距：比牌宽一点，保证同层互不重叠
            const positions = [];
            const wxL = (WX - size) / 2;
            const wxR = WX + 380 + (WX - size) / 2;
            let SIDE_H;              // 侧边堆叠区需要的高度

            /* --- ① 两侧堆叠区 ---
               第 1、2 关：每侧 1 摞 4 张的细边小叠摞
               第 3 关起：收纳本关 60% 的牌（多数），每侧 3 摞深堆，
               摞内每层微移露边，深度自动计算 */
            if (level >= 3) {
                const perSide = Math.floor(count * 0.6 / 2);
                const STACKS = 3;                          // 每侧 3 摞
                const depth = Math.ceil(perSide / STACKS); // 每摞深度
                const peek = Math.max(4, Math.round(size * 0.10));
                const pileH = size + (depth - 1) * peek;
                SIDE_H = STACKS * pileH + (STACKS - 1) * 10 + 20;
                for (let sIdx = 0; sIdx < STACKS; sIdx++) {
                    const y = 10 + sIdx * (pileH + 10);
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxL, y: y + k * peek });
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxR, y: y + k * peek });
                }
            } else {
                const WING = 4;
                const peek = Math.max(6, Math.round(size * 0.12));
                const wy0 = (420 - (size + (WING - 1) * peek)) / 2;
                for (let k = 0; k < WING; k++) {
                    positions.push({ layer: k, x: wxL, y: wy0 + k * peek });
                    positions.push({ layer: k, x: wxR, y: wy0 + k * peek });
                }
                SIDE_H = 420;
            }

            /* --- 牌堆区总高度 = 侧区与中央区取大者 + 底部平铺排 --- */
            const CH = Math.max(420, SIDE_H);   // 中央区高度
            BOARD_H = CH + size + 20;

            /* --- ② 底部平铺排：单层摆一排，开局全部可点（原版的"安全区"） --- */
            const BOTTOM = 6;
            const bw = BOTTOM * step - 8;
            const bx0 = (BOARD_W - bw) / 2;
            for (let i = 0; i < BOTTOM; i++)
                positions.push({ layer: 0, x: bx0 + i * step, y: BOARD_H - size - 10 });

            /* --- ③ 中央主堆：剩下的牌进这里，交替层叠成原版标志性牌堆 --- */
            function mkGrid(x0, y0) {
                const pts = [];
                for (let y = y0; y + size <= CH - 10; y += step)
                    for (let x = x0; x + size <= WX + 380 - 10; x += step)
                        pts.push({ x, y });
                return pts;
            }
            // 所有关卡统一仿照第 1 关：上层错开半格、交叠成连续牌堆（不离散）
            const off = step / 2;
            const grids = [mkGrid(WX + 20, 20), mkGrid(WX + 20 + off, 20 + off)];

            // 向心聚拢：按"离中心距离"排序、由近及远取位置——
            // 牌少时挤成紧凑一坨，牌多时自然铺满，不会东一张西一张
            const cx = WX + 190, cy = CH / 2;   // 中央区域的中心点
            const byCenter = (a, b) =>
                ((a.x - cx) ** 2 + (a.y - cy) ** 2) - ((b.x - cx) ** 2 + (b.y - cy) ** 2);

            let layer = 0;
            while (positions.length < count) {
                const need = count - positions.length;
                const pts = grids[layer % 2].slice().sort(byCenter).slice(0, need);
                for (const p of pts) positions.push({ layer, x: p.x, y: p.y });
                layer++;
            }
            return positions;
        }

        /* ========= 开始页与八款主题 ========= */
        function buildThemePicker() {
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            THEMES.forEach(theme => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'theme-card';
                btn.setAttribute('aria-label', '选择' + theme.name);
                btn.dataset.theme = theme.index;

                const img = document.createElement('img');
                img.src = theme.image;
                img.alt = '';
                img.loading = 'eager';

                const label = document.createElement('span');
                label.textContent = theme.name;
                btn.append(img, label);
                btn.addEventListener('click', () => startGame(theme.index));
                grid.appendChild(btn);
            });
        }

        function openThemePicker() {
            const screen = document.getElementById('startScreen');
            screen.classList.add('theme-open');
            document.getElementById('themeScreen').setAttribute('aria-hidden', 'false');
            if (musicOn) safePlay();
            const first = document.querySelector('.theme-card');
            if (first) setTimeout(() => first.focus({ preventScroll: true }), 80);
        }

        function closeThemePicker() {
            const screen = document.getElementById('startScreen');
            screen.classList.remove('theme-open');
            document.getElementById('themeScreen').setAttribute('aria-hidden', 'true');
            document.getElementById('startBtn').focus({ preventScroll: true });
        }

        function startGame(themeIndex) {
            selectedTheme = themeIndex;
            gameStarted = true;
            level = 1;
            const theme = THEMES[themeIndex - 1];
            document.documentElement.style.setProperty(
                '--game-bg',
                'url("' + theme.image + '")'
            );
            document.body.classList.add('in-game');
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('stage').classList.add('active');
            document.getElementById('winVideoOverlay').classList.remove('show');
            if (musicOn) safePlay();
            newGame();
        }

        /* 开新一局：按关卡发牌 */
        function newGame() {
            if (!gameStarted) return;
            const count = LEVEL_COUNTS[level - 1];
            TILE_SIZE = pickTileSize(count);
            // 牌堆区宽度 = 左右翼列 + 中央 380 宽；高度由 buildLayout 按关卡计算
            WX = TILE_SIZE + 14;
            BOARD_W = WX + 380 + WX;
            const layout = buildLayout(count, TILE_SIZE);   // 内部同时算出 BOARD_H
            const root = document.documentElement.style;
            root.setProperty('--ts', TILE_SIZE + 'px');
            root.setProperty('--bw', BOARD_W + 'px');
            root.setProperty('--bh', BOARD_H + 'px');

            // 发牌：先算出"三元组"总数，均分给 9 种图案，
            // 保证每种图案的张数都是 3 的倍数 → 数学上永远能消干净
            const triples = count / 3;
            const base = Math.floor(triples / PATTERNS.length);
            const rem = triples % PATTERNS.length;
            const bag = [];
            for (let p = 0; p < PATTERNS.length; p++) {
                const t = base + (p < rem ? 1 : 0);   // 这种图案分到的三元组数
                for (let k = 0; k < t * 3; k++) bag.push(p);
            }
            shuffle(bag);

            tiles = layout.map((pos, i) => ({
                id: i, layer: pos.layer, x: pos.x, y: pos.y,
                p: bag[i],          // 这张牌是几号图案
                removed: false,     // 是否已被消掉/入槽
            }));
            slot = [];
            gameOver = false;
            moves = 0;
            document.getElementById('movesText').textContent = '0';
            startTimer();
            renderStats();
            renderCoins();
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('levelInfo').textContent =
                '第 ' + level + ' 关 / 共 ' + LEVEL_COUNTS.length + ' 关 · 本关 ' + count + ' 张牌';
            renderAll();
            fitScreen();
        }

        /* 判断一张牌是否被压住：存在"层级更高 + 位置重叠 + 还没消失"的牌 */
        function isCovered(tile) {
            return tiles.some(o =>
                !o.removed &&
                o.layer > tile.layer &&
                Math.abs(o.x - tile.x) < TILE_SIZE &&
                Math.abs(o.y - tile.y) < TILE_SIZE
            );
        }

        /* ========= 渲染：把状态画到页面上 ========= */
        function tileHTML(p) {
            const pat = PATTERNS[p];
            return '<span class="face">' + pat.emoji + '</span>' +
                '<img src="images/' + pat.file + '" onerror="this.remove()">';
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            tiles.filter(t => !t.removed)
                .sort((a, b) => a.layer - b.layer)   // 下层先画，上层盖住
                .forEach(tile => {
                    const div = document.createElement('div');
                    div.className = 'tile' + (isCovered(tile) ? ' covered' : '');
                    div.style.left = tile.x + 'px';
                    div.style.top = tile.y + 'px';
                    div.style.zIndex = tile.layer;
                    div.dataset.id = tile.id;        // 把编号存在元素上，点击时取回
                    div.innerHTML = tileHTML(tile.p);
                    board.appendChild(div);
                });
        }

        function renderSlot() {
            const cells = document.querySelectorAll('#slotBar .slot');
            cells.forEach((cell, i) => {
                cell.innerHTML = '';
                if (i < slot.length) cell.innerHTML = tileHTML(slot[i].p);
            });
        }

        function renderAll() { renderBoard(); renderSlot(); updateToolButtons(); }

        /* ========= 飞入卡槽动画 =========
           造一张"分身牌"固定在屏幕原位，用 CSS 过渡飘到目标格子，
           落地后删除分身、刷新卡槽显示 */
        function flyToSlot(tile, fromRect, cellIndex) {
            const cells = document.querySelectorAll('#slotBar .slot');
            const toRect = cells[Math.min(cellIndex, SLOT_MAX - 1)].getBoundingClientRect();
            const fly = document.createElement('div');
            fly.className = 'tile fly';
            fly.innerHTML = tileHTML(tile.p);
            fly.style.left = fromRect.left + 'px';
            fly.style.top = fromRect.top + 'px';
            fly.style.width = fromRect.width + 'px';
            fly.style.height = fromRect.height + 'px';
            document.body.appendChild(fly);

            // 双 rAF：确保浏览器先记住"起点"，再改样式触发过渡动画
            requestAnimationFrame(() => requestAnimationFrame(() => {
                fly.style.left = toRect.left + 'px';
                fly.style.top = toRect.top + 'px';
                fly.style.width = toRect.width + 'px';
                fly.style.height = toRect.height + 'px';
            }));

            const land = () => { if (fly.isConnected) { fly.remove(); renderSlot(); } };
            fly.addEventListener('transitionend', land, { once: true });
            setTimeout(land, 350);   // 保险：动画万一没触发也兜底落地
        }

        /* 每次点牌，在点击位置随机弹出一张奶蛙小时候的透明图片 */
        function spawnBabyEffect(x, y) {
            const img = document.createElement('img');
            img.className = 'baby-pop';
            img.src = BABY_EFFECTS[Math.floor(Math.random() * BABY_EFFECTS.length)];
            img.alt = '';
            img.draggable = false;
            img.style.left = x + 'px';
            img.style.top = y + 'px';
            img.style.setProperty('--baby-rotate', (Math.random() * 16 - 8).toFixed(1) + 'deg');
            document.body.appendChild(img);
            const remove = () => { if (img.isConnected) img.remove(); };
            img.addEventListener('animationend', remove, { once: true });
            setTimeout(remove, 900);
        }

        /* ========= 核心逻辑：点击一张牌 ========= */
        function onTileClick(id, fromEl, clickX, clickY) {
            if (gameOver) return;
            const tile = tiles.find(t => t.id === id);
            if (!tile || tile.removed) return;
            const rect = fromEl.getBoundingClientRect();
            spawnBabyEffect(
                clickX || rect.left + rect.width / 2,
                clickY || rect.top + rect.height / 2
            );
            if (isCovered(tile)) return;  // 被压住的牌点不动

            const fromRect = fromEl.getBoundingClientRect();  // 先记住起飞位置
            moves++;                                          // 记一步
            document.getElementById('movesText').textContent = moves;

            // 第 1 步：牌离开牌堆
            tile.removed = true;

            // 第 2 步：插入槽位——挨着同类放，方便凑三消
            let idx = slot.length;
            for (let i = slot.length - 1; i >= 0; i--) {
                if (slot[i].p === tile.p) { idx = i + 1; break; }
            }
            slot.splice(idx, 0, tile);

            // 第 3 步：凑齐 3 只同图案 → 一起消除
            const matched = slot.filter(t => t.p === tile.p).length === 3;
            if (matched) slot = slot.filter(t => t.p !== tile.p);

            renderBoard();                 // 牌堆立刻更新（暗牌可能变亮）
            flyToSlot(tile, fromRect, idx); // 卡槽等分身落地后再刷新
            checkEnd();
        }

        /* ========= 胜负判定 ========= */
        function checkEnd() {
            const boardClear = tiles.every(t => t.removed);
            if (boardClear && slot.length === 0) {
                stopTimer();
                addStat('wins');
                coins += 2; saveCoins(); renderCoins();   // 通关奖赏：2 金币（存本机浏览器）
                const finalRound = level >= LEVEL_COUNTS.length;
                const nextLevel = finalRound ? 1 : level + 1;
                showWinVideo(nextLevel, finalRound);
            } else if (slot.length >= SLOT_MAX) {
                stopTimer();
                addStat('loses');
                showOverlay('😭 槽位满了，挑战失败！', '重试本关', () => newGame(), '🪙 当前 ' + coins + ' 金币', true);
            }
        }

        /* 过关后随机播放一段大笑视频，视频下方展示下一关信息 */
        function showWinVideo(nextLevel, finalRound) {
            gameOver = true;
            updateToolButtons();
            document.getElementById('overlay').classList.remove('show');
            if (bgmEl) safePause();

            const video = document.getElementById('winVideo');
            const overlay = document.getElementById('winVideoOverlay');
            video.pause();
            video.controls = false;
            video.muted = false;
            video.src = WIN_VIDEOS[Math.floor(Math.random() * WIN_VIDEOS.length)];
            video.load();

            document.getElementById('winVideoTitle').textContent =
                finalRound ? '🏆 十关通关，奶蛙笑疯了！' : '🎉 第 ' + level + ' 关通关！';
            document.getElementById('winVideoSub').textContent =
                '🪙 金币 +2 · 当前 ' + coins + ' 币 · 下一关共 ' +
                LEVEL_COUNTS[nextLevel - 1] + ' 张卡牌';

            const btn = document.getElementById('nextLevelBtn');
            btn.querySelector('strong').textContent = finalRound ? '再玩一遍' : '下一关';
            document.getElementById('nextLevelCount').textContent =
                finalRound ? '第 1 关 · 27 张卡牌' :
                '第 ' + nextLevel + ' 关 · ' + LEVEL_COUNTS[nextLevel - 1] + ' 张卡牌';
            btn.onclick = () => {
                video.pause();
                video.removeAttribute('src');
                video.load();
                overlay.classList.remove('show');
                overlay.setAttribute('aria-hidden', 'true');
                level = nextLevel;
                newGame();
                if (musicOn) {
                    if (bgmEl) bgmEl.volume = 0;
                    safePlay();
                    fadeBgm(musicVol);
                }
            };

            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
            playWinVideo();
        }

        /* 直接播放画面；若浏览器拦截带声音的自动播放，就静音续播而不是显示控制条 */
        function playWinVideo() {
            const video = document.getElementById('winVideo');
            try {
                const playing = video.play();
                if (playing && typeof playing.catch === 'function') {
                    playing.catch(() => {
                        video.muted = true;
                        const fallback = video.play();
                        if (fallback && typeof fallback.catch === 'function') {
                            fallback.catch(() => {});
                        }
                    });
                }
            } catch (e) {
                try {
                    video.muted = true;
                    video.play().catch(() => {});
                } catch (err) {}
            }
        }

        /* 播放框贴合每段视频的原始比例，铺满的同时不裁掉奶蛙脸部 */
        function syncWinVideoAspect() {
            const video = document.getElementById('winVideo');
            const frame = document.querySelector('.win-video-frame');
            if (!frame || !video.videoWidth || !video.videoHeight) return;
            frame.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
        }

        function showOverlay(msg, btnText, action, extra, showRevive) {
            gameOver = true;
            document.getElementById('overlayMsg').textContent = msg;
            document.getElementById('overlaySub').textContent =
                '当前进度：第 ' + level + ' 关 / ' + LEVEL_COUNTS.length + ' 关' +
                ' · 用时 ' + document.getElementById('timeText').textContent +
                ' · 步数 ' + moves + (extra ? ' · ' + extra : '');
            const btn = document.getElementById('overlayBtn');
            btn.textContent = btnText;
            btn.onclick = action;
            document.getElementById('reviveBtn').style.display = showRevive ? 'inline-block' : 'none';
            updateToolButtons();
            document.getElementById('overlay').classList.add('show');
        }

        /* 事件委托：整个牌堆只装一个监听器，点谁都能接到 */
        document.getElementById('board').addEventListener('click', e => {
            const el = e.target.closest('.tile');
            if (el) onTileClick(Number(el.dataset.id), el, e.clientX, e.clientY);
        });
        document.getElementById('winVideo').addEventListener('loadedmetadata', syncWinVideoAspect);
        document.getElementById('startBtn').addEventListener('click', openThemePicker);
        document.getElementById('themeBackBtn').addEventListener('click', closeThemePicker);
        document.getElementById('restartBtn').addEventListener('click', () => newGame());
        document.getElementById('shuffleBtn').addEventListener('click', useShuffle);
        document.getElementById('removeBtn').addEventListener('click', useRemove);
        document.getElementById('reviveBtn').addEventListener('click', useRevive);

        /* ========= 全屏适配：按屏幕尺寸整体缩放游戏 =========
           先按 1 倍量出游戏的"自然尺寸"，再取 屏幕宽/游戏宽 与 屏幕高/游戏高
           的较小值作为缩放比——保证任何屏幕（电脑/手机）都刚好装得下、占得满。
           body 有 8px 内边距，算的时候要扣掉，否则上下各被裁掉一截。 */
        const SCREEN_PAD = 16;   // 左右/上下各 8px
        function fitScreen() {
            const stage = document.getElementById('stage');
            if (!gameStarted) {
                stage.style.zoom = 1;
                return;
            }
            stage.style.zoom = 1;
            const aw = Math.max(120, innerWidth - SCREEN_PAD);
            const ah = Math.max(120, innerHeight - SCREEN_PAD);
            const s = Math.min(aw / stage.offsetWidth, ah / stage.offsetHeight, 3);
            stage.style.zoom = s;
        }
        addEventListener('resize', fitScreen);   // 窗口变化/手机横竖屏切换时重新适配
        addEventListener('load', fitScreen);     // 字体、图片都到位后再量一次，避免首屏算小

        buildThemePicker();
        renderStats();
        renderCoins();
        initMusic(); // 背景音乐：沿用上次的开关和音量，开始播放
    </script>
</body>
</html>
