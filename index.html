<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>奶了个蛙</title>
    <style>
        /* ========== 全局设置 ========== */
        :root {
            --game-bg: none;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #7ec86f, #4a9d5f); /* 草地绿背景 */
            display: flex; align-items: center; justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 8px;
            overflow: hidden;              /* 缩放适配后不出滚动条 */
            position: relative;
            transition: background-color .45s ease;
        }
        /* 选好主题后，用淡化图片垫在游戏最底层，不抢牌面的视觉重点 */
        body::before {
            content: "";
            position: fixed;
            inset: -3%;
            background-image: var(--game-bg);
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: saturate(.72) brightness(1.08);
            transform: scale(1.04);
            transition: opacity .55s ease;
            pointer-events: none;
            z-index: 0;
        }
        body.in-game {
            background: #79b56b;
        }
        body.in-game::before {
            opacity: .64;
            animation: backdropDrift 18s ease-in-out infinite alternate;
        }
        body.theme-switching::before {
            opacity: .18;
        }
        /* 游戏主体：由 fitScreen() 按屏幕整体缩放，任何屏幕都"刚好占满" */
        #stage {
            display: flex; flex-direction: column; align-items: center;
            position: relative;
            z-index: 2;
        }
        #stage:not(.active) {
            display: none;
        }
        #stage.active {
            animation: stageIn .34s ease-out;
        }
        #gameHeader {
            width: var(--bw, 552px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 7px;
        }
        #gameTitle {
            display: block;
            width: auto;
            height: clamp(56px, 6.4vh, 70px);
            max-width: min(220px, 45%);
            object-fit: contain;
            filter: drop-shadow(0 4px 7px rgba(20, 54, 29, .22));
        }
        #headerRight {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #levelBadge {
            min-width: 148px;
            padding: 7px 14px 8px;
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 14px;
            color: #fffdf2;
            background: linear-gradient(145deg, rgba(36, 96, 52, .84), rgba(25, 71, 39, .72));
            box-shadow: 0 5px 16px rgba(23, 58, 30, .2), inset 0 1px 0 rgba(255,255,255,.18);
            backdrop-filter: blur(8px);
        }
        #levelBadge small {
            display: block;
            color: #f7e68b;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .2em;
            margin-bottom: 2px;
        }
        #levelInfo {
            display: block;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
        }
        #stats {
            width: var(--bw, 552px);
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 7px;
        }
        .stat {
            min-width: 0;
            padding: 6px 5px 5px;
            border: 1px solid rgba(255,255,255,.48);
            border-radius: 11px;
            color: #3d5839;
            background: rgba(255, 253, 241, .78);
            box-shadow: 0 3px 10px rgba(31, 61, 34, .12);
            text-align: center;
            backdrop-filter: blur(7px);
            transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
        }
        .stat-icon {
            display: block;
            height: 14px;
            font-size: 12px;
            line-height: 14px;
        }
        .stat b {
            display: block;
            overflow: hidden;
            color: #355338;
            font-size: 15px;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .stat small {
            display: block;
            color: #8c7a59;
            font-size: 11px;
            line-height: 1.2;
        }
        .stat.coin-stat.bump {
            background: #fff6c9;
            box-shadow: 0 0 0 3px rgba(255, 218, 96, .26), 0 5px 14px rgba(88, 69, 22, .18);
            animation: statBump .4s ease;
        }
        .stat.combo-stat.hot {
            color: #fff;
            background: linear-gradient(145deg, #f1a24d, #e66c50);
            box-shadow: 0 4px 13px rgba(173, 73, 45, .28);
        }
        .stat.combo-stat.hot b,
        .stat.combo-stat.hot small { color: #fff; }
        #progressRow {
            width: var(--bw, 552px);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            color: rgba(255,255,255,.96);
            font-size: 12px;
            text-shadow: 0 1px 3px rgba(23, 56, 30, .3);
        }
        #progressRow > span {
            white-space: nowrap;
            font-weight: 700;
        }
        .progress-track {
            flex: 1;
            height: 9px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(21, 54, 29, .38);
            box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
        }
        #progressFill {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #9be477, #ffe36e);
            box-shadow: 0 0 12px rgba(255, 228, 107, .55);
            transition: width .35s cubic-bezier(.2,.8,.2,1);
        }
        #progressText {
            min-width: 72px;
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* ========== 牌堆区 ========== */
        #board {
            position: relative;          /* 关键点1：牌堆区是"定位参照物" */
            width: var(--bw, 552px); height: var(--bh, 512px);
            border: 1px solid rgba(255,255,255,.38);
            border-radius: 20px;
            background:
                radial-gradient(circle at 18% 12%, rgba(255,255,255,.2), transparent 34%),
                linear-gradient(145deg, rgba(245, 255, 235, .2), rgba(26, 78, 42, .2));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.28),
                inset 0 -18px 32px rgba(18, 63, 31, .08),
                0 12px 30px rgba(24, 58, 31, .16);
            backdrop-filter: blur(7px);
            isolation: isolate;
        }
        #board::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }
        #board.level-enter {
            animation: boardEnter .48s cubic-bezier(.2,.8,.2,1);
        }
        #board.shuffle-flash::after {
            content: "";
            position: absolute;
            inset: 8%;
            z-index: 30;
            border: 2px solid rgba(255, 242, 149, .7);
            border-radius: 50%;
            pointer-events: none;
            animation: shuffleFlash .55s ease-out;
        }
        .tile {
            position: absolute;          /* 关键点2：每张牌用 left/top 摆位置 */
            width: var(--ts, 72px); height: var(--ts, 72px);   /* 尺寸由关卡决定 */
            background:
                linear-gradient(145deg, rgba(255,255,255,.82), transparent 42%),
                #fffaf0;
            border-radius: 12px;
            border: 1px solid #ead9ae;
            box-shadow:
                0 3px 0 #d8c083,
                0 6px 10px rgba(51, 66, 38, .2),
                inset 0 1px 0 rgba(255,255,255,.9);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transform-origin: 50% 85%;
            transition: transform .14s ease, filter .18s ease, box-shadow .14s ease, opacity .18s ease;
            will-change: transform;
        }
        .tile::before {
            content: "";
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 8px;
            pointer-events: none;
            z-index: 2;
        }
        .tile:not(.covered):hover {
            transform: translateY(-3px) rotate(.35deg);
            box-shadow:
                0 5px 0 #d8c083,
                0 10px 16px rgba(44, 61, 35, .22),
                inset 0 1px 0 rgba(255,255,255,.95);
        }
        .tile:not(.covered):active {
            transform: translateY(1px) scale(.96);
            box-shadow: 0 2px 0 #d8c083, 0 3px 6px rgba(39,55,31,.18);
        }
        .tile .face { font-size: calc(var(--ts, 72px) * .55); }  /* emoji 占位图案 */
        .tile img {                                    /* 真图片盖在 emoji 上 */
            position: absolute; left: 7px; top: 7px;
            width: calc(var(--ts, 72px) - 14px); height: calc(var(--ts, 72px) - 14px);
            object-fit: contain;                       /* 等比例缩放，完整装进方块不变形 */
            border-radius: 8px;
            pointer-events: none;
            z-index: 1;
        }
        /* 关键点3：被压住的牌变暗、不准点 */
        .tile.covered {
            filter: saturate(.45) brightness(.62) contrast(.92);
            opacity: .82;
            cursor: default;
        }
        .tile.covered:hover { transform: none; }
        .tile.covered::after {
            content: "";
            position: absolute;
            right: 6px;
            bottom: 6px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,.58);
            box-shadow: 0 0 0 2px rgba(40, 60, 34, .2);
            z-index: 3;
        }
        .tile.hinted {
            animation: tileHint 1s ease-in-out 2;
        }

        /* 飞行中的牌：脱离牌堆、飘向卡槽 */
        .fly {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            transition: left .25s ease-in, top .25s ease-in, width .25s ease-in, height .25s ease-in;
        }

        /* 所有卡牌牌面完全不透明 */
        .tile,
        .tile.covered,
        .slot img,
        .slot .face {
            opacity: 1 !important;
        }

        /* ========== 底部 7 格槽位 ========== */
        #slotZone {
            width: var(--bw, 552px);
            margin-top: 10px;
        }
        #slotMeta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 4px 5px;
            color: rgba(255,255,255,.95);
            font-size: 12px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(24, 55, 29, .35);
        }
        #slotCount {
            font-variant-numeric: tabular-nums;
            color: #fff6b0;
        }
        #slotBar {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 7px;
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(20, 61, 33, .58), rgba(14, 48, 27, .66));
            box-shadow: inset 0 2px 8px rgba(0,0,0,.2), 0 6px 16px rgba(22, 51, 28, .14);
            transition: background-color .2s ease, box-shadow .2s ease;
        }
        #slotBar.warning {
            box-shadow:
                inset 0 2px 8px rgba(0,0,0,.18),
                0 0 0 2px rgba(255, 216, 91, .4),
                0 6px 20px rgba(132, 102, 24, .22);
        }
        #slotBar.danger {
            background: linear-gradient(180deg, rgba(102, 45, 31, .72), rgba(76, 28, 23, .78));
            animation: dangerPulse 1s ease-in-out infinite;
        }
        #slotBar.shake {
            animation: slotShake .38s ease;
        }
        .slot {
            width: var(--ts, 72px); height: var(--ts, 72px);
            border: 1px dashed rgba(255,255,255,.35);
            border-radius: 11px;
            background: rgba(255, 255, 255, .13);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
            transition: background-color .16s ease, border-color .16s ease, transform .16s ease;
        }
        .slot::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,.18);
        }
        .slot.filled {
            border-style: solid;
            border-color: rgba(255,255,255,.62);
            background: rgba(255, 252, 237, .9);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 3px 8px rgba(0,0,0,.13);
        }
        .slot.filled::before {
            display: none;
        }
        .slot.matching {
            animation: slotMatch .38s cubic-bezier(.18,.85,.28,1);
            box-shadow: 0 0 0 4px rgba(255, 230, 109, .34), 0 0 20px rgba(255, 229, 113, .62);
        }
        .slot .face { font-size: calc(var(--ts, 72px) * .55); }
        .slot img {
            position: absolute; left: 7px; top: 7px;
            width: calc(var(--ts, 72px) - 14px); height: calc(var(--ts, 72px) - 14px);
            object-fit: contain;
            border-radius: 8px;
            pointer-events: none;
        }

        #gameFooter {
            width: var(--bw, 552px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 7px;
        }
        #tip {
            flex: 1;
            color: rgba(255,255,255,.88);
            font-size: 12px;
            line-height: 1.45;
            text-shadow: 0 1px 3px rgba(24, 55, 29, .3);
        }
        .linkbtn {
            flex: 0 0 auto;
            padding: 7px 12px;
            border: 1px solid rgba(255,255,255,.4);
            border-radius: 999px;
            background: rgba(255, 253, 238, .16);
            color: rgba(255,255,255,.96);
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background-color .16s ease, transform .16s ease;
        }
        .linkbtn:hover {
            background: rgba(255, 253, 238, .28);
        }
        .linkbtn:active {
            transform: translateY(1px);
        }

        /* ========== 胜利/失败 弹窗 ========== */
        #overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 50% 42%, rgba(104, 168, 90, .18), transparent 38%),
                rgba(12, 38, 21, .68);
            backdrop-filter: blur(7px);
            display: none;                 /* 默认隐藏，加 .show 才出现 */
            align-items: center; justify-content: center;
            z-index: 99;
        }
        #overlay.show { display: flex; }
        #overlay .card {
            width: min(90vw, 480px);
            background: linear-gradient(160deg, #fffdf5, #f3ecd3);
            border: 3px solid rgba(255,255,255,.88);
            border-radius: 24px;
            padding: 34px 44px;
            text-align: center;
            box-shadow: 0 18px 48px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255,255,255,.9);
            animation: dialogIn .28s cubic-bezier(.2,.85,.25,1);
        }
        @keyframes dialogIn {
            from { opacity: 0; transform: translateY(14px) scale(.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        #overlayMsg { font-size: 32px; font-weight: bold; color: #5a4a2f; }
        #overlay .sub { font-size: 14px; margin-top: 12px; color: #999; }
        .btn {
            margin-top: 20px;
            padding: 10px 32px;
            font-size: 18px;
            border: none; border-radius: 12px;
            background: #6dbf5e; color: #fff;
            cursor: pointer;
        }
        .btn:hover { background: #5cae4e; }
        .btn.revive { background: #e8836f; margin-left: 12px; }
        .btn.revive:hover { background: #d9705c; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        /* ========== 工具栏 ========== */
        #toolbar {
            width: var(--bw, 552px);
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .tool {
            position: relative;
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,.68);
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(246,242,222,.9));
            color: #4d4938;
            box-shadow: 0 4px 12px rgba(29, 59, 33, .14), inset 0 1px 0 rgba(255,255,255,.9);
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: transform .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
        }
        .tool:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(29, 59, 33, .18), inset 0 1px 0 rgba(255,255,255,.9);
        }
        .tool:active:not(:disabled) {
            transform: translateY(1px);
        }
        .tool-icon {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: rgba(106, 178, 91, .14);
            font-size: 18px;
        }
        .tool-copy {
            min-width: 0;
            flex: 1;
        }
        .tool-copy strong {
            display: block;
            font-size: 14px;
            line-height: 1.2;
        }
        .tool-copy small {
            display: block;
            overflow: hidden;
            color: #91866f;
            font-size: 10px;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cost-badge {
            flex: 0 0 auto;
            padding: 3px 7px;
            border-radius: 999px;
            color: #8b6917;
            background: #fff0b2;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }
        .tool:disabled { opacity: .45; cursor: not-allowed; }

        /* ===================================================================
           背景音乐：顶栏按钮 + 音量面板
           =================================================================== */
        #topbar {
            position: static;
            display: none;
            gap: 4px;
            align-items: center;
            z-index: auto;
        }
        body.in-game #topbar {
            display: flex;
        }
        .pill {
            border: none; border-radius: 999px;
            width: 32px; height: 32px;
            display: grid; place-items: center;
            padding: 0; font-size: 13px; line-height: 1;
            background: rgba(255, 255, 255, .92); color: #4a5a3f;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
            cursor: pointer; white-space: nowrap;
        }
        .pill:active { transform: translateY(1px); }
        .pill.off { opacity: .68; }
        .pill.icon { font-size: 14px; }
        #themeChangeBtn {
            width: auto;
            display: inline-flex;
            gap: 5px;
            padding: 0 10px;
            background: #fff1b6;
            color: #735a1a;
            font-family: inherit;
            font-size: 11px;
            font-weight: 800;
        }
        .pill .lbl { display: none; }

        #musicSheet {
            position: fixed; inset: 0; z-index: 120;
            background: rgba(0, 0, 0, .5);
            display: none; align-items: center; justify-content: center;
            padding: 16px; overflow: auto;
        }
        #musicSheet.show { display: flex; }
        #musicSheet .panel {
            width: 100%; max-width: 360px;
            background: #fffdf5; border-radius: 18px; padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .3);
            color: #5a4a2f; font-size: 14px;
        }
        #musicSheet h2 { font-size: 17px; color: #4a7a3f; margin-bottom: 6px; }
        #musicSheet .hint { font-size: 12px; color: #a09580; line-height: 1.6; margin-bottom: 14px; }
        #musicSheet .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        #musicSheet input[type=range] { width: 100%; accent-color: #6dbf5e; }
        #musicSheet .btn-close {
            width: 100%; margin-top: 14px; padding: 10px;
            border: none; border-radius: 10px; font-size: 14px;
            background: #6dbf5e; color: #fff; cursor: pointer;
        }
        #musicSheet .btn-close.ghost { background: #efe9da; color: #6b6152; margin-top: 8px; }

        @media (max-width: 480px) {
            .pill { width: 30px; height: 30px; padding: 0; font-size: 12px; }
        }

        /* ========== 开始界面 ========== */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding: clamp(24px, 5vh, 58px) 20px 0;
            background:
                linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(21,63,37,.04) 58%, rgba(17,50,29,.2) 100%),
                url("assets/start-bg.jpg") center / cover no-repeat;
            transition: opacity .35s ease, visibility .35s ease;
        }
        #startScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #startHero {
            position: absolute;
            top: clamp(16px, 3.5vh, 34px);
            left: clamp(16px, 3vw, 38px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: min(46vw, 330px);
            margin-top: 0;
            z-index: 1;
            transition: opacity .25s ease, transform .25s ease;
        }
        #startTitle {
            width: min(38vw, 310px);
            max-height: 27vh;
            object-fit: contain;
            filter: drop-shadow(0 10px 14px rgba(35, 72, 41, .22));
            animation: titleFloat 3.4s ease-in-out infinite;
        }
        #startTagline {
            margin-top: 8px;
            color: #3d5e3d;
            background: rgba(255, 253, 238, .65);
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 999px;
            padding: 6px 13px;
            font-size: clamp(10px, 1.15vw, 13px);
            letter-spacing: .12em;
            box-shadow: 0 5px 16px rgba(44, 81, 46, .1);
            backdrop-filter: blur(6px);
        }
        #startButtonWrap {
            margin-top: auto;
            padding-bottom: clamp(48px, 10vh, 102px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 11px;
        }
        #startBtn,
        #continueGameBtn {
            min-width: min(62vw, 290px);
            padding: 16px 48px 17px;
            border: 3px solid rgba(255,255,255,.9);
            border-radius: 999px;
            color: #fffdf1;
            background: linear-gradient(180deg, #78cf67, #3f9f55);
            box-shadow:
                0 7px 0 #2f7e43,
                0 14px 26px rgba(28, 75, 39, .32),
                inset 0 1px 0 rgba(255,255,255,.38);
            font-family: inherit;
            font-size: clamp(20px, 2.4vw, 26px);
            font-weight: 800;
            letter-spacing: .2em;
            text-indent: .2em;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
        }
        #startBtn:hover,
        #continueGameBtn:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);
            box-shadow:
                0 9px 0 #2f7e43,
                0 17px 32px rgba(28, 75, 39, .34),
                inset 0 1px 0 rgba(255,255,255,.38);
        }
        #startBtn:active,
        #continueGameBtn:active {
            transform: translateY(4px);
            box-shadow:
                0 3px 0 #2f7e43,
                0 8px 18px rgba(28, 75, 39, .28),
                inset 0 1px 0 rgba(255,255,255,.3);
        }
        #startBtn.secondary {
            color: #40583b;
            background: rgba(255, 253, 238, .72);
            border-color: rgba(255,255,255,.72);
            box-shadow:
                0 4px 0 rgba(77, 117, 65, .3),
                0 10px 22px rgba(31, 66, 36, .16);
            font-size: clamp(16px, 1.8vw, 20px);
            backdrop-filter: blur(7px);
        }
        #continueGameBtn small {
            display: block;
            margin-top: 5px;
            color: rgba(255,255,255,.88);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .04em;
        }
        #continueGameBtn[hidden],
        #challengeIntro[hidden] {
            display: none;
        }
        #challengeIntro {
            max-width: min(82vw, 360px);
            padding: 9px 18px 10px;
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 14px;
            color: #355339;
            background: rgba(255, 249, 214, .86);
            box-shadow: 0 7px 20px rgba(42, 74, 43, .16);
            text-align: center;
            backdrop-filter: blur(7px);
        }
        #challengeIntro small {
            display: block;
            color: #a27424;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .16em;
        }
        #challengeIntro strong {
            display: block;
            margin-top: 2px;
            font-size: 15px;
        }
        #challengeIntro span {
            display: block;
            margin-top: 2px;
            color: #766b54;
            font-size: 11px;
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) rotate(-.5deg); }
            50% { transform: translateY(-7px) rotate(.5deg); }
        }
        @keyframes stageIn {
            from { opacity: 0; transform: scale(.985); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes backdropDrift {
            from { transform: scale(1.04) translate3d(-.35%, -.25%, 0); }
            to { transform: scale(1.09) translate3d(.35%, .25%, 0); }
        }

        /* ========== 八款背景主题 ========== */
        #themeScreen {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: none;
            padding: clamp(18px, 4vh, 46px) clamp(16px, 3vw, 42px);
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.18), transparent 48%),
                rgba(20, 51, 31, .9);
            backdrop-filter: blur(8px);
            overflow: auto;
        }
        #startScreen.theme-open #startHero,
        #startScreen.theme-open #startButtonWrap {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
        }
        #startScreen.theme-open #themeScreen {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-panel {
            width: min(100%, 920px);
            margin: auto;
            text-align: center;
        }
        .theme-panel h2 {
            color: #fffdf0;
            font-size: clamp(22px, 3.2vw, 34px);
            letter-spacing: .1em;
            text-shadow: 0 3px 12px rgba(0,0,0,.24);
        }
        .theme-panel .theme-hint {
            color: rgba(255,255,255,.8);
            font-size: clamp(12px, 1.5vw, 15px);
            margin: 9px 0 clamp(16px, 3vh, 26px);
        }
        #themeGrid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(10px, 1.7vw, 18px);
        }
        .theme-card {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,.82);
            border-radius: 18px;
            padding: 0;
            background: #d9e5ce;
            box-shadow: 0 8px 22px rgba(0,0,0,.26);
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .theme-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s ease, filter .35s ease;
        }
        .theme-card span {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 26px 10px 11px;
            color: #fff;
            font-size: clamp(12px, 1.5vw, 15px);
            font-weight: 700;
            letter-spacing: .08em;
            text-shadow: 0 2px 5px rgba(0,0,0,.45);
            background: linear-gradient(transparent, rgba(17,44,26,.82));
        }
        .theme-card:hover,
        .theme-card:focus-visible {
            outline: none;
            transform: translateY(-5px) scale(1.02);
            border-color: #fff5a9;
            box-shadow: 0 14px 28px rgba(0,0,0,.32), 0 0 0 4px rgba(255,244,151,.18);
        }
        .theme-card:hover img {
            transform: scale(1.04);
        }
        .theme-card.selected {
            border-color: #fff09a;
            box-shadow:
                0 0 0 4px rgba(255, 239, 132, .3),
                0 14px 28px rgba(0,0,0,.3);
        }
        .theme-card.selected::after {
            content: "✓";
            position: absolute;
            top: 8px;
            right: 8px;
            width: 25px;
            height: 25px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #40633d;
            background: #fff2a2;
            box-shadow: 0 3px 9px rgba(0,0,0,.2);
            font-size: 14px;
            font-weight: 900;
        }
        #themeBackBtn {
            margin-top: clamp(18px, 3vh, 28px);
            padding: 9px 24px;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 999px;
            color: #fffdf0;
            background: rgba(255,255,255,.12);
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
        }

        /* ========== 游戏内更换主题 ========== */
        #gameThemePicker {
            position: fixed;
            inset: 0;
            z-index: 220;
            display: none;
            align-items: center;
            justify-content: center;
            padding: clamp(14px, 3vw, 34px);
            background:
                radial-gradient(circle at 50% 20%, rgba(116, 174, 96, .2), transparent 42%),
                rgba(15, 43, 24, .76);
            backdrop-filter: blur(9px);
        }
        #gameThemePicker.show {
            display: flex;
        }
        .game-theme-panel {
            width: min(100%, 880px);
            max-height: 92vh;
            overflow: auto;
            padding: clamp(18px, 3vw, 30px);
            border: 3px solid rgba(255,255,255,.72);
            border-radius: 26px;
            background: linear-gradient(155deg, rgba(31, 82, 46, .98), rgba(18, 57, 34, .98));
            box-shadow: 0 24px 64px rgba(0,0,0,.4);
            animation: dialogIn .26s cubic-bezier(.2,.85,.25,1);
        }
        .game-theme-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: clamp(15px, 2.5vh, 24px);
            color: #fffdf0;
        }
        .game-theme-head h2 {
            margin-top: 3px;
            font-size: clamp(22px, 3vw, 31px);
            letter-spacing: .06em;
        }
        .game-theme-head p {
            margin-top: 6px;
            color: rgba(255,255,255,.76);
            font-size: 12px;
        }
        .game-theme-kicker {
            color: #ffe889;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .18em;
        }
        #closeGameThemes {
            flex: 0 0 auto;
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255,255,255,.38);
            border-radius: 50%;
            color: #fff;
            background: rgba(255,255,255,.12);
            font-family: inherit;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            transition: background-color .16s ease, transform .16s ease;
        }
        #closeGameThemes:hover {
            background: rgba(255,255,255,.22);
            transform: rotate(8deg);
        }
        #gameThemeGrid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(10px, 1.7vw, 17px);
        }

        /* ========== 卡牌点击时的幼蛙特效 ========== */
        .baby-pop {
            position: fixed;
            z-index: 130;
            width: clamp(82px, 10vw, 128px);
            height: auto;
            pointer-events: none;
            transform: translate(-50%, -100%) rotate(var(--baby-rotate, 0deg)) scale(.35);
            transform-origin: 50% 88%;
            opacity: 0;
            filter: drop-shadow(0 8px 12px rgba(37,65,35,.26));
            animation: babyPop .72s cubic-bezier(.2,.85,.25,1) forwards;
            will-change: transform, opacity;
        }
        @keyframes babyPop {
            0% { opacity: 0; transform: translate(-50%, -82%) rotate(var(--baby-rotate, 0deg)) scale(.28); }
            34% { opacity: 1; transform: translate(-50%, -118%) rotate(var(--baby-rotate, 0deg)) scale(1.08); }
            72% { opacity: 1; transform: translate(-50%, -128%) rotate(var(--baby-rotate, 0deg)) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -158%) rotate(var(--baby-rotate, 0deg)) scale(.84); }
        }

        /* ========== 游戏反馈动效 ========== */
        @keyframes boardEnter {
            0% { opacity: .35; transform: scale(.975); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes shuffleFlash {
            0% { opacity: .8; transform: scale(.25) rotate(-20deg); }
            100% { opacity: 0; transform: scale(1.2) rotate(8deg); }
        }
        @keyframes tileHint {
            0%, 100% { box-shadow: 0 3px 0 #d8c083, 0 6px 10px rgba(51, 66, 38, .2); }
            50% { box-shadow: 0 0 0 5px rgba(255, 235, 105, .55), 0 0 24px rgba(255, 229, 96, .75); }
        }
        @keyframes statBump {
            0%, 100% { transform: scale(1); }
            45% { transform: scale(1.08) translateY(-1px); }
        }
        @keyframes dangerPulse {
            0%, 100% { box-shadow: inset 0 2px 8px rgba(0,0,0,.18), 0 0 0 2px rgba(255, 125, 90, .28); }
            50% { box-shadow: inset 0 2px 8px rgba(0,0,0,.18), 0 0 0 5px rgba(255, 125, 90, .16), 0 0 22px rgba(255, 110, 77, .35); }
        }
        @keyframes slotShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-.5deg); }
            55% { transform: translateX(5px) rotate(.5deg); }
            80% { transform: translateX(-2px); }
        }
        @keyframes slotMatch {
            0% { transform: scale(1); filter: brightness(1); }
            42% { transform: translateY(-7px) scale(1.13) rotate(-2deg); filter: brightness(1.22); }
            100% { transform: translateY(-25px) scale(.5) rotate(7deg); opacity: 0; filter: brightness(1.45); }
        }
        @keyframes matchSpark {
            0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--spark-angle)) translateY(0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--spark-angle)) translateY(-44px) scale(.15); }
        }
        #gameToast {
            position: fixed;
            left: 50%;
            top: 15%;
            z-index: 260;
            padding: 9px 18px;
            border: 1px solid rgba(255,255,255,.62);
            border-radius: 999px;
            color: #42603b;
            background: rgba(255, 251, 226, .95);
            box-shadow: 0 8px 24px rgba(23, 55, 29, .22);
            font-size: 13px;
            font-weight: 800;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -10px) scale(.94);
            transition: opacity .2s ease, transform .2s ease;
            white-space: nowrap;
        }
        #gameToast.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }
        #gameToast.hot {
            color: #fff;
            border-color: rgba(255,226,141,.8);
            background: linear-gradient(180deg, #eea44e, #dc6b4d);
            box-shadow: 0 9px 28px rgba(138, 66, 34, .32);
        }
        #gameToast.danger {
            color: #fff5ed;
            background: linear-gradient(180deg, #c85849, #943d39);
        }
        .match-burst {
            position: fixed;
            z-index: 145;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .match-burst i {
            --spark-angle: 0deg;
            position: absolute;
            left: 0;
            top: 0;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: #ffe46f;
            box-shadow: 0 0 10px rgba(255, 222, 84, .75);
            animation: matchSpark .55s ease-out forwards;
        }

        /* ========== 过关视频 ========== */
        #winVideoOverlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(17,38,25,.75);
            backdrop-filter: blur(8px);
        }
        #winVideoOverlay.show {
            display: flex;
        }
        .win-video-card {
            width: min(92vw, 540px);
            max-height: 94vh;
            overflow: auto;
            padding: 16px;
            border: 4px solid rgba(255,253,232,.9);
            border-radius: 26px;
            background: linear-gradient(180deg, #fffdf1, #f2ecd1);
            box-shadow: 0 24px 60px rgba(0,0,0,.38);
            text-align: center;
            animation: videoCardIn .28s ease-out;
        }
        @keyframes videoCardIn {
            from { opacity: 0; transform: translateY(12px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .win-video-frame {
            position: relative;
            overflow: hidden;
            border-radius: 17px;
            background: #243c29;
            width: auto;
            height: min(60vh, 620px);
            max-width: 100%;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
        }
        #winVideo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #000;
            pointer-events: none;
        }
        #winVideo::-webkit-media-controls,
        #winVideo::-webkit-media-controls-enclosure,
        #winVideo::-webkit-media-controls-panel {
            display: none !important;
            -webkit-appearance: none !important;
        }
        #winVideoTitle {
            margin-top: 13px;
            color: #42633d;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 800;
        }
        #winVideoSub {
            margin-top: 5px;
            color: #9a825a;
            font-size: 13px;
        }
        #nextLevelBtn {
            width: 100%;
            margin-top: 13px;
            padding: 12px 16px 13px;
            border: none;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(180deg, #70c760, #439e54);
            box-shadow: 0 5px 0 #337f43;
            font-family: inherit;
            cursor: pointer;
        }
        #nextLevelBtn strong {
            display: block;
            font-size: clamp(18px, 2.4vw, 23px);
            letter-spacing: .16em;
            text-indent: .16em;
        }
        #nextLevelBtn small {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            color: rgba(255,255,255,.9);
            letter-spacing: .04em;
        }
        #nextLevelBtn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #337f43;
        }
        #shareChallengeBtn {
            width: 100%;
            margin-top: 8px;
            padding: 10px 14px;
            border: 1px solid rgba(95, 133, 80, .35);
            border-radius: 13px;
            color: #4c683e;
            background: rgba(241, 247, 225, .92);
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color .16s ease, transform .16s ease;
        }
        #shareChallengeBtn:hover {
            background: #e8f3d4;
        }
        #shareChallengeBtn:active {
            transform: translateY(1px);
        }

        @media (max-width: 700px) {
            #themeGrid,
            #gameThemeGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .theme-panel { max-width: 520px; }
            .theme-card { aspect-ratio: 1 / 1.18; }
            #startHero {
                top: 14px;
                left: 14px;
                max-width: 58vw;
            }
            #startTitle {
                width: min(58vw, 250px);
                max-height: 24vh;
            }
            .win-video-card { padding: 12px; border-radius: 21px; }
            .win-video-frame { height: min(56vh, 560px); }
            .game-theme-panel { padding: 16px; border-radius: 21px; }
            .game-theme-head h2 { font-size: 21px; }
        }
        @media (max-height: 620px) {
            #startHero { top: 10px; }
            #startTitle { max-height: 25vh; }
            #startTagline { margin-top: 8px; padding: 5px 14px; }
            #startButtonWrap { padding-bottom: 34px; }
            #startBtn,
            #continueGameBtn { padding-top: 12px; padding-bottom: 13px; }
            .win-video-frame { height: min(50vh, 430px); }
        }

    </style>
</head>
<body>
    <!-- 开始界面：背景与标题均来自“奶了个蛙”素材 -->
    <section id="startScreen" aria-label="开始游戏">
        <div id="startHero">
            <img id="startTitle" src="assets/title.png" alt="奶了个蛙">
            <div id="startTagline">点开牌堆 · 找到快乐</div>
        </div>

        <div id="startButtonWrap">
            <div id="challengeIntro" hidden>
                <small>好友挑战</small>
                <strong id="challengeIntroTitle"></strong>
                <span id="challengeIntroTarget"></span>
            </div>
            <button id="continueGameBtn" type="button" hidden>
                继续游戏
                <small id="continueGameInfo"></small>
            </button>
            <button id="startBtn" type="button">开始游戏</button>
        </div>

        <!-- 点击开始后展示的八款背景主题 -->
        <div id="themeScreen" aria-hidden="true">
            <div class="theme-panel">
                <h2>选择你的奶蛙世界</h2>
                <p class="theme-hint">每款背景都做过淡化处理，牌面会保持清晰</p>
                <div id="themeGrid"></div>
                <button id="themeBackBtn" type="button">返回开始界面</button>
            </div>
        </div>
    </section>

    <div id="stage">
        <div id="gameHeader">
            <img id="gameTitle" src="assets/title.png" alt="奶了个蛙">
            <div id="headerRight">
                <div id="levelBadge">
                    <small>当前关卡</small>
                    <strong id="levelInfo"></strong>
                </div>
                <div id="topbar">
                    <button id="themeChangeBtn" class="pill" title="更换主题" aria-label="更换游戏主题">
                        <span aria-hidden="true">🎨</span><span>更换主题</span>
                    </button>
                    <button id="musicBtn" class="pill" title="背景音乐开关" aria-label="背景音乐开关">
                        <span class="ico">🔊</span><span class="lbl">音乐</span>
                    </button>
                    <button id="musicCfg" class="pill icon" title="音量设置" aria-label="音量设置">⚙</button>
                </div>
            </div>
        </div>

        <div id="stats">
            <div class="stat">
                <span class="stat-icon">⏱</span>
                <b id="timeText">00:00</b>
                <small>时间</small>
            </div>
            <div class="stat">
                <span class="stat-icon">👆</span>
                <b id="movesText">0</b>
                <small>步数</small>
            </div>
            <div class="stat coin-stat" id="coinStat">
                <span class="stat-icon">🪙</span>
                <b id="coinsText">0</b>
                <small>金币</small>
            </div>
            <div class="stat combo-stat" id="comboStat">
                <span class="stat-icon">⚡</span>
                <b id="comboText">×0</b>
                <small>连消</small>
            </div>
            <div class="stat">
                <span class="stat-icon">🏆</span>
                <b><span id="winsText">0</span> / <span id="losesText">0</span></b>
                <small>胜负</small>
            </div>
        </div>

        <div id="progressRow">
            <span>清理进度</span>
            <div class="progress-track"><i id="progressFill"></i></div>
            <span id="progressText">0 / 0 张</span>
        </div>

        <!-- 牌堆区：牌由 JS 动态生成，这里只放空容器 -->
        <div id="board"></div>

        <!-- 底部槽位：7 个格子 -->
        <div id="slotZone">
            <div id="slotMeta">
                <span>奶蛙手牌槽</span>
                <span id="slotCount">0 / 7</span>
            </div>
            <div id="slotBar">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div>
            </div>
        </div>

        <div id="toolbar">
            <button id="shuffleBtn" class="tool" type="button">
                <span class="tool-icon">🔀</span>
                <span class="tool-copy"><strong>打乱牌面</strong><small>保证出现可点组合</small></span>
                <span class="cost-badge">🪙 2</span>
            </button>
            <button id="removeBtn" class="tool" type="button">
                <span class="tool-icon">↩️</span>
                <span class="tool-copy"><strong>移回三张</strong><small>把手牌退回牌堆</small></span>
                <span class="cost-badge">🪙 2</span>
            </button>
        </div>

        <div id="gameFooter">
            <p id="tip">点击未被压住的牌，三张同款自动消除；槽位达到 7 张时挑战失败。</p>
            <button id="restartBtn" class="linkbtn" type="button">↻ 重开本关</button>
        </div>
    </div>

    <div id="gameToast" role="status" aria-live="polite"></div>

    <!-- 游戏进行中更换背景主题，不重置当前进度 -->
    <div id="gameThemePicker" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="gameThemeTitle">
        <div class="game-theme-panel">
            <div class="game-theme-head">
                <div>
                    <span class="game-theme-kicker">只更换背景</span>
                    <h2 id="gameThemeTitle">换个奶蛙世界</h2>
                    <p>当前关卡、计时、手牌和金币都会保留</p>
                </div>
                <button id="closeGameThemes" type="button" aria-label="关闭主题选择">×</button>
            </div>
            <div id="gameThemeGrid"></div>
        </div>
    </div>

    <!-- 胜负弹窗 -->
    <div id="overlay">
        <div class="card">
            <div id="overlayMsg"></div>
            <div class="sub" id="overlaySub"></div>
            <button id="overlayBtn" class="btn"></button>
            <button id="reviveBtn" class="btn revive" style="display:none">💘 复活（10 金币）</button>
        </div>
    </div>

    <!-- 每次过关随机播放一段奶蛙大笑视频 -->
    <div id="winVideoOverlay" aria-hidden="true">
        <div class="win-video-card">
            <div class="win-video-frame">
                <video id="winVideo" playsinline autoplay disablepictureinpicture
                    controlslist="nodownload nofullscreen noremoteplayback" preload="auto"></video>
            </div>
            <div id="winVideoTitle">过关啦！奶蛙笑出声</div>
            <div id="winVideoSub"></div>
            <button id="nextLevelBtn" type="button">
                <strong>下一关</strong>
                <small id="nextLevelCount"></small>
            </button>
            <button id="shareChallengeBtn" type="button">📤 挑战好友 · 分享相同牌局</button>
        </div>
    </div>

    <div id="musicSheet">
        <div class="panel">
            <h2>背景音乐</h2>
            <p class="hint" id="musicHint">默认音量 35%。切到别的标签页、最小化窗口或离开页面时会自动暂停，回来接着放。</p>
            <div class="row"><span>音量</span><b id="volText">35%</b></div>
            <input id="volRange" type="range" min="0" max="100" step="1" value="35">
            <button id="musicToggle" class="btn-close">暂停音乐</button>
            <button id="closeMusic" class="btn-close ghost">关闭</button>
        </div>
    </div>

    <script>
        /* =====================================================================
           背景音乐
           ---------------------------------------------------------------------
           · 音乐文件放在 audio/ 子目录或与本文件同级的根目录都能识别，
             按 mp3 → ogg → m4a → wav 的顺序取第一个能读到的。
           · 开关与音量记在 localStorage，下次打开沿用。
           · 浏览器不允许"没交互就出声"，所以首次点击/按键时补播一次。
           · 切到别的标签页、最小化、关闭或离开页面时立即静音，
             回到页面再自动续播。
           ===================================================================== */
        const BGM_CANDIDATES = [
            'assets/audio/bgm.mp3',
            'audio/bgm.mp3', 'bgm.mp3',
            'audio/bgm.ogg', 'bgm.ogg',
            'audio/bgm.m4a', 'bgm.m4a',
            'audio/bgm.wav', 'bgm.wav'
        ];
        const MUSIC_KEY = 'nlge-music';

        let bgmEl = null;
        let bgmTry = 0;
        let bgmBroken = false;     // 所有候选路径都读不到
        let musicOn = true;
        let musicVol = 0.35;
        let bgmFadeTimer = null;
        let bgmStarted = false;    // 成功播放过没有（决定回到页面时要不要续播）

        function musicPrefRead() {
            try {
                const raw = localStorage.getItem(MUSIC_KEY);
                if (!raw) return null;
                const v = JSON.parse(raw);
                return (v && typeof v === 'object') ? v : null;
            } catch (e) { return null; }
        }
        function musicPrefSave() {
            try {
                localStorage.setItem(MUSIC_KEY, JSON.stringify({ on: musicOn, vol: musicVol }));
            } catch (e) {}
        }

        function initMusic() {
            const pref = musicPrefRead();
            if (pref) {
                musicOn = pref.on !== false;
                const v = parseFloat(pref.vol);
                if (!isNaN(v)) musicVol = Math.min(1, Math.max(0, v));
            }

            try { bgmEl = new Audio(); } catch (e) { bgmEl = null; }
            if (!bgmEl) { bgmBroken = true; syncMusicUi(); return; }

            bgmEl.loop = true;
            bgmEl.preload = 'auto';
            bgmEl.volume = 0;
            bgmEl.addEventListener('error', () => { bgmTry++; loadBgmSource(); });
            bgmEl.addEventListener('playing', () => {
                bgmStarted = true;
                fadeBgm(musicOn ? musicVol : 0);
            });
            bgmEl.addEventListener('canplay', () => { if (musicOn) safePlay(); });

            loadBgmSource();
            syncMusicUi();

            // 首次用户操作时补播（绕过自动播放限制）
            const unlock = () => {
                if (musicOn) safePlay();
                ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
                    document.removeEventListener(ev, unlock);
                });
            };
            ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
                document.addEventListener(ev, unlock, { passive: true });
            });

            // 离开游戏界面就静音：切标签页/最小化、关闭、跳转、刷新都算
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    pauseGame('visibility');
                    saveProgress();
                    pauseForLeave();
                } else {
                    resumeGame('visibility');
                    if (musicOn && bgmStarted) safePlay();
                }
            });
            addEventListener('pagehide', () => { saveProgress(); pauseForLeave(); });
            addEventListener('beforeunload', () => { saveProgress(); pauseForLeave(); });
            addEventListener('blur', () => {
                // 窗口失焦（切到别的应用）也停，避免人不在还一直响
                if (document.hidden) pauseForLeave();
            });

            bindMusicUi();
            safePlay();
        }

        function loadBgmSource() {
            if (!bgmEl) return;
            if (bgmTry >= BGM_CANDIDATES.length) {
                bgmBroken = true;
                try {
                    console.warn('[奶了个蛙] 背景音乐一个都没找到。试过：' +
                        BGM_CANDIDATES.join('、'));
                } catch (e) {}
                syncMusicUi();
                return;
            }
            try {
                bgmEl.src = BGM_CANDIDATES[bgmTry];
                bgmEl.load();
            } catch (e) {}
        }

        function safePlay() {
            if (!bgmEl || bgmBroken || !musicOn) return;
            try {
                const p = bgmEl.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (e) {}
        }
        function safePause() {
            if (!bgmEl) return;
            try { bgmEl.pause(); } catch (e) {}
        }

        /* 离开页面：立即静音并暂停。用计时器淡出在 pagehide 时来不及执行，
           所以这里直接把音量归零再暂停，回来时再从 0 淡入。 */
        function pauseForLeave() {
            if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            if (!bgmEl) return;
            try { bgmEl.volume = 0; } catch (e) {}
            safePause();
        }

        function fadeBgm(target) {
            if (!bgmEl) return;
            if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            const from = (typeof bgmEl.volume === 'number') ? bgmEl.volume : 0;
            if (Math.abs(from - target) < 0.01) {
                try { bgmEl.volume = target; } catch (e) {}
                return;
            }
            const steps = 18;
            let i = 0;
            bgmFadeTimer = setInterval(() => {
                i++;
                const v = from + (target - from) * (i / steps);
                try { bgmEl.volume = Math.min(1, Math.max(0, v)); } catch (e) {}
                if (i >= steps) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            }, 45);
        }

        function toggleMusic() {
            if (bgmBroken) {
                openMusicSheet();
                return;
            }
            musicOn = !musicOn;
            musicPrefSave();
            if (musicOn) {
                safePlay();
                fadeBgm(musicVol);
            } else {
                fadeBgm(0);
                setTimeout(() => { if (!musicOn) safePause(); }, 900);
            }
            syncMusicUi();
        }

        function syncMusicUi() {
            const btn = document.getElementById('musicBtn');
            if (btn) {
                const ico = btn.querySelector('.ico');
                const lbl = btn.querySelector('.lbl');
                if (ico) ico.textContent = bgmBroken ? '🔇' : (musicOn ? '🔊' : '🔇');
                if (lbl) lbl.textContent = bgmBroken ? '无音乐' : (musicOn ? '音乐' : '静音');
                btn.classList.toggle('off', !musicOn || bgmBroken);
                btn.title = bgmBroken ? '没找到音乐文件' : (musicOn ? '点一下静音' : '点一下开启');
            }
            const tg = document.getElementById('musicToggle');
            if (tg) tg.textContent = bgmBroken ? '没有可播放的音乐文件' : (musicOn ? '暂停音乐' : '播放音乐');
            const hint = document.getElementById('musicHint');
            if (hint) {
                hint.textContent = bgmBroken
                    ? '没找到音乐文件。把 bgm.mp3 放进 audio/ 目录，或直接和 index.html 放在一起，刷新即可。'
                    : '默认音量 35%。切到别的标签页、最小化窗口或离开页面时会自动暂停，回来接着放。';
            }
            const vr = document.getElementById('volRange');
            if (vr) vr.value = String(Math.round(musicVol * 100));
            const vt = document.getElementById('volText');
            if (vt) vt.textContent = Math.round(musicVol * 100) + '%';
        }

        function openMusicSheet() {
            const el = document.getElementById('musicSheet');
            if (el) {
                el.classList.add('show');
                pauseGame('music');
            }
        }
        function closeMusicSheet() {
            const el = document.getElementById('musicSheet');
            if (el) {
                el.classList.remove('show');
                resumeGame('music');
            }
        }

        function bindMusicUi() {
            const on = (id, ev, fn) => {
                const el = document.getElementById(id);
                if (el) el.addEventListener(ev, fn);
            };
            on('musicBtn', 'click', toggleMusic);
            on('musicCfg', 'click', openMusicSheet);
            on('musicToggle', 'click', toggleMusic);
            on('closeMusic', 'click', closeMusicSheet);

            const sheet = document.getElementById('musicSheet');
            if (sheet) {
                sheet.addEventListener('click', (e) => {
                    if (e.target === sheet) closeMusicSheet();
                });
            }
            on('volRange', 'input', (e) => {
                musicVol = Math.min(1, Math.max(0, (parseInt(e.target.value, 10) || 0) / 100));
                musicPrefSave();
                if (musicOn) {
                    if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
                    try { bgmEl.volume = musicVol; } catch (err) {}
                }
                syncMusicUi();
            });
        }

        /* ========= 图案清单 =========
           对应 images 文件夹里的 9 张奶蛙图片；
           emoji 只是"保险丝"：万一图片加载失败才显示它 */
        const PATTERNS = [
            { file: '大笑奶蛙.png.jpg', emoji: '😆' },
            { file: '白色奶蛙.png.jpg', emoji: '⬜' },
            { file: '粉色奶蛙.png.jpg', emoji: '🌸' },
            { file: '终极奶蛙.png.jpg', emoji: '👑' },
            { file: '绿色奶蛙.png.jpg', emoji: '💚' },
            { file: '蓝色奶蛙.png.jpg', emoji: '💙' },
            { file: '虚空奶蛙.png.jpg', emoji: '🌌' },
            { file: '黄色奶蛙.png.jpg', emoji: '💛' },
            { file: '黑色奶蛙.png.jpg', emoji: '🖤' },
        ];

        /* ========= 开始页、主题与过关视频素材 ========= */
        const THEMES = Array.from({ length: 8 }, (_, i) => ({
            index: i + 1,
            image: 'assets/themes/theme-' + (i + 1) + '.jpg',
            name: '奶蛙主题 ' + (i + 1)
        }));
        const BABY_EFFECTS = Array.from(
            { length: 5 },
            (_, i) => 'assets/baby/baby-' + (i + 1) + '.png'
        );
        const WIN_VIDEOS = [
            'assets/videos/laugh-1.mp4',
            'assets/videos/laugh-2.mp4'
        ];

        /* ========= 关卡表：10 关，牌数逐级递增 =========
           注意：三消规则要求总数是 3 的倍数，
           所以 50→51、100→102 等，都往上凑齐 */
        const LEVEL_COUNTS = [27, 45, 63, 81, 102, 126, 150, 177, 207, 240];

        const SLOT_MAX = 7;      // 槽位上限
        let WX = 86;             // 两侧翼列区宽度
        let BOARD_W = 552;       // 牌堆区宽高（按关卡计算，与 CSS 变量同步）
        let BOARD_H = 512;
        let TILE_SIZE = 72;      // 当前关卡的牌边长（随关卡变化）
        const SAVE_KEY = 'nlge-save-v2';
        const SAVE_VERSION = 2;

        /* ========= 游戏状态（整个游戏的"记忆"） ========= */
        let level = 1;          // 当前第几关（1~10）
        let tiles = [];         // 牌堆里所有牌
        let slot = [];          // 底部槽位里的牌（按入槽顺序）
        let gameOver = false;   // 结束后锁死点击
        let moves = 0;          // 本关步数
        let seconds = 0;        // 本关已用秒数
        let timerId = null;     // 计时器句柄
        let gameStarted = false;
        let selectedTheme = 1;
        let activeChallenge = readChallengeFromUrl();
        const pauseSources = new Set();
        let inputLocked = false;
        let clearedCount = 0;
        let combo = 0;
        let comboTimer = null;
        let toastTimer = null;
        let runId = 0;
        let hintIds = new Set();
        let lastMatchAt = 0;
        let lastSlotCount = 0;
        let maxCombo = 0;
        let boardRng = Math.random;
        let currentBoardSeed = '';
        const tileEls = new Map();

        function readChallengeFromUrl() {
            try {
                const params = new URLSearchParams(location.search);
                const seed = params.get('challenge');
                if (!seed || !/^[A-Za-z0-9:_-]{1,90}$/.test(seed)) return null;
                const levelNumber = Math.min(
                    LEVEL_COUNTS.length,
                    Math.max(1, parseInt(params.get('level'), 10) || 1)
                );
                const seconds = Math.max(0, Math.min(86400, parseInt(params.get('time'), 10) || 0));
                const moves = Math.max(0, Math.min(100000, parseInt(params.get('moves'), 10) || 0));
                const bestCombo = Math.max(0, Math.min(999, parseInt(params.get('combo'), 10) || 0));
                const themeNumber = Math.min(
                    THEMES.length,
                    Math.max(1, parseInt(params.get('theme'), 10) || 1)
                );
                return { seed, level: levelNumber, seconds, moves, combo: bestCombo, theme: themeNumber };
            } catch (e) {
                return null;
            }
        }

        function formatClock(value) {
            const safe = Math.max(0, Number(value) || 0);
            const m = String(Math.floor(safe / 60)).padStart(2, '0');
            const s = String(safe % 60).padStart(2, '0');
            return m + ':' + s;
        }

        function pauseGame(reason) {
            if (!gameStarted || gameOver) return;
            if (timerId) {
                pauseSources.add(reason);
                stopTimer();
            }
        }

        function resumeGame(reason) {
            pauseSources.delete(reason);
            if (pauseSources.size === 0 && gameStarted && !gameOver && !document.hidden) {
                resumeTimer();
            }
        }

        function loadSave() {
            try {
                const data = JSON.parse(localStorage.getItem(SAVE_KEY));
                if (!data || data.version !== SAVE_VERSION) return null;
                if (!LEVEL_COUNTS[data.level - 1]) return null;
                if (data.mode !== 'fresh' && !Array.isArray(data.tiles)) return null;
                return data;
            } catch (e) {
                return null;
            }
        }

        function saveProgress() {
            if (!gameStarted || gameOver || !tiles.length || inputLocked) return;
            const data = {
                version: SAVE_VERSION,
                mode: 'play',
                level,
                theme: selectedTheme,
                seconds,
                moves,
                clearedCount,
                maxCombo,
                tileSize: TILE_SIZE,
                boardWidth: BOARD_W,
                boardHeight: BOARD_H,
                wingWidth: WX,
                boardSeed: currentBoardSeed,
                challenge: activeChallenge,
                slotIds: slot.map(t => t.id),
                tiles: tiles.map(t => ({
                    id: t.id,
                    layer: t.layer,
                    x: t.x,
                    y: t.y,
                    p: t.p,
                    removed: !!t.removed
                })),
                savedAt: Date.now()
            };
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
        }

        function saveFreshCheckpoint(levelNumber, challenge) {
            const data = {
                version: SAVE_VERSION,
                mode: 'fresh',
                level: levelNumber,
                theme: selectedTheme,
                challenge: challenge || null,
                savedAt: Date.now()
            };
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
        }

        function refreshStartOptions() {
            const save = loadSave();
            const continueBtn = document.getElementById('continueGameBtn');
            const continueInfo = document.getElementById('continueGameInfo');
            const startBtn = document.getElementById('startBtn');
            const intro = document.getElementById('challengeIntro');
            if (activeChallenge) {
                intro.hidden = false;
                continueBtn.hidden = true;
                startBtn.classList.remove('secondary');
                startBtn.textContent = '接受挑战';
                document.getElementById('challengeIntroTitle').textContent =
                    '第 ' + activeChallenge.level + ' 关 · 相同牌局';
                document.getElementById('challengeIntroTarget').textContent =
                    '好友目标：' + formatClock(activeChallenge.seconds) +
                    ' · ' + activeChallenge.moves + ' 步 · 连消 ×' + activeChallenge.combo;
                selectedTheme = activeChallenge.theme || selectedTheme;
                markSelectedTheme();
                return;
            }
            intro.hidden = true;
            if (save) {
                continueBtn.hidden = false;
                startBtn.classList.add('secondary');
                startBtn.textContent = '开始新游戏';
                continueInfo.textContent = save.mode === 'fresh'
                    ? '第 ' + save.level + ' 关 · 新牌局'
                    : '第 ' + save.level + ' 关 · 已清理 ' + (save.clearedCount || 0) + ' 张';
            } else {
                continueBtn.hidden = true;
                startBtn.classList.remove('secondary');
                startBtn.textContent = '开始游戏';
            }
        }

        /* ========= 计时器：开局启动，结束停表 ========= */
        function startTimer(initialSeconds) {
            stopTimer();
            seconds = Math.max(0, Number(initialSeconds) || 0);
            updateTime();
            timerId = setInterval(() => {
                seconds++;
                updateTime();
                if (seconds % 5 === 0) saveProgress();
            }, 1000);
        }
        function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
        function resumeTimer() {
            if (!timerId) {
                timerId = setInterval(() => {
                    seconds++;
                    updateTime();
                    if (seconds % 5 === 0) saveProgress();
                }, 1000);
            }
        }
        function updateTime() {
            document.getElementById('timeText').textContent = formatClock(seconds);
        }

        /* ========= 胜负记录：存浏览器 localStorage，关掉网页也不丢 ========= */
        function loadStats() {
            try { return JSON.parse(localStorage.getItem('yygy-stats')) || { wins: 0, loses: 0 }; }
            catch (e) { return { wins: 0, loses: 0 }; }
        }
        function renderStats() {
            const st = loadStats();
            document.getElementById('winsText').textContent = st.wins;
            document.getElementById('losesText').textContent = st.loses;
        }
        function addStat(key) {
            const st = loadStats();
            st[key]++;
            try { localStorage.setItem('yygy-stats', JSON.stringify(st)); } catch (e) {}
            renderStats();
        }

        /* ========= 金币与工具：通关 +2 币，打乱/移出各 2 币 ========= */
        const SHUFFLE_COST = 2;
        const REMOVE_COST = 2;
        const REVIVE_COST = 10;
        let coins = loadCoins();
        function loadCoins() {
            try { return parseInt(localStorage.getItem('yygy-coins')) || 0; } catch (e) { return 0; }
        }
        function saveCoins() {
            try { localStorage.setItem('yygy-coins', String(coins)); } catch (e) {}
        }
        function renderCoins() {
            document.getElementById('coinsText').textContent = coins;
            if (gameStarted) {
                const stat = document.getElementById('coinStat');
                stat.classList.remove('bump');
                void stat.offsetWidth;
                stat.classList.add('bump');
                setTimeout(() => stat.classList.remove('bump'), 430);
            }
            updateToolButtons();
        }
        function updateToolButtons() {
            document.getElementById('shuffleBtn').disabled =
                coins < SHUFFLE_COST || gameOver || inputLocked;
            document.getElementById('removeBtn').disabled =
                coins < REMOVE_COST || gameOver || inputLocked || slot.length === 0;
            document.getElementById('reviveBtn').disabled = coins < REVIVE_COST;
        }

        /* 打乱：把牌堆里剩余牌的图案重新洗牌（位置不动、脸型重排） */
        function useShuffle() {
            if (gameOver || inputLocked || coins < SHUFFLE_COST) return;
            coins -= SHUFFLE_COST; saveCoins(); renderCoins();
            const alive = tiles.filter(t => !t.removed);
            const facePool = alive.map(t => t.p);
            let triple = null;
            for (let attempt = 0; attempt < 24 && !triple; attempt++) {
                const faces = shuffle(facePool.slice(), boardRng);
                alive.forEach((t, i) => { t.p = faces[i]; });
                triple = findAccessibleTriple(alive);
            }
            triple = triple || ensureAccessibleTriple(alive);
            hintIds = new Set((triple || []).map(t => t.id));
            renderBoard();
            flashBoard('shuffle-flash');
            showGameToast(triple ? '牌面已重排，发光的牌可以凑成三消' : '牌面已重排');
            saveProgress();
            const currentRun = runId;
            setTimeout(() => {
                if (currentRun !== runId) return;
                hintIds.clear();
                renderBoard();
            }, 2200);
        }

        /* 移出：把槽里最后至多 3 张牌退回牌堆，腾出槽位救急 */
        function useRemove() {
            if (gameOver || inputLocked || coins < REMOVE_COST || slot.length === 0) return;
            coins -= REMOVE_COST; saveCoins(); renderCoins();
            slot.splice(-3).forEach(t => { t.removed = false; });
            resetCombo();
            renderAll();
            updateSlotState();
            showGameToast('已把最后几张手牌移回牌堆');
            saveProgress();
        }

        /* 复活：失败时把槽里所有牌退回牌堆、继续本局（计时继续） */
        function useRevive() {
            if (coins < REVIVE_COST) return;
            coins -= REVIVE_COST; saveCoins(); renderCoins();
            slot.forEach(t => { t.removed = false; });
            slot = [];
            gameOver = false;
            inputLocked = false;
            resetCombo();
            document.getElementById('overlay').classList.remove('show');
            resumeTimer();
            renderAll();
            updateSlotState();
            saveProgress();
        }

        function findAccessibleTriple(list) {
            const groups = new Map();
            list.forEach(tile => {
                if (tile.removed || isCovered(tile)) return;
                if (!groups.has(tile.p)) groups.set(tile.p, []);
                groups.get(tile.p).push(tile);
            });
            for (const group of groups.values()) {
                if (group.length >= 3) return group.slice(0, 3);
            }
            return null;
        }

        /* 随机洗牌后仍有概率没有可点三消，这里只交换牌面，不改变每种图案的总数 */
        function ensureAccessibleTriple(list) {
            let triple = findAccessibleTriple(list);
            if (triple) return triple;
            const accessible = list.filter(t => !t.removed && !isCovered(t));
            if (!accessible.length) return null;

            const counts = new Map();
            list.forEach(t => {
                if (!t.removed) counts.set(t.p, (counts.get(t.p) || 0) + 1);
            });
            let target = null;
            for (const [pattern, count] of counts) {
                if (count >= 3 && (target === null || count > counts.get(target))) target = pattern;
            }
            if (target === null) return null;

            let needed = 3 - accessible.filter(t => t.p === target).length;
            for (const tile of accessible) {
                if (needed <= 0) break;
                if (tile.p === target) continue;
                const donor = list.find(t =>
                    !t.removed && isCovered(t) && t.p === target
                );
                if (!donor) break;
                const previous = tile.p;
                tile.p = target;
                donor.p = previous;
                needed--;
            }
            return findAccessibleTriple(list);
        }

        /* 洗牌算法：把数组顺序随机打乱（发牌公平全靠它） */
        function shuffle(arr, rng) {
            const random = typeof rng === 'function' ? rng : Math.random;
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function hashString(text) {
            let hash = 2166136261;
            for (let i = 0; i < text.length; i++) {
                hash ^= text.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function mulberry32(seed) {
            let value = seed >>> 0;
            return function () {
                value += 0x6D2B79F5;
                let t = value;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function makeBoardSeed() {
            if (window.crypto && crypto.getRandomValues) {
                const values = new Uint32Array(2);
                crypto.getRandomValues(values);
                return values[0].toString(36) + values[1].toString(36);
            }
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }

        /* 牌越多牌越小，否则屏幕装不下 */
        function pickTileSize(count) {
            if (count <= 51) return 72;
            if (count <= 102) return 60;
            if (count <= 201) return 48;
            return 40;
        }

        function pickPatternCount(levelNumber) {
            if (levelNumber <= 2) return 5;
            if (levelNumber === 3) return 6;
            if (levelNumber === 4) return 7;
            if (levelNumber === 5) return 8;
            return PATTERNS.length;
        }

        /* ========= 关卡布局生成器 =========
           思路：第 0 层按网格铺满 → 第 1 层错开半格铺 → 第 2 层再对齐铺……
           一层层往上堆，直到位置数够本关牌数为止 */
        function buildLayout(count, size) {
            const step = size + 8;   // 同层间距：比牌宽一点，保证同层互不重叠
            const positions = [];
            const wxL = (WX - size) / 2;
            const wxR = WX + 380 + (WX - size) / 2;
            let SIDE_H;              // 侧边堆叠区需要的高度

            /* --- ① 两侧堆叠区 ---
               第 1、2 关：每侧 1 摞 4 张的细边小叠摞
               第 3 关起：收纳本关 60% 的牌（多数），每侧 3 摞深堆，
               摞内每层微移露边，深度自动计算 */
            if (level >= 3) {
                const perSide = Math.floor(count * 0.6 / 2);
                const STACKS = 3;                          // 每侧 3 摞
                const depth = Math.ceil(perSide / STACKS); // 每摞深度
                const peek = Math.max(4, Math.round(size * 0.10));
                const pileH = size + (depth - 1) * peek;
                SIDE_H = STACKS * pileH + (STACKS - 1) * 10 + 20;
                for (let sIdx = 0; sIdx < STACKS; sIdx++) {
                    const y = 10 + sIdx * (pileH + 10);
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxL, y: y + k * peek });
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxR, y: y + k * peek });
                }
            } else {
                const WING = 4;
                const peek = Math.max(6, Math.round(size * 0.12));
                const wy0 = (420 - (size + (WING - 1) * peek)) / 2;
                for (let k = 0; k < WING; k++) {
                    positions.push({ layer: k, x: wxL, y: wy0 + k * peek });
                    positions.push({ layer: k, x: wxR, y: wy0 + k * peek });
                }
                SIDE_H = 420;
            }

            /* --- 牌堆区总高度 = 侧区与中央区取大者 + 底部平铺排 --- */
            const CH = Math.max(420, SIDE_H);   // 中央区高度
            BOARD_H = CH + size + 20;

            /* --- ② 底部平铺排：单层摆一排，开局全部可点（原版的"安全区"） --- */
            const BOTTOM = 6;
            const bw = BOTTOM * step - 8;
            const bx0 = (BOARD_W - bw) / 2;
            for (let i = 0; i < BOTTOM; i++)
                positions.push({ layer: 0, x: bx0 + i * step, y: BOARD_H - size - 10 });

            /* --- ③ 中央主堆：剩下的牌进这里，交替层叠成原版标志性牌堆 --- */
            function mkGrid(x0, y0) {
                const pts = [];
                for (let y = y0; y + size <= CH - 10; y += step)
                    for (let x = x0; x + size <= WX + 380 - 10; x += step)
                        pts.push({ x, y });
                return pts;
            }
            // 所有关卡统一仿照第 1 关：上层错开半格、交叠成连续牌堆（不离散）
            const off = step / 2;
            const grids = [mkGrid(WX + 20, 20), mkGrid(WX + 20 + off, 20 + off)];

            // 向心聚拢：按"离中心距离"排序、由近及远取位置——
            // 牌少时挤成紧凑一坨，牌多时自然铺满，不会东一张西一张
            const cx = WX + 190, cy = CH / 2;   // 中央区域的中心点
            const byCenter = (a, b) =>
                ((a.x - cx) ** 2 + (a.y - cy) ** 2) - ((b.x - cx) ** 2 + (b.y - cy) ** 2);

            let layer = 0;
            while (positions.length < count) {
                const need = count - positions.length;
                const pts = grids[layer % 2].slice().sort(byCenter).slice(0, need);
                for (const p of pts) positions.push({ layer, x: p.x, y: p.y });
                layer++;
            }
            return positions;
        }

        /* ========= 开始页与八款主题 ========= */
        function createThemeCard(theme, onSelect) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'theme-card';
            btn.setAttribute('aria-label', '选择' + theme.name);
            btn.dataset.theme = theme.index;

            const img = document.createElement('img');
            img.src = theme.image;
            img.alt = '';
            img.loading = 'eager';

            const label = document.createElement('span');
            label.textContent = theme.name;
            btn.append(img, label);
            btn.addEventListener('click', () => onSelect(theme.index));
            return btn;
        }

        function buildThemePicker() {
            const grid = document.getElementById('themeGrid');
            grid.innerHTML = '';
            THEMES.forEach(theme => {
