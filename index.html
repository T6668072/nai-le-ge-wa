<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>奶了个蛙</title>
    <style>
        /* ========== 全局设置 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #7ec86f, #4a9d5f); /* 草地绿背景 */
            display: flex; align-items: center; justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 8px;
            overflow: hidden;              /* 缩放适配后不出滚动条 */
        }
        /* 游戏主体：由 fitScreen() 按屏幕整体缩放，任何屏幕都"刚好占满" */
        #stage {
            display: flex; flex-direction: column; align-items: center;
        }
        h1 {
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .25);
            margin-bottom: 8px;
            font-size: 28px;
        }
        #levelInfo { color: rgba(255,255,255,.95); font-size: 16px; margin-bottom: 6px; }
        #stats { color: rgba(255,255,255,.95); font-size: 14px; margin-bottom: 14px; }

        /* ========== 牌堆区 ========== */
        #board {
            position: relative;          /* 关键点1：牌堆区是"定位参照物" */
            width: var(--bw, 552px); height: var(--bh, 512px);
            background: rgba(255, 255, 255, .18);
            border-radius: 16px;
        }
        .tile {
            position: absolute;          /* 关键点2：每张牌用 left/top 摆位置 */
            width: var(--ts, 72px); height: var(--ts, 72px);   /* 尺寸由关卡决定 */
            background: #fffdf5;
            border-radius: 10px;
            border: 2px solid #e8d9b0;
            box-shadow: 0 3px 0 #d9c48e, 0 5px 8px rgba(0, 0, 0, .2); /* 厚度感 */
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform .1s;
        }
        .tile:hover { transform: translateY(-2px); }   /* 鼠标悬停微微浮起 */
        .tile .face { font-size: calc(var(--ts, 72px) * .55); }  /* emoji 占位图案 */
        .tile img {                                    /* 真图片盖在 emoji 上 */
            position: absolute; left: 6px; top: 6px;
            width: calc(var(--ts, 72px) - 12px); height: calc(var(--ts, 72px) - 12px);
            object-fit: contain;                       /* 等比例缩放，完整装进方块不变形 */
            border-radius: 6px;
            pointer-events: none;
        }
        /* 关键点3：被压住的牌变暗、不准点 */
        .tile.covered { filter: brightness(.55); cursor: default; }
        .tile.covered:hover { transform: none; }

        /* 飞行中的牌：脱离牌堆、飘向卡槽 */
        .fly {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            transition: left .25s ease-in, top .25s ease-in, width .25s ease-in, height .25s ease-in;
        }

        /* ========== 底部 7 格槽位 ========== */
        #slotBar {
            margin-top: 24px;
            display: inline-flex; gap: 6px; padding: 6px;
            background: rgba(0, 0, 0, .25);
            border-radius: 14px;
        }
        .slot {
            width: var(--ts, 72px); height: var(--ts, 72px);
            background: rgba(255, 255, 255, .9);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .slot .face { font-size: calc(var(--ts, 72px) * .55); }
        .slot img {
            position: absolute; left: 6px; top: 6px;
            width: calc(var(--ts, 72px) - 12px); height: calc(var(--ts, 72px) - 12px);
            object-fit: contain;
            border-radius: 6px;
            pointer-events: none;
        }

        #tip { margin-top: 12px; color: rgba(255,255,255,.85); font-size: 14px; }
        .linkbtn {
            margin-top: 10px;
            background: none; border: none;
            color: rgba(255,255,255,.9); font-size: 14px;
            cursor: pointer; text-decoration: underline;
        }

        /* ========== 胜利/失败 弹窗 ========== */
        #overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .55);
            display: none;                 /* 默认隐藏，加 .show 才出现 */
            align-items: center; justify-content: center;
            z-index: 99;
        }
        #overlay.show { display: flex; }
        #overlay .card {
            background: #fffdf5;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
        }
        #overlayMsg { font-size: 32px; font-weight: bold; color: #5a4a2f; }
        #overlay .sub { font-size: 14px; margin-top: 12px; color: #999; }
        .btn {
            margin-top: 20px;
            padding: 10px 32px;
            font-size: 18px;
            border: none; border-radius: 12px;
            background: #6dbf5e; color: #fff;
            cursor: pointer;
        }
        .btn:hover { background: #5cae4e; }
        .btn.revive { background: #e8836f; margin-left: 12px; }
        .btn.revive:hover { background: #d9705c; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        /* ========== 工具栏 ========== */
        #toolbar { margin-top: 14px; display: flex; gap: 12px; }
        .tool {
            min-width: 92px; padding: 8px 10px;
            border: none; border-radius: 12px;
            background: rgba(255, 255, 255, .92); color: #5a4a2f;
            font-size: 15px; line-height: 1.4;
            cursor: pointer;
        }
        .tool small { font-size: 12px; color: #b8860b; }
        .tool:disabled { opacity: .45; cursor: not-allowed; }

        /* ===================================================================
           新增：顶栏（音乐 / 账号）+ 弹层 + 存档位
           =================================================================== */
        #topbar {
            position: fixed; top: 10px; right: 10px;
            display: flex; gap: 8px; z-index: 80;
        }
        .pill {
            border: none; border-radius: 999px;
            padding: 8px 14px; font-size: 14px; line-height: 1;
            background: rgba(255, 255, 255, .92); color: #4a5a3f;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
            cursor: pointer; max-width: 44vw;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .pill .ico { font-size: 15px; }
        .pill .lbl { margin-left: 4px; }
        .pill:active { transform: translateY(1px); }
        .pill.off { opacity: .68; }

        .sheet {
            position: fixed; inset: 0; z-index: 120;
            background: rgba(0, 0, 0, .55);
            display: none; align-items: center; justify-content: center;
            padding: 16px; overflow: auto;
        }
        .sheet.show { display: flex; }
        .sheet .panel {
            width: 100%; max-width: 420px; max-height: 86vh; overflow: auto;
            background: #fffdf5; border-radius: 18px;
            padding: 20px; box-shadow: 0 12px 32px rgba(0, 0, 0, .3);
            color: #5a4a2f; font-size: 14px; text-align: left;
        }
        .panel h2 { font-size: 18px; margin-bottom: 6px; color: #4a7a3f; }
        .panel .hint { font-size: 12px; color: #a09580; line-height: 1.6; margin-bottom: 12px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tabs button {
            flex: 1; padding: 8px; border: none; border-radius: 10px;
            background: #eef0e6; color: #6b7a5d; font-size: 14px; cursor: pointer;
        }
        .tabs button.on { background: #6dbf5e; color: #fff; }
        .field { display: block; margin-bottom: 10px; }
        .field > span { display: block; font-size: 12px; color: #8a8069; margin-bottom: 4px; }
        .field input[type=text],
        .field input[type=password] {
            width: 100%; padding: 10px 12px; font-size: 16px;
            border: 1px solid #e2d9c2; border-radius: 10px;
            background: #fff; color: #4a4a3f; outline: none;
        }
        .field input:focus { border-color: #6dbf5e; }
        .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .mini {
            flex: 1 1 auto; min-width: 84px; padding: 9px 12px;
            border: none; border-radius: 10px; font-size: 14px;
            background: #6dbf5e; color: #fff; cursor: pointer;
        }
        .mini.ghost { background: #efe9da; color: #6b6152; }
        .mini.danger { background: #e8836f; }
        .mini:disabled { opacity: .45; cursor: not-allowed; }
        .msg { font-size: 13px; min-height: 18px; color: #d9705c; margin-top: 8px; }
        .msg.ok { color: #4f9d4a; }
        .slots { display: flex; flex-direction: column; gap: 8px; }
        .slotrow {
            border: 1px dashed #ddd3bb; border-radius: 12px; padding: 10px 12px;
            display: flex; align-items: center; gap: 10px;
        }
        .slotrow .info { flex: 1; min-width: 0; }
        .slotrow .info b { font-size: 13px; }
        .slotrow .info small { display: block; font-size: 11px; color: #a09580; margin-top: 3px; }
        .slotrow .ops { display: flex; gap: 6px; flex: none; }
        .slotrow .ops button {
            border: none; border-radius: 8px; padding: 7px 10px;
            font-size: 12px; background: #eef0e6; color: #5f6b52; cursor: pointer;
        }
        .slotrow .ops button.warn { color: #b4593f; }
        .sep { height: 1px; background: #ece4d3; margin: 14px 0; }
        textarea.code {
            width: 100%; height: 70px; resize: vertical;
            font-family: ui-monospace, Consolas, monospace; font-size: 11px;
            border: 1px solid #e2d9c2; border-radius: 10px; padding: 8px;
            color: #6b6152; background: #fff;
        }
        input[type=range] { width: 100%; accent-color: #6dbf5e; }
        #toast {
            position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
            background: rgba(0, 0, 0, .78); color: #fff; font-size: 14px;
            padding: 9px 18px; border-radius: 999px; z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity .2s;
            max-width: 86vw; text-align: center;
        }
        #toast.show { opacity: 1; }
        @media (max-width: 480px) {
            .pill { padding: 9px 11px; font-size: 13px; }
            .pill .lbl { display: none; }   /* 小屏只留图标，别挡住标题 */
            .sheet .panel { padding: 16px; }
        }

    </style>
</head>
<body>
    <div id="stage">
    <h1>🐸 奶了个蛙</h1>
    <div id="levelInfo"></div>
    <div id="stats">⏱ <span id="timeText">00:00</span>　·　🖱 步数 <span id="movesText">0</span>　·　🪙 金币 <span id="coinsText">0</span>　·　🏆 胜 <span id="winsText">0</span> / 负 <span id="losesText">0</span></div>

    <!-- 牌堆区：牌由 JS 动态生成，这里只放空容器 -->
    <div id="board"></div>

    <!-- 底部槽位：7 个格子 -->
    <div id="slotBar">
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div>
    </div>

    <div id="toolbar">
        <button id="shuffleBtn" class="tool">🔀 打乱<br><small>10 金币</small></button>
        <button id="removeBtn" class="tool">📤 移出<br><small>10 金币</small></button>
    </div>

    <p id="tip">规则：点没被压住的牌入槽 → 凑齐 3 只自动消除 → 槽满 7 格失败 / 全部消完进下一关</p>
    <button id="restartBtn" class="linkbtn">↻ 重开本关</button>
    </div>

    <!-- 胜负弹窗 -->
    <div id="overlay">
        <div class="card">
            <div id="overlayMsg"></div>
            <div class="sub" id="overlaySub"></div>
            <button id="overlayBtn" class="btn"></button>
            <button id="reviveBtn" class="btn revive" style="display:none">💘 复活（10 金币）</button>
        </div>
    </div>

    <!-- ========= 新增：顶栏（音乐 / 账号） ========= -->
    <div id="topbar">
        <button id="musicBtn" class="pill" title="背景音乐"><span class="ico">🔊</span><span class="lbl">音乐</span></button>
        <button id="userBtn" class="pill" title="账号与存档"><span class="ico">👤</span><span class="lbl">游客</span></button>
    </div>

    <!-- 登录 / 注册 -->
    <div class="sheet" id="authSheet">
        <div class="panel">
            <h2>登录 / 注册</h2>
            <p class="hint">账号和存档都存在这台设备的浏览器里，不用服务器；换设备请用「存档码」搬过去。</p>
            <div class="tabs">
                <button id="tabLogin" class="on">登录</button>
                <button id="tabReg">注册</button>
            </div>
            <label class="field"><span>昵称（2～16 个字，不能有空格）</span>
                <input id="inName" type="text" maxlength="16" autocomplete="username" placeholder="给自己的存档起个名字">
            </label>
            <label class="field"><span>密码（6～20 位）</span>
                <input id="inPwd" type="password" maxlength="20" autocomplete="current-password" placeholder="至少 6 位">
            </label>
            <label class="field" id="pwd2Wrap" style="display:none"><span>确认密码</span>
                <input id="inPwd2" type="password" maxlength="20" autocomplete="new-password" placeholder="再输一遍">
            </label>
            <div class="rowbtns">
                <button id="authGo" class="mini">登录</button>
                <button id="authGuest" class="mini ghost">游客继续玩</button>
            </div>
            <div class="msg" id="authMsg"></div>
        </div>
    </div>

    <!-- 账号信息 / 音乐 / 存档码 -->
    <div class="sheet" id="accSheet">
        <div class="panel">
            <h2 id="accName">账号</h2>
            <p class="hint" id="accHint"></p>
            <div class="rowbtns">
                <button id="openSaves" class="mini">存档位</button>
                <button id="switchAcc" class="mini ghost">切换账号</button>
            </div>
            <div class="sep"></div>
            <b>背景音乐</b>
            <div class="rowbtns" style="margin-top:8px">
                <button id="musicToggle" class="mini ghost">音乐：开</button>
            </div>
            <label class="field" style="margin-top:10px"><span>音量 <b id="volText">35%</b></span>
                <input id="volRange" type="range" min="0" max="100" step="1" value="35">
            </label>
            <div class="sep"></div>
            <b>存档码（跨设备搬家）</b>
            <p class="hint" style="margin:6px 0">导出：点「导出」把这串码复制走；导入：粘贴存档码后点「导入」，会覆盖当前账号的进度。</p>
            <textarea id="codeBox" class="code" spellcheck="false" placeholder="点「导出」生成存档码，或把存档码粘贴到这里"></textarea>
            <div class="rowbtns">
                <button id="exportBtn" class="mini">导出</button>
                <button id="importBtn" class="mini ghost">导入</button>
                <button id="closeAcc" class="mini ghost">关闭</button>
            </div>
            <div class="msg" id="accMsg"></div>
        </div>
    </div>

    <!-- 3 个手动存档位 -->
    <div class="sheet" id="saveSheet">
        <div class="panel">
            <h2>存档位</h2>
            <p class="hint">每次点牌都会自动记一份「没打完的牌面」，下次打开原样续上。下面是 3 个手动档位，可以把不同进度各存一格。</p>
            <div class="slots" id="slotList"></div>
            <div class="rowbtns" style="margin-top:14px">
                <button id="closeSaves" class="mini ghost">关闭</button>
            </div>
            <div class="msg" id="saveMsg"></div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        /* =====================================================================
           【新增 1】本地账号 + 多存档位
           【新增 2】背景音乐
           ---------------------------------------------------------------------
           设计说明（重要，先读这段）：
           · 网页版没有服务器，所以"账号"是这个浏览器里的本地账号：
             账号表、密码摘要、存档全部存在 localStorage 里。
             好处：不用花钱、不用部署后端、离线也能玩。
             代价：清浏览器缓存 / 换设备 / 换浏览器，存档不会自己跟着走
                   （用「存档码」可以手动搬到另一台设备）。
           · 密码不存明文，只存 sha256(盐 + 密码)，键名和算法与小程序版
             utils/store.js 完全一致，方便以后两边互通。
           · 以后要真正的云端账号，只需要把下面 kvGet / kvSet 换成云端 API，
             游戏逻辑一行都不用改。
           ===================================================================== */

        const NLGW = {
            ACC: 'NLGW_ACCOUNTS_V1',
            SESSION: 'NLGW_SESSION_V1',
            COINS: 'NLGW_COINS_V1_',
            STATS: 'NLGW_STATS_V1_',
            LEVEL: 'NLGW_LEVEL_V1_',
            AUTO: 'NLGW_AUTO_V1_',
            SLOTS: 'NLGW_SLOTS_V1_',
            MUSIC: 'NLGW_MUSIC_V1',
            /* 老版本（还没有账号系统时）用的键，只用来搬家 */
            LEGACY_COINS: 'yygy-coins',
            LEGACY_STATS: 'yygy-stats'
        };

        const GUEST = '__guest__';       // 游客账号的固定名字
        const SLOT_COUNT = 3;            // 手动存档位数量
        const SAVE_VERSION = 1;          // 存档格式版本，改了要兼容旧档
        const SALT_TAG = '|nlge-v1';

        /* ---------------- 极简 SHA-256（纯 JS，不依赖任何库） ----------------
           用途：密码不落明文。注意这只是"本地档位锁"，不是真正的安全边界：
           能开控制台的人一样能改 localStorage。 */
        const SHA_K = [
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
            0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
            0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
            0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
            0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
            0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
            0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];
        function shaRotr(x, n) { return (x >>> n) | (x << (32 - n)); }
        function shaUtf8Bytes(str) {
            const out = [];
            for (let i = 0; i < str.length; i++) {
                let c = str.charCodeAt(i);
                if (c < 0x80) {
                    out.push(c);
                } else if (c < 0x800) {
                    out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
                } else if (c >= 0xd800 && c < 0xdc00) {
                    i++;
                    const c2 = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
                    out.push(0xf0 | (c2 >> 18), 0x80 | ((c2 >> 12) & 63), 0x80 | ((c2 >> 6) & 63), 0x80 | (c2 & 63));
                } else {
                    out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
                }
            }
            return out;
        }
        function shaHex8(n) { let s = (n >>> 0).toString(16); while (s.length < 8) s = '0' + s; return s; }
        function sha256(message) {
            const bytes = shaUtf8Bytes(String(message));
            const bitLen = bytes.length * 8;
            const total = (((bytes.length + 1 + 8) + 63) >> 6) << 6;
            const buf = new Uint8Array(total);
            for (let i = 0; i < bytes.length; i++) buf[i] = bytes[i];
            buf[bytes.length] = 0x80;
            const dv = new DataView(buf.buffer);
            dv.setUint32(total - 8, Math.floor(bitLen / 4294967296));
            dv.setUint32(total - 4, bitLen >>> 0);

            let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
            let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
            const w = new Uint32Array(64);

            for (let off = 0; off < total; off += 64) {
                for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
                for (let i = 16; i < 64; i++) {
                    const x = w[i - 15], y = w[i - 2];
                    const s0 = shaRotr(x, 7) ^ shaRotr(x, 18) ^ (x >>> 3);
                    const s1 = shaRotr(y, 17) ^ shaRotr(y, 19) ^ (y >>> 10);
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                }
                let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
                for (let i = 0; i < 64; i++) {
                    const S1 = shaRotr(e, 6) ^ shaRotr(e, 11) ^ shaRotr(e, 25);
                    const ch = (e & f) ^ (~e & g);
                    const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
                    const S0 = shaRotr(a, 2) ^ shaRotr(a, 13) ^ shaRotr(a, 22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const t2 = (S0 + maj) >>> 0;
                    h = g; g = f; f = e; e = (d + t1) >>> 0;
                    d = c; c = b; b = a; a = (t1 + t2) >>> 0;
                }
                h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
                h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
            }
            return shaHex8(h0) + shaHex8(h1) + shaHex8(h2) + shaHex8(h3) +
                shaHex8(h4) + shaHex8(h5) + shaHex8(h6) + shaHex8(h7);
        }

        /* ---------------- localStorage 读写（出异常也不会把游戏搞崩） ---------------- */
        function kvGet(key, def) {
            try {
                const raw = localStorage.getItem(key);
                if (raw === null || raw === '') return def;
                const v = JSON.parse(raw);
                return (v === null || v === undefined) ? def : v;
            } catch (e) { return def; }
        }
        function kvSet(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
        }
        function kvDel(key) { try { localStorage.removeItem(key); } catch (e) {} }

        /* ---------------- 账号表 / 会话 ---------------- */
        function keyFor(prefix, user) { return prefix + encodeURIComponent(user || GUEST); }
        function uk(prefix) { return keyFor(prefix, currentUser() || GUEST); }
        function statsKey() { return uk(NLGW.STATS); }
        function coinsKey() { return uk(NLGW.COINS); }
        function levelKey() { return uk(NLGW.LEVEL); }
        function autoKey() { return uk(NLGW.AUTO); }
        function slotsKey() { return uk(NLGW.SLOTS); }

        function accounts() {
            const a = kvGet(NLGW.ACC, {});
            return (a && typeof a === 'object') ? a : {};
        }
        function saveAccounts(a) { kvSet(NLGW.ACC, a); }

        function randomSalt() {
            let s = '';
            const chars = 'abcdef0123456789';
            const rnd = [];
            let ok = false;
            try {
                const arr = new Uint8Array(24);
                (window.crypto || window.msCrypto).getRandomValues(arr);
                for (let i = 0; i < arr.length; i++) rnd.push(arr[i]);
                ok = rnd.length === 24;
            } catch (e) { ok = false; }
            if (!ok) { rnd.length = 0; for (let i = 0; i < 24; i++) rnd.push(Math.floor(Math.random() * 256)); }
            for (let i = 0; i < 24; i++) s += chars.charAt(rnd[i] % 16);
            return s;
        }
        function hashPwd(salt, pwd) { return sha256(salt + '|' + pwd + SALT_TAG); }

        function checkName(name) {
            if (!name || name.length < 2) return '昵称至少 2 个字';
            if (name.length > 16) return '昵称最多 16 个字';
            if (/\s/.test(name)) return '昵称里不能有空格';
            if (name === GUEST) return '这个昵称不能用';
            return '';
        }
        function checkPwd(pwd) {
            if (!pwd || pwd.length < 6) return '密码至少 6 位';
            if (pwd.length > 20) return '密码最多 20 位';
            return '';
        }

        function currentUser() {
            const s = kvGet(NLGW.SESSION, null);
            if (!s || !s.user) return '';
            const all = accounts();
            if (!all[s.user]) return '';      // 账号被清了，会话就失效
            return s.user;
        }
        function setSession(user) { kvSet(NLGW.SESSION, { user: user, at: Date.now() }); }
        function isGuestUser(u) { return !u || u === GUEST; }
        function displayName(u) { return isGuestUser(u) ? '游客' : u; }

        function ensureSession() {
            if (currentUser()) return;
            const all = accounts();
            if (!all[GUEST]) {
                all[GUEST] = { name: GUEST, salt: '', hash: '', guest: true, createdAt: Date.now(), lastLogin: Date.now() };
                saveAccounts(all);
            }
            setSession(GUEST);
        }

        /* 老版本没有账号系统，金币/胜负是全局的 —— 升级后归到「游客」名下，别丢 */
        function migrateLegacy() {
            const all = accounts();
            if (Object.keys(all).length > 0) return;              // 已经有账号体系了，不折腾
            const oldCoins = localStorage.getItem(NLGW.LEGACY_COINS);
            const oldStats = localStorage.getItem(NLGW.LEGACY_STATS);
            if (oldCoins === null && oldStats === null) return;

            if (oldCoins !== null) {
                const c = parseInt(oldCoins, 10);
                if (!isNaN(c)) kvSet(keyFor(NLGW.COINS, GUEST), c);
            }
            if (oldStats !== null) {
                try {
                    const st = JSON.parse(oldStats);
                    if (st && typeof st === 'object') kvSet(keyFor(NLGW.STATS, GUEST), st);
                } catch (e) {}
            }
            setSession(GUEST);
        }

        /* ---------------- 账号操作 ---------------- */

        function registerAccount(name, pwd) {
            name = String(name || '').trim();
            pwd = String(pwd || '');
            const err = checkName(name) || checkPwd(pwd);
            if (err) return { ok: false, msg: err };
            const all = accounts();
            if (all[name]) return { ok: false, msg: '这个昵称已经被注册了' };

            const salt = randomSalt();
            all[name] = { name: name, salt: salt, hash: hashPwd(salt, pwd), createdAt: Date.now(), lastLogin: Date.now() };
            saveAccounts(all);

            persistAuto();                 // 先把游客当前的牌面存进游客档
            setSession(name);              // 换成新账号
            const adopted = adoptGuestProgress(name);
            afterSwitch();
            return { ok: true, msg: adopted ? '注册成功，已把游客进度带过来' : '注册成功，开始新的一局' };
        }

        function loginAccount(name, pwd) {
            name = String(name || '').trim();
            pwd = String(pwd || '');
            if (!name) return { ok: false, msg: '请先填昵称' };
            if (!pwd) return { ok: false, msg: '请先填密码' };
            const all = accounts();
            const acc = all[name];
            if (!acc) return { ok: false, msg: '没有这个昵称，先去注册吧' };
            if (acc.hash !== hashPwd(acc.salt, pwd)) return { ok: false, msg: '密码不对，再想想' };

            acc.lastLogin = Date.now();
            saveAccounts(all);

            persistAuto();
            setSession(name);
            afterSwitch();
            return { ok: true, msg: '欢迎回来，' + name };
        }

        /* 注册时把游客档搬进新账号（新账号已有数据就不动） */
        function adoptGuestProgress(user) {
            const gCoins = kvGet(keyFor(NLGW.COINS, GUEST), null);
            const gStats = kvGet(keyFor(NLGW.STATS, GUEST), null);
            const gLevel = kvGet(keyFor(NLGW.LEVEL, GUEST), null);
            const gAuto = kvGet(keyFor(NLGW.AUTO, GUEST), null);
            if (gCoins === null && gStats === null && gLevel === null && !gAuto) return false;
            if (kvGet(keyFor(NLGW.COINS, user), null) !== null) return false;
            if (gCoins !== null) kvSet(keyFor(NLGW.COINS, user), gCoins);
            if (gStats !== null) kvSet(keyFor(NLGW.STATS, user), gStats);
            if (gLevel !== null) kvSet(keyFor(NLGW.LEVEL, user), gLevel);
            if (gAuto) kvSet(keyFor(NLGW.AUTO, user), gAuto);
            return true;
        }

        function toGuest() {
            persistAuto();
            setSession(GUEST);
            afterSwitch();
            toast('已退出登录，进度留在游客档');
        }

        /* 切换账号后：刷新金币/胜负 → 续上次牌面，没得续就按上次关卡开新局 */
        function afterSwitch() {
            hideAllSheets();
            applyProfile();
            refreshUserPill();
            const auto = loadAuto();
            const ok = auto && restoreSnapshot(auto.snap);
            if (!ok) {
                level = clampLevel(kvGet(levelKey(), 1));
                newGame();
            }
        }

        function applyProfile() {
            coins = loadCoins();
            renderStats();
            renderCoins();
        }

        function clampLevel(n) {
            const x = parseInt(n, 10) || 1;
            return Math.min(Math.max(x, 1), LEVEL_COUNTS.length);
        }
        function saveLevel(n) { kvSet(levelKey(), clampLevel(n)); }

        /* ---------------- 存档快照：把整副牌面压成一小段 JSON ---------------- */
        function snapshot() {
            return {
                v: SAVE_VERSION,
                level: level,
                tileSize: TILE_SIZE,
                wing: WX,
                boardW: BOARD_W,
                boardH: BOARD_H,
                moves: moves,
                seconds: seconds,
                // 用数组而不是对象，450 张牌也就十几 KB
                tiles: tiles.map(t => [t.id, t.layer, t.x, t.y, t.p, t.removed ? 1 : 0]),
                slot: slot.map(t => t.id),
                savedAt: Date.now()
            };
        }

        function restoreSnapshot(snap) {
            if (!snap || snap.v !== SAVE_VERSION) return false;
            if (!snap.tiles || !snap.tiles.length) return false;
            const lv = parseInt(snap.level, 10);
            if (!(lv >= 1 && lv <= LEVEL_COUNTS.length)) return false;

            TILE_SIZE = parseInt(snap.tileSize, 10) || 72;
            WX = parseInt(snap.wing, 10) || 86;
            BOARD_W = parseInt(snap.boardW, 10) || 552;
            BOARD_H = parseInt(snap.boardH, 10) || 512;
            const root = document.documentElement.style;
            root.setProperty('--ts', TILE_SIZE + 'px');
            root.setProperty('--bw', BOARD_W + 'px');
            root.setProperty('--bh', BOARD_H + 'px');

            tiles = snap.tiles.map(a => ({
                id: a[0], layer: a[1], x: a[2], y: a[3], p: a[4], removed: !!a[5]
            }));
            const byId = {};
            tiles.forEach(t => { byId[t.id] = t; });
            slot = [];
            (snap.slot || []).forEach(id => { const t = byId[id]; if (t) slot.push(t); });

            level = lv;
            moves = parseInt(snap.moves, 10) || 0;
            seconds = Math.max(0, parseInt(snap.seconds, 10) || 0);
            gameOver = false;

            document.getElementById('movesText').textContent = moves;
            document.getElementById('levelInfo').textContent =
                '第 ' + level + ' 关 / 共 ' + LEVEL_COUNTS.length + ' 关 · 本关 ' + LEVEL_COUNTS[level - 1] + ' 张牌';
            document.getElementById('overlay').classList.remove('show');

            stopTimer();
            updateTime();      // 先显示存档里的用时，再从这一刻接着走
            resumeTimer();

            renderAll();
            renderStats();
            fitScreen();
            return true;
        }

        /* ---------------- 自动存档：每次点牌后攒一下再写 ---------------- */
        let _persistTimer = null;
        function autoSave(immediate) {
            if (_persistTimer) { clearTimeout(_persistTimer); _persistTimer = null; }
            if (immediate) return persistAuto();
            _persistTimer = setTimeout(() => { _persistTimer = null; persistAuto(); }, 400);
        }
        function persistAuto() {
            if (!currentUser()) return;
            if (!tiles.length || gameOver) { kvDel(autoKey()); return; }
            kvSet(autoKey(), { snap: snapshot(), at: Date.now() });
        }
        function loadAuto() {
            const d = kvGet(autoKey(), null);
            return (d && d.snap) ? d : null;
        }

        /* ---------------- 3 个手动存档位 ---------------- */
        function loadSlots() {
            const arr = kvGet(slotsKey(), []);
            const out = [];
            for (let i = 0; i < SLOT_COUNT; i++) out.push((arr && arr[i]) ? arr[i] : null);
            return out;
        }
        function saveSlot(i) {
            if (gameOver) { saveMsg('本局已经结束了，先重开本关再存档'); return; }
            if (!tiles.length) { saveMsg('现在没有进行中的牌局'); return; }
            const list = loadSlots();
            list[i] = {
                level: level, moves: moves, seconds: seconds,
                time: nowText(), snap: snapshot()
            };
            kvSet(slotsKey(), list);
            renderSlots();
            saveMsg('已存到 ' + (i + 1) + ' 号位', true);
        }
        function loadSlot(i) {
            const s = loadSlots()[i];
            if (!s || !s.snap) { saveMsg('这个位置还是空的'); return; }
            if (!confirm('读取 ' + (i + 1) + ' 号位？当前这局的进度会被覆盖。')) return;
            if (!restoreSnapshot(s.snap)) { saveMsg('存档读不出来，可能已经损坏'); return; }
            renderSlots();
            saveMsg('已读取 ' + (i + 1) + ' 号位', true);
            toast('已读取 ' + (i + 1) + ' 号位');
        }
        function clearSlot(i) {
            const list = loadSlots();
            if (!list[i]) return;
            if (!confirm('删掉 ' + (i + 1) + ' 号位？删了就找不回来了。')) return;
            list[i] = null;
            kvSet(slotsKey(), list);
            renderSlots();
            saveMsg('已清空 ' + (i + 1) + ' 号位', true);
        }

        /* ---------------- 存档码：base64(JSON)，用于跨设备搬家 ---------------- */
        function b64encode(str) {
            try { return btoa(unescape(encodeURIComponent(str))); } catch (e) { return ''; }
        }
        function b64decode(b64) {
            try { return decodeURIComponent(escape(atob(String(b64).replace(/\s+/g, '')))); } catch (e) { return ''; }
        }
        function exportCode() {
            const data = {
                app: 'nai-le-ge-wa', v: SAVE_VERSION,
                user: displayName(currentUser()), at: Date.now(),
                coins: coins, stats: loadStats(),
                level: clampLevel(kvGet(levelKey(), level)),
                auto: loadAuto(), slots: loadSlots()
            };
            return b64encode(JSON.stringify(data));
        }
        function importCode(code) {
            const txt = b64decode(code);
            if (!txt) return { ok: false, msg: '这串码读不出来，确认复制全了吗' };
            let d = null;
            try { d = JSON.parse(txt); } catch (e) { return { ok: false, msg: '存档码格式不对' }; }
            if (!d || d.app !== 'nai-le-ge-wa' || d.v !== SAVE_VERSION) {
                return { ok: false, msg: '不是这个游戏的存档码，或者版本不匹配' };
            }
            if (!confirm('导入会覆盖当前账号的金币、胜负和存档，确定吗？')) return { ok: false, msg: '' };

            if (typeof d.coins === 'number') kvSet(coinsKey(), Math.max(0, Math.floor(d.coins)));
            if (d.stats && typeof d.stats === 'object') {
                kvSet(statsKey(), {
                    wins: Math.max(0, parseInt(d.stats.wins, 10) || 0),
                    loses: Math.max(0, parseInt(d.stats.loses, 10) || 0)
                });
            }
            if (d.level) saveLevel(d.level);
            if (d.auto && d.auto.snap) kvSet(autoKey(), d.auto); else kvDel(autoKey());
            if (Array.isArray(d.slots)) kvSet(slotsKey(), d.slots.slice(0, SLOT_COUNT));

            applyProfile();
            const auto = loadAuto();
            if (!(auto && restoreSnapshot(auto.snap))) {
                level = clampLevel(kvGet(levelKey(), 1));
                newGame();
            }
            renderSlots();
            return { ok: true, msg: '导入成功' };
        }

        /* ---------------- 界面：顶栏、弹层、存档位 ---------------- */
        let _toastTimer = null;
        function toast(msg) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('show');
            if (_toastTimer) clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
        }
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function pad2(n) { return n < 10 ? '0' + n : '' + n; }
        function fmtSec(sec) {
            const s = Math.max(0, Math.floor(sec || 0));
            return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
        }
        function nowText() {
            const d = new Date();
            return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        }

        function setPill(el, ico, lbl) {
            if (!el) return;
            const i = el.querySelector('.ico');
            const l = el.querySelector('.lbl');
            if (i) i.textContent = ico;
            if (l) l.textContent = lbl;
        }

        function refreshUserPill() {
            const u = currentUser();
            const btn = document.getElementById('userBtn');
            if (!btn) return;
            setPill(btn, '👤', isGuestUser(u) ? '游客' : u);
            btn.title = isGuestUser(u) ? '游客模式：点这里登录或注册' : '账号：' + u;
        }

        function openSheet(id) {
            stopTimer();                       // 弹层打开时不计时，跟小程序版一致
            const el = document.getElementById(id);
            if (el) el.classList.add('show');
        }
        function closeSheet(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('show');
            if (!gameOver) resumeTimer();
        }
        function hideAllSheets() {
            ['authSheet', 'accSheet', 'saveSheet'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('show');
            });
            if (!gameOver) resumeTimer();
        }

        function setAuthMode(kind) {
            const isReg = kind === 'reg';
            document.getElementById('tabLogin').classList.toggle('on', !isReg);
            document.getElementById('tabReg').classList.toggle('on', isReg);
            document.getElementById('pwd2Wrap').style.display = isReg ? 'block' : 'none';
            document.getElementById('authGo').textContent = isReg ? '注册并开始' : '登录';
            authMsg('');
        }
        function authMsg(msg, ok) {
            const el = document.getElementById('authMsg');
            el.textContent = msg || '';
            el.classList.toggle('ok', !!ok);
        }
        function saveMsg(msg, ok) {
            const el = document.getElementById('saveMsg');
            el.textContent = msg || '';
            el.classList.toggle('ok', !!ok);
        }
        function accMsg(msg, ok) {
            const el = document.getElementById('accMsg');
            el.textContent = msg || '';
            el.classList.toggle('ok', !!ok);
        }

        function submitAuth() {
            const kind = document.getElementById('tabReg').classList.contains('on') ? 'reg' : 'login';
            const name = document.getElementById('inName').value;
            const pwd = document.getElementById('inPwd').value;
            if (kind === 'reg') {
                const pwd2 = document.getElementById('inPwd2').value;
                if (String(pwd) !== String(pwd2)) { authMsg('两次输入的密码不一样'); return; }
                const res = registerAccount(name, pwd);
                if (!res.ok) { authMsg(res.msg); return; }
                authMsg(res.msg, true);
                toast(res.msg);
            } else {
                const res = loginAccount(name, pwd);
                if (!res.ok) { authMsg(res.msg); return; }
                authMsg(res.msg, true);
                toast(res.msg);
            }
            document.getElementById('inPwd').value = '';
            document.getElementById('inPwd2').value = '';
        }

        function openAccountSheet() {
            const u = currentUser();
            document.getElementById('accName').textContent = isGuestUser(u) ? '当前：游客' : '当前账号：' + u;
            document.getElementById('accHint').textContent = isGuestUser(u)
                ? '游客进度只在这个浏览器里。注册一个账号可以多出 3 个存档位，也能导出存档码换设备接着玩。'
                : '这个账号的金币、胜负和存档都存在本机浏览器；换设备请用下面的存档码。';
            document.getElementById('switchAcc').textContent = isGuestUser(u) ? '登录 / 注册' : '切换账号';            document.getElementById('codeBox').value = '';
            accMsg('');
            syncMusicUi();
            openSheet('accSheet');
        }

        function renderSlots() {
            const box = document.getElementById('slotList');
            if (!box) return;
            const list = loadSlots();
            box.innerHTML = '';
            list.forEach((s, i) => {
                const row = document.createElement('div');
                row.className = 'slotrow';
                const info = document.createElement('div');
                info.className = 'info';
                if (!s || !s.snap) {
                    info.innerHTML = '<b>' + (i + 1) + ' 号位 · 空</b><small>点「存档」把当前进度存到这里</small>';
                } else {
                    info.innerHTML = '<b>' + (i + 1) + ' 号位 · 第 ' + (s.level || 1) + ' 关 · ' +
                        (s.moves || 0) + ' 步</b><small>' + fmtSec(s.seconds) + ' · ' + esc(s.time || '') + '</small>';
                }
                const ops = document.createElement('div');
                ops.className = 'ops';
                const bSave = document.createElement('button');
                bSave.textContent = '存档';
                bSave.onclick = () => saveSlot(i);
                const bLoad = document.createElement('button');
                bLoad.textContent = '读取';
                bLoad.disabled = !(s && s.snap);
                bLoad.onclick = () => loadSlot(i);
                const bDel = document.createElement('button');
                bDel.textContent = '清空';
                bDel.className = 'warn';
                bDel.disabled = !(s && s.snap);
                bDel.onclick = () => clearSlot(i);
                ops.appendChild(bSave); ops.appendChild(bLoad); ops.appendChild(bDel);
                row.appendChild(info); row.appendChild(ops);
                box.appendChild(row);
            });
        }

        /* =====================================================================
           【新增 2】背景音乐
           ---------------------------------------------------------------------
           用法：把音乐文件放到 audio/ 目录，按这个顺序找，找到哪个用哪个：
                 audio/bgm.mp3  →  audio/bgm.ogg  →  audio/bgm.m4a  →  audio/bgm.wav
           要点：
           · loop 无缝循环；音量默认 35%，可在「账号」面板里调，选择会记住。
           · 浏览器不允许"用户没操作就出声"，所以首次点击/按键时补播一次，
             这是标准做法，不是 bug。
           · 没找到音乐文件时按钮变成「🔇 无音乐」，游戏不受影响。
           ===================================================================== */
        const BGM_CANDIDATES = ['audio/bgm.mp3', 'audio/bgm.ogg', 'audio/bgm.m4a', 'audio/bgm.wav'];
        let bgmEl = null;
        let bgmTry = 0;
        let bgmBroken = false;
        let musicOn = true;
        let musicVol = 0.35;
        let bgmFadeTimer = null;

        function loadMusicPref() {
            const p = kvGet(NLGW.MUSIC, {});
            musicOn = (p && p.on !== false);
            const v = (p && typeof p.vol === 'number') ? p.vol : 0.35;
            musicVol = Math.min(1, Math.max(0, v));
        }
        function saveMusicPref() { kvSet(NLGW.MUSIC, { on: musicOn, vol: musicVol }); }

        function initMusic() {
            loadMusicPref();
            try { bgmEl = new Audio(); } catch (e) { bgmEl = null; }
            if (!bgmEl) { bgmBroken = true; syncMusicUi(); return; }

            bgmEl.loop = true;
            bgmEl.preload = 'auto';
            bgmEl.volume = 0;
            bgmEl.addEventListener('error', () => { bgmTry++; loadBgmSource(); });
            bgmEl.addEventListener('playing', () => { fadeBgm(musicOn ? musicVol : 0); });
            bgmEl.addEventListener('canplay', () => { if (musicOn) safePlay(); });

            loadBgmSource();
            syncMusicUi();

            // 首次用户操作时补播（绕过自动播放限制）
            const unlock = () => {
                if (musicOn) safePlay();
                ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
                    document.removeEventListener(ev, unlock);
                });
            };
            ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
                document.addEventListener(ev, unlock, { passive: true });
            });
            safePlay();      // 有的浏览器/用户设置允许直接播，试一下不亏
        }

        function loadBgmSource() {
            if (!bgmEl) return;
            if (bgmTry >= BGM_CANDIDATES.length) {
                bgmBroken = true;
                syncMusicUi();
                return;
            }
            try {
                bgmEl.src = BGM_CANDIDATES[bgmTry];
                bgmEl.load();
            } catch (e) {}
        }

        function safePlay() {
            if (!bgmEl || bgmBroken || !musicOn) return;
            try {
                const p = bgmEl.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (e) {}
        }
        function safePause() {
            if (!bgmEl) return;
            try { bgmEl.pause(); } catch (e) {}
        }

        function fadeBgm(target) {
            if (!bgmEl) return;
            if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            const from = (typeof bgmEl.volume === 'number') ? bgmEl.volume : 0;
            if (Math.abs(from - target) < 0.01) {
                try { bgmEl.volume = target; } catch (e) {}
                return;
            }
            const steps = 18;
            let i = 0;
            bgmFadeTimer = setInterval(() => {
                i++;
                const v = from + (target - from) * (i / steps);
                try { bgmEl.volume = Math.min(1, Math.max(0, v)); } catch (e) {}
                if (i >= steps) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
            }, 45);
        }

        function toggleMusic() {
            if (bgmBroken) {
                toast('还没放音乐文件：把 mp3 放到 audio/bgm.mp3 就会响');
                return;
            }
            musicOn = !musicOn;
            saveMusicPref();
            if (musicOn) {
                safePlay();
                fadeBgm(musicVol);
            } else {
                fadeBgm(0);
                setTimeout(() => { if (!musicOn) safePause(); }, 900);
            }
            syncMusicUi();
        }

        function syncMusicUi() {
            const btn = document.getElementById('musicBtn');
            if (btn) {
                if (bgmBroken) setPill(btn, '🔇', '无音乐');
                else if (musicOn) setPill(btn, '🔊', '音乐');
                else setPill(btn, '🔇', '静音');
                btn.classList.toggle('off', !musicOn || bgmBroken);
                btn.title = bgmBroken ? '没找到 audio/bgm.*，放一首进去就有了' : (musicOn ? '点一下关掉背景音乐' : '点一下打开背景音乐');
            }
            const tb = document.getElementById('musicToggle');
            if (tb) tb.textContent = musicOn ? '音乐：开' : '音乐：关';
            const vr = document.getElementById('volRange');
            if (vr) vr.value = String(Math.round(musicVol * 100));
            const vt = document.getElementById('volText');
            if (vt) vt.textContent = Math.round(musicVol * 100) + '%';
        }

        /* ---------------- 事件绑定 ---------------- */
        function bindUi() {
            const on = (id, ev, fn) => {
                const el = document.getElementById(id);
                if (el) el.addEventListener(ev, fn);
            };

            on('musicBtn', 'click', toggleMusic);
            on('musicToggle', 'click', toggleMusic);

            on('userBtn', 'click', () => openAccountSheet());

            on('tabLogin', 'click', () => setAuthMode('login'));
            on('tabReg', 'click', () => setAuthMode('reg'));
            on('authGo', 'click', submitAuth);
            on('authGuest', 'click', () => {
                if (isGuestUser(currentUser())) hideAllSheets();
                else toGuest();
            });

            on('openSaves', 'click', () => { renderSlots(); saveMsg(''); openSheet('saveSheet'); });
            on('closeSaves', 'click', () => closeSheet('saveSheet'));
            on('closeAcc', 'click', () => closeSheet('accSheet'));

            on('switchAcc', 'click', () => {
                if (isGuestUser(currentUser())) { setAuthMode('login'); openSheet('authSheet'); }
                else {
                    if (!confirm('退出当前账号？进度已经自动保存，重新登录就能继续。')) return;
                    toGuest();
                    setAuthMode('login');
                    openSheet('authSheet');
                }
            });

            on('exportBtn', 'click', () => {
                const code = exportCode();
                const box = document.getElementById('codeBox');
                box.value = code;
                box.select();
                let copied = false;
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(code).then(() => {}, () => {});
                        copied = true;
                    }
                } catch (e) {}
                accMsg(copied ? '存档码已生成并复制，粘贴到另一台设备即可' : '存档码已生成，手动复制下面这串', true);
            });

            on('importBtn', 'click', () => {
                const code = document.getElementById('codeBox').value;
                if (!code || !code.trim()) { accMsg('先把存档码粘贴到上面'); return; }
                const res = importCode(code);
                if (!res.ok) { accMsg(res.msg || ''); return; }
                accMsg(res.msg, true);
                toast(res.msg);
            });

            on('volRange', 'input', (e) => {
                musicVol = Math.min(1, Math.max(0, (parseInt(e.target.value, 10) || 0) / 100));
                saveMusicPref();
                if (musicOn) {
                    if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
                    try { bgmEl.volume = musicVol; } catch (err) {}
                }
                syncMusicUi();
            });

            // 点空白处关掉弹层
            ['authSheet', 'accSheet', 'saveSheet'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('click', (e) => {
                    if (e.target === el) {
                        if (id === 'saveSheet') closeSheet('saveSheet');
                        else if (id === 'accSheet') closeSheet('accSheet');
                        else closeSheet('authSheet');
                    }
                });
            });

            // 关页面 / 切后台前，把当前牌面落盘
            addEventListener('pagehide', () => persistAuto());
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) persistAuto();
            });
        }

        /* ---------------- 启动 ---------------- */
        function boot() {
            applyProfile();
            refreshUserPill();
            const auto = loadAuto();
            if (!(auto && restoreSnapshot(auto.snap))) {
                level = clampLevel(kvGet(levelKey(), 1));
                newGame();
            }
            initMusic();
            bindUi();
        }

        /* 脚本一加载就把"老存档搬家 + 游客会话"做完，后面 loadCoins() 才读得到正确的键 */
        migrateLegacy();
        ensureSession();

        /* ========= 图案清单 =========
           对应 images 文件夹里的 9 张奶蛙图片；
           emoji 只是"保险丝"：万一图片加载失败才显示它 */
        const PATTERNS = [
            { file: '大笑奶蛙.png.jpg', emoji: '😆' },
            { file: '白色奶蛙.png.jpg', emoji: '⬜' },
            { file: '粉色奶蛙.png.jpg', emoji: '🌸' },
            { file: '终极奶蛙.png.jpg', emoji: '👑' },
            { file: '绿色奶蛙.png.jpg', emoji: '💚' },
            { file: '蓝色奶蛙.png.jpg', emoji: '💙' },
            { file: '虚空奶蛙.png.jpg', emoji: '🌌' },
            { file: '黄色奶蛙.png.jpg', emoji: '💛' },
            { file: '黑色奶蛙.png.jpg', emoji: '🖤' },
        ];

        /* ========= 关卡表：10 关，牌数逐级递增 =========
           注意：三消规则要求总数是 3 的倍数，
           所以 50→51、100→102 等，都往上凑齐 */
        const LEVEL_COUNTS = [27, 51, 102, 150, 201, 252, 300, 351, 402, 450];

        const SLOT_MAX = 7;      // 槽位上限
        let WX = 86;             // 两侧翼列区宽度
        let BOARD_W = 552;       // 牌堆区宽高（按关卡计算，与 CSS 变量同步）
        let BOARD_H = 512;
        let TILE_SIZE = 72;      // 当前关卡的牌边长（随关卡变化）

        /* ========= 游戏状态（整个游戏的"记忆"） ========= */
        let level = 1;          // 当前第几关（1~10）
        let tiles = [];         // 牌堆里所有牌
        let slot = [];          // 底部槽位里的牌（按入槽顺序）
        let gameOver = false;   // 结束后锁死点击
        let moves = 0;          // 本关步数
        let seconds = 0;        // 本关已用秒数
        let timerId = null;     // 计时器句柄

        /* ========= 计时器：开局启动，结束停表 ========= */
        function startTimer() {
            stopTimer();
            seconds = 0;
            updateTime();
            timerId = setInterval(() => { seconds++; updateTime(); }, 1000);
        }
        function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
        function resumeTimer() { if (!timerId) timerId = setInterval(() => { seconds++; updateTime(); }, 1000); }
        function updateTime() {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timeText').textContent = m + ':' + s;
        }

        /* ========= 胜负记录：存在当前账号名下，关掉网页也不丢 ========= */
        function loadStats() {
            try {
                const st = JSON.parse(localStorage.getItem(statsKey()));
                if (st && typeof st === 'object') {
                    return { wins: parseInt(st.wins, 10) || 0, loses: parseInt(st.loses, 10) || 0 };
                }
                return { wins: 0, loses: 0 };
            } catch (e) { return { wins: 0, loses: 0 }; }
        }
        function renderStats() {
            const st = loadStats();
            document.getElementById('winsText').textContent = st.wins;
            document.getElementById('losesText').textContent = st.loses;
        }
        function addStat(key) {
            const st = loadStats();
            st[key]++;
            try { localStorage.setItem(statsKey(), JSON.stringify(st)); } catch (e) {}
            renderStats();
        }

        /* ========= 金币与工具：通关 +2 币，工具每个 10 币 ========= */
        const TOOL_COST = 10;
        let coins = loadCoins();
        function loadCoins() {
            try { return parseInt(localStorage.getItem(coinsKey()), 10) || 0; } catch (e) { return 0; }
        }
        function saveCoins() {
            try { localStorage.setItem(coinsKey(), String(coins)); } catch (e) {}
        }
        function renderCoins() {
            document.getElementById('coinsText').textContent = coins;
            updateToolButtons();
        }
        function updateToolButtons() {
            const poor = coins < TOOL_COST;
            document.getElementById('shuffleBtn').disabled = poor || gameOver;
            document.getElementById('removeBtn').disabled = poor || gameOver || slot.length === 0;
            document.getElementById('reviveBtn').disabled = poor;
        }

        /* 打乱：把牌堆里剩余牌的图案重新洗牌（位置不动、脸型重排） */
        function useShuffle() {
            if (gameOver || coins < TOOL_COST) return;
            coins -= TOOL_COST; saveCoins(); renderCoins();
            const alive = tiles.filter(t => !t.removed);
            const faces = shuffle(alive.map(t => t.p));
            alive.forEach((t, i) => { t.p = faces[i]; });
            renderBoard();
            autoSave();
        }

        /* 移出：把槽里最后至多 3 张牌退回牌堆，腾出槽位救急 */
        function useRemove() {
            if (gameOver || coins < TOOL_COST || slot.length === 0) return;
            coins -= TOOL_COST; saveCoins(); renderCoins();
            slot.splice(-3).forEach(t => { t.removed = false; });
            renderAll();
            autoSave();
        }

        /* 复活：失败时把槽里所有牌退回牌堆、继续本局（计时继续） */
        function useRevive() {
            if (coins < TOOL_COST) return;
            coins -= TOOL_COST; saveCoins(); renderCoins();
            slot.forEach(t => { t.removed = false; });
            slot = [];
            gameOver = false;
            document.getElementById('overlay').classList.remove('show');
            resumeTimer();
            renderAll();
            autoSave();
        }

        /* 洗牌算法：把数组顺序随机打乱（发牌公平全靠它） */
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        /* 牌越多牌越小，否则屏幕装不下 */
        function pickTileSize(count) {
            if (count <= 51) return 72;
            if (count <= 102) return 60;
            if (count <= 201) return 48;
            return 40;
        }

        /* ========= 关卡布局生成器 =========
           思路：第 0 层按网格铺满 → 第 1 层错开半格铺 → 第 2 层再对齐铺……
           一层层往上堆，直到位置数够本关牌数为止 */
        function buildLayout(count, size) {
            const step = size + 8;   // 同层间距：比牌宽一点，保证同层互不重叠
            const positions = [];
            const wxL = (WX - size) / 2;
            const wxR = WX + 380 + (WX - size) / 2;
            let SIDE_H;              // 侧边堆叠区需要的高度

            /* --- ① 两侧堆叠区 ---
               第 1、2 关：每侧 1 摞 4 张的细边小叠摞
               第 3 关起：收纳本关 60% 的牌（多数），每侧 3 摞深堆，
               摞内每层微移露边，深度自动计算 */
            if (level >= 3) {
                const perSide = Math.floor(count * 0.6 / 2);
                const STACKS = 3;                          // 每侧 3 摞
                const depth = Math.ceil(perSide / STACKS); // 每摞深度
                const peek = Math.max(4, Math.round(size * 0.10));
                const pileH = size + (depth - 1) * peek;
                SIDE_H = STACKS * pileH + (STACKS - 1) * 10 + 20;
                for (let sIdx = 0; sIdx < STACKS; sIdx++) {
                    const y = 10 + sIdx * (pileH + 10);
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxL, y: y + k * peek });
                    for (let k = 0; k < depth; k++) positions.push({ layer: k, x: wxR, y: y + k * peek });
                }
            } else {
                const WING = 4;
                const peek = Math.max(6, Math.round(size * 0.12));
                const wy0 = (420 - (size + (WING - 1) * peek)) / 2;
                for (let k = 0; k < WING; k++) {
                    positions.push({ layer: k, x: wxL, y: wy0 + k * peek });
                    positions.push({ layer: k, x: wxR, y: wy0 + k * peek });
                }
                SIDE_H = 420;
            }

            /* --- 牌堆区总高度 = 侧区与中央区取大者 + 底部平铺排 --- */
            const CH = Math.max(420, SIDE_H);   // 中央区高度
            BOARD_H = CH + size + 20;

            /* --- ② 底部平铺排：单层摆一排，开局全部可点（原版的"安全区"） --- */
            const BOTTOM = 6;
            const bw = BOTTOM * step - 8;
            const bx0 = (BOARD_W - bw) / 2;
            for (let i = 0; i < BOTTOM; i++)
                positions.push({ layer: 0, x: bx0 + i * step, y: BOARD_H - size - 10 });

            /* --- ③ 中央主堆：剩下的牌进这里，交替层叠成原版标志性牌堆 --- */
            function mkGrid(x0, y0) {
                const pts = [];
                for (let y = y0; y + size <= CH - 10; y += step)
                    for (let x = x0; x + size <= WX + 380 - 10; x += step)
                        pts.push({ x, y });
                return pts;
            }
            // 所有关卡统一仿照第 1 关：上层错开半格、交叠成连续牌堆（不离散）
            const off = step / 2;
            const grids = [mkGrid(WX + 20, 20), mkGrid(WX + 20 + off, 20 + off)];

            // 向心聚拢：按"离中心距离"排序、由近及远取位置——
            // 牌少时挤成紧凑一坨，牌多时自然铺满，不会东一张西一张
            const cx = WX + 190, cy = CH / 2;   // 中央区域的中心点
            const byCenter = (a, b) =>
                ((a.x - cx) ** 2 + (a.y - cy) ** 2) - ((b.x - cx) ** 2 + (b.y - cy) ** 2);

            let layer = 0;
            while (positions.length < count) {
                const need = count - positions.length;
                const pts = grids[layer % 2].slice().sort(byCenter).slice(0, need);
                for (const p of pts) positions.push({ layer, x: p.x, y: p.y });
                layer++;
            }
            return positions;
        }

        /* 开新一局：按关卡发牌 */
        function newGame() {
            const count = LEVEL_COUNTS[level - 1];
            TILE_SIZE = pickTileSize(count);
            // 牌堆区宽度 = 左右翼列 + 中央 380 宽；高度由 buildLayout 按关卡计算
            WX = TILE_SIZE + 14;
            BOARD_W = WX + 380 + WX;
            const layout = buildLayout(count, TILE_SIZE);   // 内部同时算出 BOARD_H
            const root = document.documentElement.style;
            root.setProperty('--ts', TILE_SIZE + 'px');
            root.setProperty('--bw', BOARD_W + 'px');
            root.setProperty('--bh', BOARD_H + 'px');

            // 发牌：先算出"三元组"总数，均分给 9 种图案，
            // 保证每种图案的张数都是 3 的倍数 → 数学上永远能消干净
            const triples = count / 3;
            const base = Math.floor(triples / PATTERNS.length);
            const rem = triples % PATTERNS.length;
            const bag = [];
            for (let p = 0; p < PATTERNS.length; p++) {
                const t = base + (p < rem ? 1 : 0);   // 这种图案分到的三元组数
                for (let k = 0; k < t * 3; k++) bag.push(p);
            }
            shuffle(bag);

            tiles = layout.map((pos, i) => ({
                id: i, layer: pos.layer, x: pos.x, y: pos.y,
                p: bag[i],          // 这张牌是几号图案
                removed: false,     // 是否已被消掉/入槽
            }));
            slot = [];
            gameOver = false;
            moves = 0;
            document.getElementById('movesText').textContent = '0';
            startTimer();
            renderStats();
            renderCoins();
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('levelInfo').textContent =
                '第 ' + level + ' 关 / 共 ' + LEVEL_COUNTS.length + ' 关 · 本关 ' + count + ' 张牌';
            renderAll();
            fitScreen();
            saveLevel(level);    // 记住"上次玩到第几关"，下次打开直接接着这关
            autoSave(true);      // 新开的牌面立刻落一份盘
        }

        /* 判断一张牌是否被压住：存在"层级更高 + 位置重叠 + 还没消失"的牌 */
        function isCovered(tile) {
            return tiles.some(o =>
                !o.removed &&
                o.layer > tile.layer &&
                Math.abs(o.x - tile.x) < TILE_SIZE &&
                Math.abs(o.y - tile.y) < TILE_SIZE
            );
        }

        /* ========= 渲染：把状态画到页面上 ========= */
        function tileHTML(p) {
            const pat = PATTERNS[p];
            return '<span class="face">' + pat.emoji + '</span>' +
                '<img src="images/' + pat.file + '" onerror="this.remove()">';
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            tiles.filter(t => !t.removed)
                .sort((a, b) => a.layer - b.layer)   // 下层先画，上层盖住
                .forEach(tile => {
                    const div = document.createElement('div');
                    div.className = 'tile' + (isCovered(tile) ? ' covered' : '');
                    div.style.left = tile.x + 'px';
                    div.style.top = tile.y + 'px';
                    div.style.zIndex = tile.layer;
                    div.dataset.id = tile.id;        // 把编号存在元素上，点击时取回
                    div.innerHTML = tileHTML(tile.p);
                    board.appendChild(div);
                });
        }

        function renderSlot() {
            const cells = document.querySelectorAll('#slotBar .slot');
            cells.forEach((cell, i) => {
                cell.innerHTML = '';
                if (i < slot.length) cell.innerHTML = tileHTML(slot[i].p);
            });
        }

        function renderAll() { renderBoard(); renderSlot(); updateToolButtons(); }

        /* ========= 飞入卡槽动画 =========
           造一张"分身牌"固定在屏幕原位，用 CSS 过渡飘到目标格子，
           落地后删除分身、刷新卡槽显示 */
        function flyToSlot(tile, fromRect, cellIndex) {
            const cells = document.querySelectorAll('#slotBar .slot');
            const toRect = cells[Math.min(cellIndex, SLOT_MAX - 1)].getBoundingClientRect();
            const fly = document.createElement('div');
            fly.className = 'tile fly';
            fly.innerHTML = tileHTML(tile.p);
            fly.style.left = fromRect.left + 'px';
            fly.style.top = fromRect.top + 'px';
            fly.style.width = fromRect.width + 'px';
            fly.style.height = fromRect.height + 'px';
            document.body.appendChild(fly);

            // 双 rAF：确保浏览器先记住"起点"，再改样式触发过渡动画
            requestAnimationFrame(() => requestAnimationFrame(() => {
                fly.style.left = toRect.left + 'px';
                fly.style.top = toRect.top + 'px';
                fly.style.width = toRect.width + 'px';
                fly.style.height = toRect.height + 'px';
            }));

            const land = () => { if (fly.isConnected) { fly.remove(); renderSlot(); } };
            fly.addEventListener('transitionend', land, { once: true });
            setTimeout(land, 350);   // 保险：动画万一没触发也兜底落地
        }

        /* ========= 核心逻辑：点击一张牌 ========= */
        function onTileClick(id, fromEl) {
            if (gameOver) return;
            const tile = tiles.find(t => t.id === id);
            if (!tile || tile.removed || isCovered(tile)) return;  // 被压住的牌点不动

            const fromRect = fromEl.getBoundingClientRect();  // 先记住起飞位置
            moves++;                                          // 记一步
            document.getElementById('movesText').textContent = moves;

            // 第 1 步：牌离开牌堆
            tile.removed = true;

            // 第 2 步：插入槽位——挨着同类放，方便凑三消
            let idx = slot.length;
            for (let i = slot.length - 1; i >= 0; i--) {
                if (slot[i].p === tile.p) { idx = i + 1; break; }
            }
            slot.splice(idx, 0, tile);

            // 第 3 步：凑齐 3 只同图案 → 一起消除
            const matched = slot.filter(t => t.p === tile.p).length === 3;
            if (matched) slot = slot.filter(t => t.p !== tile.p);

            renderBoard();                 // 牌堆立刻更新（暗牌可能变亮）
            flyToSlot(tile, fromRect, idx); // 卡槽等分身落地后再刷新
            autoSave();                     // 自动存档：这一手记下来
            checkEnd();
        }

        /* ========= 胜负判定 ========= */
        function checkEnd() {
            const boardClear = tiles.every(t => t.removed);
            if (boardClear && slot.length === 0) {
                stopTimer();
                addStat('wins');
                coins += 2; saveCoins(); renderCoins();   // 通关奖赏：2 金币（存当前账号）
                const reward = '🪙 金币 +2！当前 ' + coins + ' 币';
                // 关卡进度记在账号上：下次打开直接从下一关开始
                saveLevel(level < LEVEL_COUNTS.length ? level + 1 : 1);
                if (level < LEVEL_COUNTS.length) {
                    showOverlay('🎉 第 ' + level + ' 关通关！', '下一关 →', () => { level++; newGame(); }, reward);
                } else {
                    showOverlay('🏆 太强了！十关全部通关！', '再玩一遍', () => { level = 1; newGame(); }, reward);
                }
                persistAuto();   // 此时 gameOver 已为 true → 顺手清掉"续玩快照"，免得下次读到空牌堆
            } else if (slot.length >= SLOT_MAX) {
                stopTimer();
                addStat('loses');
                showOverlay('😭 槽位满了，挑战失败！', '重试本关', () => newGame(), '🪙 当前 ' + coins + ' 金币', true);
                persistAuto();
            }
        }

        function showOverlay(msg, btnText, action, extra, showRevive) {
            gameOver = true;
            document.getElementById('overlayMsg').textContent = msg;
            document.getElementById('overlaySub').textContent =
                '当前进度：第 ' + level + ' 关 / ' + LEVEL_COUNTS.length + ' 关' +
                ' · 用时 ' + document.getElementById('timeText').textContent +
                ' · 步数 ' + moves + (extra ? ' · ' + extra : '');
            const btn = document.getElementById('overlayBtn');
            btn.textContent = btnText;
            btn.onclick = action;
            document.getElementById('reviveBtn').style.display = showRevive ? 'inline-block' : 'none';
            updateToolButtons();
            document.getElementById('overlay').classList.add('show');
        }

        /* 事件委托：整个牌堆只装一个监听器，点谁都能接到 */
        document.getElementById('board').addEventListener('click', e => {
            const el = e.target.closest('.tile');
            if (el) onTileClick(Number(el.dataset.id), el);
        });
        document.getElementById('restartBtn').addEventListener('click', () => newGame());
        document.getElementById('shuffleBtn').addEventListener('click', useShuffle);
        document.getElementById('removeBtn').addEventListener('click', useRemove);
        document.getElementById('reviveBtn').addEventListener('click', useRevive);

        /* ========= 全屏适配：按屏幕尺寸整体缩放游戏 =========
           先按 1 倍量出游戏的"自然尺寸"，再取 屏幕宽/游戏宽 与 屏幕高/游戏高
           的较小值作为缩放比——保证任何屏幕（电脑/手机）都刚好装得下、占得满 */
        function fitScreen() {
            const stage = document.getElementById('stage');
            stage.style.zoom = 1;
            const s = Math.min(innerWidth / stage.offsetWidth, innerHeight / stage.offsetHeight, 3);
            stage.style.zoom = s;
        }
        addEventListener('resize', fitScreen);   // 窗口变化/手机横竖屏切换时重新适配

        boot();   // 页面加载完成 → 先接上账号/存档/音乐，再发牌开局
    </script>
</body>
</html>
