                grid.appendChild(createThemeCard(theme, startGame));
            });
            markSelectedTheme();
        }

        function buildGameThemePicker() {
            const grid = document.getElementById('gameThemeGrid');
            grid.innerHTML = '';
            THEMES.forEach(theme => {
                grid.appendChild(createThemeCard(theme, changeGameTheme));
            });
            markSelectedTheme();
        }

        function markSelectedTheme() {
            document.querySelectorAll('.theme-card[data-theme]').forEach(card => {
                const active = Number(card.dataset.theme) === selectedTheme;
                card.classList.toggle('selected', active);
                card.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
        }

        function applyTheme(themeIndex, animate) {
            const theme = THEMES[themeIndex - 1];
            if (!theme) return;
            selectedTheme = themeIndex;
            const update = () => {
                document.documentElement.style.setProperty(
                    '--game-bg',
                    'url("' + theme.image + '")'
                );
                document.body.classList.remove('theme-switching');
                markSelectedTheme();
            };
            if (animate && gameStarted) {
                document.body.classList.add('theme-switching');
                setTimeout(update, 140);
            } else {
                update();
            }
        }

        function openGameThemePicker() {
            const picker = document.getElementById('gameThemePicker');
            if (!picker || gameOver) return;
            markSelectedTheme();
            picker.classList.add('show');
            picker.setAttribute('aria-hidden', 'false');
            pauseGame('theme');
            const selected = document.querySelector(
                '#gameThemeGrid .theme-card[data-theme="' + selectedTheme + '"]'
            );
            setTimeout(() => (selected || document.getElementById('closeGameThemes'))
                .focus({ preventScroll: true }), 70);
        }

        function closeGameThemePicker() {
            const picker = document.getElementById('gameThemePicker');
            if (!picker) return;
            picker.classList.remove('show');
            picker.setAttribute('aria-hidden', 'true');
            resumeGame('theme');
        }

        function changeGameTheme(themeIndex) {
            applyTheme(themeIndex, true);
            closeGameThemePicker();
            const theme = THEMES[themeIndex - 1];
            showGameToast('已更换为' + theme.name);
            saveProgress();
            document.getElementById('themeChangeBtn').focus({ preventScroll: true });
        }

        function openThemePicker() {
            const screen = document.getElementById('startScreen');
            screen.classList.add('theme-open');
            document.getElementById('themeScreen').setAttribute('aria-hidden', 'false');
            if (musicOn) safePlay();
            const first = document.querySelector('.theme-card');
            if (first) setTimeout(() => first.focus({ preventScroll: true }), 80);
        }

        function closeThemePicker() {
            const screen = document.getElementById('startScreen');
            screen.classList.remove('theme-open');
            document.getElementById('themeScreen').setAttribute('aria-hidden', 'true');
            document.getElementById('startBtn').focus({ preventScroll: true });
        }

        function startGame(themeIndex) {
            gameStarted = true;
            level = activeChallenge ? activeChallenge.level : 1;
            if (activeChallenge) {
                try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
            }
            pauseSources.clear();
            applyTheme(themeIndex, false);
            document.body.classList.add('in-game');
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('stage').classList.add('active');
            document.getElementById('winVideoOverlay').classList.remove('show');
            if (musicOn) safePlay();
            newGame();
        }

        function resumeSavedGame() {
            const data = loadSave();
            if (!data) {
                refreshStartOptions();
                return;
            }
            gameStarted = true;
            level = data.level;
            selectedTheme = data.theme || 1;
            activeChallenge = data.challenge || null;
            pauseSources.clear();
            applyTheme(selectedTheme, false);
            document.body.classList.add('in-game');
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('stage').classList.add('active');
            document.getElementById('winVideoOverlay').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            if (data.mode === 'fresh') {
                newGame();
                return;
            }

            TILE_SIZE = data.tileSize || pickTileSize(data.tiles.length);
            BOARD_W = data.boardWidth || 552;
            BOARD_H = data.boardHeight || 512;
            WX = data.wingWidth || TILE_SIZE + 14;
            currentBoardSeed = data.boardSeed || makeBoardSeed();
            boardRng = mulberry32(hashString(currentBoardSeed));
            const root = document.documentElement.style;
            root.setProperty('--ts', TILE_SIZE + 'px');
            root.setProperty('--bw', BOARD_W + 'px');
            root.setProperty('--bh', BOARD_H + 'px');

            tiles = data.tiles
                .filter(t => Number.isInteger(t.id) && PATTERNS[t.p])
                .map(t => ({
                    id: t.id,
                    layer: Number(t.layer) || 0,
                    x: Number(t.x) || 0,
                    y: Number(t.y) || 0,
                    p: t.p,
                    removed: !!t.removed
                }));
            slot = (data.slotIds || [])
                .map(id => tiles.find(t => t.id === id))
                .filter(Boolean);
            moves = Math.max(0, Number(data.moves) || 0);
            seconds = Math.max(0, Number(data.seconds) || 0);
            clearedCount = Math.max(0, Number(data.clearedCount) || 0);
            maxCombo = Math.max(0, Number(data.maxCombo) || 0);
            combo = 0;
            lastMatchAt = 0;
            lastSlotCount = slot.length;
            gameOver = false;
            inputLocked = false;
            hintIds.clear();
            tileEls.clear();
            document.getElementById('board').innerHTML = '';
            document.getElementById('movesText').textContent = moves;
            document.getElementById('levelInfo').textContent =
                '第 ' + level + ' / ' + LEVEL_COUNTS.length + ' 关';
            updateLevelKicker();
            updateComboUi();
            renderStats();
            renderCoins();
            renderAll();
            updateTime();
            startTimer(seconds);
            fitScreen();
            showGameToast('已恢复上次游戏进度');
        }

        function updateLevelKicker() {
            const kicker = document.querySelector('#levelBadge small');
            if (kicker) kicker.textContent = activeChallenge ? '好友挑战' : '当前关卡';
        }

        /* 开新一局：按关卡发牌 */
        function newGame() {
            if (!gameStarted) return;
            runId++;
            pauseSources.clear();
            const count = LEVEL_COUNTS[level - 1];
            currentBoardSeed = activeChallenge
                ? activeChallenge.seed
                : makeBoardSeed();
            boardRng = mulberry32(hashString(currentBoardSeed));
            TILE_SIZE = pickTileSize(count);
            // 牌堆区宽度 = 左右翼列 + 中央 380 宽；高度由 buildLayout 按关卡计算
            WX = TILE_SIZE + 14;
            BOARD_W = WX + 380 + WX;
            const layout = buildLayout(count, TILE_SIZE);   // 内部同时算出 BOARD_H
            const root = document.documentElement.style;
            root.setProperty('--ts', TILE_SIZE + 'px');
            root.setProperty('--bw', BOARD_W + 'px');
            root.setProperty('--bh', BOARD_H + 'px');

            // 发牌：先算出"三元组"总数，均分给 9 种图案，
            // 保证每种图案的张数都是 3 的倍数 → 数学上永远能消干净
            const triples = count / 3;
            const patternCount = pickPatternCount(level);
            const base = Math.floor(triples / patternCount);
            const rem = triples % patternCount;
            const bag = [];
            for (let p = 0; p < patternCount; p++) {
                const t = base + (p < rem ? 1 : 0);   // 这种图案分到的三元组数
                for (let k = 0; k < t * 3; k++) bag.push(p);
            }
            shuffle(bag, boardRng);

            tiles = layout.map((pos, i) => ({
                id: i, layer: pos.layer, x: pos.x, y: pos.y,
                p: bag[i],          // 这张牌是几号图案
                removed: false,     // 是否已被消掉/入槽
            }));
            ensureAccessibleTriple(tiles);
            slot = [];
            gameOver = false;
            inputLocked = false;
            clearedCount = 0;
            maxCombo = 0;
            hintIds.clear();
            resetCombo();
            moves = 0;
            document.getElementById('movesText').textContent = '0';
            startTimer();
            renderStats();
            renderCoins();
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('levelInfo').textContent =
                '第 ' + level + ' / ' + LEVEL_COUNTS.length + ' 关';
            updateLevelKicker();
            renderAll();
            updateProgress();
            updateSlotState();
            flashBoard('level-enter');
            fitScreen();
            saveProgress();
        }

        /* 判断一张牌是否被压住：存在"层级更高 + 位置重叠 + 还没消失"的牌 */
        function isCovered(tile) {
            return tiles.some(o =>
                !o.removed &&
                o.layer > tile.layer &&
                Math.abs(o.x - tile.x) < TILE_SIZE &&
                Math.abs(o.y - tile.y) < TILE_SIZE
            );
        }

        /* ========= 渲染：把状态画到页面上 ========= */
        function tileHTML(p) {
            const pat = PATTERNS[p];
            return '<span class="face">' + pat.emoji + '</span>' +
                '<img src="images/' + pat.file + '" onerror="this.remove()">';
        }

        function renderBoard() {
            const board = document.getElementById('board');
            const aliveIds = new Set();
            tiles.filter(t => !t.removed).forEach(tile => {
                aliveIds.add(tile.id);
                let div = tileEls.get(tile.id);
                if (!div) {
                    div = document.createElement('div');
                    div.dataset.id = tile.id;
                    tileEls.set(tile.id, div);
                    board.appendChild(div);
                }
                div.className = 'tile' +
                    (isCovered(tile) ? ' covered' : '') +
                    (hintIds.has(tile.id) ? ' hinted' : '');
                div.style.left = tile.x + 'px';
                div.style.top = tile.y + 'px';
                div.style.zIndex = tile.layer;
                if (div.dataset.pattern !== String(tile.p)) {
                    div.innerHTML = tileHTML(tile.p);
                    div.dataset.pattern = String(tile.p);
                }
            });
            for (const [id, el] of tileEls) {
                if (!aliveIds.has(id)) {
                    el.remove();
                    tileEls.delete(id);
                }
            }
        }

        function renderSlot() {
            const cells = document.querySelectorAll('#slotBar .slot');
            cells.forEach((cell, i) => {
                cell.innerHTML = '';
                cell.classList.remove('matching');
                cell.classList.toggle('filled', i < slot.length);
                if (i < slot.length) cell.innerHTML = tileHTML(slot[i].p);
            });
        }

        function renderAll() {
            renderBoard();
            renderSlot();
            updateToolButtons();
            updateSlotState();
            updateProgress();
        }

        function updateProgress() {
            const total = LEVEL_COUNTS[level - 1] || (tiles.length || 0);
            const percent = total ? Math.min(100, Math.round(clearedCount / total * 100)) : 0;
            const fill = document.getElementById('progressFill');
            fill.style.width = percent + '%';
            document.getElementById('progressText').textContent =
                clearedCount + ' / ' + total + ' 张';
        }

        function updateSlotState() {
            const count = slot.length;
            const bar = document.getElementById('slotBar');
            document.getElementById('slotCount').textContent = count + ' / ' + SLOT_MAX;
            bar.classList.toggle('warning', count >= 5 && count < 7);
            bar.classList.toggle('danger', count >= 6);
            if (count === 6 && lastSlotCount < 6 && !gameOver && !inputLocked) {
                showGameToast('槽位告急，再放一张就会失败！', 'danger');
                bar.classList.remove('shake');
                void bar.offsetWidth;
                bar.classList.add('shake');
                setTimeout(() => bar.classList.remove('shake'), 420);
            }
            lastSlotCount = count;
            updateToolButtons();
        }

        function updateComboUi() {
            document.getElementById('comboText').textContent = '×' + combo;
            document.getElementById('comboStat').classList.toggle('hot', combo >= 2);
        }

        function resetCombo() {
            if (comboTimer) clearTimeout(comboTimer);
            comboTimer = null;
            combo = 0;
            lastMatchAt = 0;
            updateComboUi();
        }

        function registerCombo() {
            const now = performance.now();
            combo = now - lastMatchAt <= 4500 ? combo + 1 : 1;
            lastMatchAt = now;
            maxCombo = Math.max(maxCombo, combo);
            updateComboUi();
            showGameToast(
                combo >= 2 ? '奶蛙连消 × ' + combo + '！' : '三只奶蛙消除成功！',
                combo >= 2 ? 'hot' : ''
            );
            if (comboTimer) clearTimeout(comboTimer);
            const currentCombo = combo;
            comboTimer = setTimeout(() => {
                if (combo === currentCombo) {
                    combo = 0;
                    lastMatchAt = 0;
                    updateComboUi();
                }
            }, 4500);
        }

        function showGameToast(message, type) {
            const toast = document.getElementById('gameToast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = type || '';
            void toast.offsetWidth;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1450);
        }

        function flashBoard(className) {
            const board = document.getElementById('board');
            board.classList.remove('level-enter', 'shuffle-flash');
            void board.offsetWidth;
            board.classList.add(className);
            setTimeout(() => board.classList.remove(className), 650);
        }

        function spawnMatchBurst() {
            const bar = document.getElementById('slotBar');
            const rect = bar.getBoundingClientRect();
            const burst = document.createElement('div');
            burst.className = 'match-burst';
            burst.style.left = (rect.left + rect.width / 2) + 'px';
            burst.style.top = (rect.top + rect.height / 2) + 'px';
            for (let i = 0; i < 10; i++) {
                const spark = document.createElement('i');
                spark.style.setProperty('--spark-angle', (i * 36) + 'deg');
                spark.style.background = i % 2 ? '#fff0a0' : '#ffbf65';
                burst.appendChild(spark);
            }
            document.body.appendChild(burst);
            setTimeout(() => burst.remove(), 650);
        }

        /* ========= 飞入卡槽动画 =========
           造一张"分身牌"固定在屏幕原位，用 CSS 过渡飘到目标格子，
           落地后删除分身、刷新卡槽显示 */
        function flyToSlot(tile, fromRect, cellIndex) {
            const cells = document.querySelectorAll('#slotBar .slot');
            const toRect = cells[Math.min(cellIndex, SLOT_MAX - 1)].getBoundingClientRect();
            const fly = document.createElement('div');
            fly.className = 'tile fly';
            fly.innerHTML = tileHTML(tile.p);
            fly.style.left = fromRect.left + 'px';
            fly.style.top = fromRect.top + 'px';
            fly.style.width = fromRect.width + 'px';
            fly.style.height = fromRect.height + 'px';
            document.body.appendChild(fly);

            // 双 rAF：确保浏览器先记住"起点"，再改样式触发过渡动画
            requestAnimationFrame(() => requestAnimationFrame(() => {
                fly.style.left = toRect.left + 'px';
                fly.style.top = toRect.top + 'px';
                fly.style.width = toRect.width + 'px';
                fly.style.height = toRect.height + 'px';
            }));

            const land = () => { if (fly.isConnected) { fly.remove(); renderSlot(); } };
            fly.addEventListener('transitionend', land, { once: true });
            setTimeout(land, 350);   // 保险：动画万一没触发也兜底落地
        }

        /* 每次点牌，在点击位置随机弹出一张奶蛙小时候的透明图片 */
        function spawnBabyEffect(x, y) {
            const img = document.createElement('img');
            img.className = 'baby-pop';
            img.src = BABY_EFFECTS[Math.floor(Math.random() * BABY_EFFECTS.length)];
            img.alt = '';
            img.draggable = false;
            img.style.left = x + 'px';
            img.style.top = y + 'px';
            img.style.setProperty('--baby-rotate', (Math.random() * 16 - 8).toFixed(1) + 'deg');
            document.body.appendChild(img);
            const remove = () => { if (img.isConnected) img.remove(); };
            img.addEventListener('animationend', remove, { once: true });
            setTimeout(remove, 900);
        }

        /* ========= 核心逻辑：点击一张牌 ========= */
        function onTileClick(id, fromEl, clickX, clickY) {
            if (gameOver || inputLocked) return;
            const tile = tiles.find(t => t.id === id);
            if (!tile || tile.removed) return;
            const rect = fromEl.getBoundingClientRect();
            spawnBabyEffect(
                clickX || rect.left + rect.width / 2,
                clickY || rect.top + rect.height / 2
            );
            if (isCovered(tile)) {
                showGameToast('这张牌被压住了，先清理上面的牌');
                return;
            }

            const fromRect = fromEl.getBoundingClientRect();  // 先记住起飞位置
            moves++;                                          // 记一步
            document.getElementById('movesText').textContent = moves;

            // 第 1 步：牌离开牌堆
            tile.removed = true;

            // 第 2 步：插入槽位——挨着同类放，方便凑三消
            let idx = slot.length;
            for (let i = slot.length - 1; i >= 0; i--) {
                if (slot[i].p === tile.p) { idx = i + 1; break; }
            }
            slot.splice(idx, 0, tile);

            // 第 3 步：凑齐 3 只同图案 → 一起消除
            const matchedTiles = slot.filter(t => t.p === tile.p);
            const matched = matchedTiles.length === 3;
            if (matched) inputLocked = true;

            renderBoard();                 // 牌堆立刻更新（暗牌可能变亮）
            flyToSlot(tile, fromRect, idx); // 卡槽等分身落地后再刷新
            updateSlotState();

            if (matched) {
                updateToolButtons();
                const currentRun = runId;
                const matchedPattern = tile.p;
                setTimeout(() => {
                    if (currentRun !== runId) return;
                    renderSlot();
                    const cells = Array.from(document.querySelectorAll('#slotBar .slot'));
                    const matchIndexes = [];
                    slot.forEach((item, i) => {
                        if (item.p === matchedPattern) matchIndexes.push(i);
                    });
                    matchIndexes.forEach(i => cells[i] && cells[i].classList.add('matching'));
                    spawnMatchBurst();
                    registerCombo();

                    setTimeout(() => {
                        if (currentRun !== runId) return;
                        slot = slot.filter(t => t.p !== matchedPattern);
                        clearedCount += matchedTiles.length;
                        inputLocked = false;
                        renderAll();
                        if (!checkEnd()) saveProgress();
                    }, 330);
                }, 360);
            } else {
                if (!checkEnd()) saveProgress();
            }
        }

        /* ========= 胜负判定 ========= */
        function checkEnd() {
            const boardClear = tiles.every(t => t.removed);
            if (boardClear && slot.length === 0) {
                stopTimer();
                addStat('wins');
                coins += 2; saveCoins(); renderCoins();   // 通关奖赏：2 金币（存本机浏览器）
                const finalRound = level >= LEVEL_COUNTS.length;
                const nextLevel = finalRound ? 1 : level + 1;
                showWinVideo(nextLevel, finalRound);
                return true;
            } else if (slot.length >= SLOT_MAX) {
                stopTimer();
                addStat('loses');
                showOverlay('😭 槽位满了，挑战失败！', '重试本关', () => newGame(), '🪙 当前 ' + coins + ' 金币', true);
                return true;
            }
            return false;
        }

        function buildChallengeUrl() {
            const url = new URL(location.href);
            url.search = '';
            url.hash = '';
            url.searchParams.set('challenge', currentBoardSeed || makeBoardSeed());
            url.searchParams.set('level', String(level));
            url.searchParams.set('time', String(seconds));
            url.searchParams.set('moves', String(moves));
            url.searchParams.set('combo', String(maxCombo));
            url.searchParams.set('theme', String(selectedTheme));
            return url.toString();
        }

        function copyTextFallback(text) {
            const area = document.createElement('textarea');
            area.value = text;
            area.style.position = 'fixed';
            area.style.opacity = '0';
            area.style.pointerEvents = 'none';
            document.body.appendChild(area);
            area.focus();
            area.select();
            let copied = false;
            try { copied = document.execCommand('copy'); } catch (e) {}
            area.remove();
            return copied;
        }

        async function shareCurrentChallenge() {
            const url = buildChallengeUrl();
            const text =
                '我在《奶了个蛙》第 ' + level + ' 关完成挑战：' +
                formatClock(seconds) + '、' + moves + ' 步、最高连消 ×' +
                maxCombo + '。来挑战同一副牌！';
            try {
                if (navigator.share) {
                    await navigator.share({ title: '奶了个蛙挑战', text, url });
                    showGameToast('挑战分享已打开');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text + '\n' + url);
                    showGameToast('挑战链接已复制');
                    return;
                }
            } catch (e) {
                if (e && e.name === 'AbortError') return;
            }
            if (copyTextFallback(text + '\n' + url)) {
                showGameToast('挑战链接已复制');
            } else {
                window.prompt('复制下面的挑战链接发给好友：', url);
            }
        }

        /* 过关后随机播放一段大笑视频，视频下方展示下一关信息 */
        function showWinVideo(nextLevel, finalRound) {
            gameOver = true;
            updateToolButtons();
            document.getElementById('overlay').classList.remove('show');
            if (bgmEl) safePause();
            saveFreshCheckpoint(nextLevel, null);

            const video = document.getElementById('winVideo');
            const overlay = document.getElementById('winVideoOverlay');
            video.pause();
            video.controls = false;
            video.muted = false;
            video.src = WIN_VIDEOS[Math.floor(Math.random() * WIN_VIDEOS.length)];
            video.load();

            const againstFriend = activeChallenge && activeChallenge.level === level;
            let challengeResult = '';
            if (againstFriend) {
                const timeDiff = seconds - activeChallenge.seconds;
                const moveDiff = moves - activeChallenge.moves;
                if (timeDiff < 0 || (timeDiff === 0 && moveDiff < 0)) {
                    challengeResult = ' · 你赢了，比好友更快！';
                } else if (timeDiff > 0 || moveDiff > 0) {
                    challengeResult = ' · 再试一次可能更快！';
                } else {
                    challengeResult = ' · 和好友打成平手！';
                }
            }
            document.getElementById('winVideoTitle').textContent = againstFriend
                ? '⚔️ 好友挑战完成！'
                : (finalRound ? '🏆 十关通关，奶蛙笑疯了！' : '🎉 第 ' + level + ' 关通关！');
            document.getElementById('winVideoSub').textContent =
                '🪙 金币 +2 · ' + formatClock(seconds) + ' · ' + moves +
                ' 步 · 最高连消 ×' + maxCombo + challengeResult;
            document.getElementById('shareChallengeBtn').onclick = shareCurrentChallenge;
            document.getElementById('shareChallengeBtn').textContent = againstFriend
                ? '📤 把这个挑战再发给朋友'
                : '📤 挑战好友 · 分享相同牌局';

            const btn = document.getElementById('nextLevelBtn');
            btn.querySelector('strong').textContent = finalRound ? '再玩一遍' : '下一关';
            document.getElementById('nextLevelCount').textContent =
                finalRound ? '第 1 关 · 27 张卡牌' :
                '第 ' + nextLevel + ' 关 · ' + LEVEL_COUNTS[nextLevel - 1] + ' 张卡牌';
            btn.onclick = () => {
                video.pause();
                video.removeAttribute('src');
                video.load();
                overlay.classList.remove('show');
                overlay.setAttribute('aria-hidden', 'true');
                level = nextLevel;
                activeChallenge = null;
                newGame();
                if (musicOn) {
                    if (bgmEl) bgmEl.volume = 0;
                    safePlay();
                    fadeBgm(musicVol);
                }
            };

            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
            playWinVideo();
        }

        /* 直接播放画面；若浏览器拦截带声音的自动播放，就静音续播而不是显示控制条 */
        function playWinVideo() {
            const video = document.getElementById('winVideo');
            try {
                const playing = video.play();
                if (playing && typeof playing.catch === 'function') {
                    playing.catch(() => {
                        video.muted = true;
                        const fallback = video.play();
                        if (fallback && typeof fallback.catch === 'function') {
                            fallback.catch(() => {});
                        }
                    });
                }
            } catch (e) {
                try {
                    video.muted = true;
                    video.play().catch(() => {});
                } catch (err) {}
            }
        }

        /* 播放框贴合每段视频的原始比例，铺满的同时不裁掉奶蛙脸部 */
        function syncWinVideoAspect() {
            const video = document.getElementById('winVideo');
            const frame = document.querySelector('.win-video-frame');
            if (!frame || !video.videoWidth || !video.videoHeight) return;
            frame.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
        }

        function showOverlay(msg, btnText, action, extra, showRevive) {
            gameOver = true;
            if (showRevive) saveFreshCheckpoint(level, activeChallenge);
            document.getElementById('overlayMsg').textContent = msg;
            document.getElementById('overlaySub').textContent =
                '当前进度：第 ' + level + ' 关 / ' + LEVEL_COUNTS.length + ' 关' +
                ' · 用时 ' + document.getElementById('timeText').textContent +
                ' · 步数 ' + moves + (extra ? ' · ' + extra : '');
            const btn = document.getElementById('overlayBtn');
            btn.textContent = btnText;
            btn.onclick = action;
            document.getElementById('reviveBtn').style.display = showRevive ? 'inline-block' : 'none';
            updateToolButtons();
            document.getElementById('overlay').classList.add('show');
        }

        /* 事件委托：整个牌堆只装一个监听器，点谁都能接到 */
        document.getElementById('board').addEventListener('click', e => {
            const el = e.target.closest('.tile');
            if (el) onTileClick(Number(el.dataset.id), el, e.clientX, e.clientY);
        });
        document.getElementById('winVideo').addEventListener('loadedmetadata', syncWinVideoAspect);
        document.getElementById('continueGameBtn').addEventListener('click', resumeSavedGame);
        document.getElementById('startBtn').addEventListener('click', openThemePicker);
        document.getElementById('themeBackBtn').addEventListener('click', closeThemePicker);
        document.getElementById('themeChangeBtn').addEventListener('click', openGameThemePicker);
        document.getElementById('closeGameThemes').addEventListener('click', closeGameThemePicker);
        document.getElementById('gameThemePicker').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeGameThemePicker();
        });
        addEventListener('keydown', e => {
            if (e.key === 'Escape' &&
                document.getElementById('gameThemePicker').classList.contains('show')) {
                closeGameThemePicker();
            }
        });
        document.getElementById('restartBtn').addEventListener('click', () => newGame());
        document.getElementById('shuffleBtn').addEventListener('click', useShuffle);
        document.getElementById('removeBtn').addEventListener('click', useRemove);
        document.getElementById('reviveBtn').addEventListener('click', useRevive);

        /* ========= 全屏适配：按屏幕尺寸整体缩放游戏 =========
           先按 1 倍量出游戏的"自然尺寸"，再取 屏幕宽/游戏宽 与 屏幕高/游戏高
           的较小值作为缩放比——保证任何屏幕（电脑/手机）都刚好装得下、占得满。
           body 有 8px 内边距，算的时候要扣掉，否则上下各被裁掉一截。 */
        const SCREEN_PAD = 16;   // 左右/上下各 8px
        function fitScreen() {
            const stage = document.getElementById('stage');
            if (!gameStarted) {
                stage.style.zoom = 1;
                return;
            }
            stage.style.zoom = 1;
            const aw = Math.max(120, innerWidth - SCREEN_PAD);
            const ah = Math.max(120, innerHeight - SCREEN_PAD);
            const s = Math.min(aw / stage.offsetWidth, ah / stage.offsetHeight, 3);
            stage.style.zoom = s;
        }
        addEventListener('resize', fitScreen);   // 窗口变化/手机横竖屏切换时重新适配
        addEventListener('load', fitScreen);     // 字体、图片都到位后再量一次，避免首屏算小

        buildThemePicker();
        buildGameThemePicker();
        refreshStartOptions();
        renderStats();
        renderCoins();
        initMusic(); // 背景音乐：沿用上次的开关和音量，开始播放
    </script>
</body>
</html>
